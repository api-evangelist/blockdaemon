naftiko: 1.0.0-alpha2
info:
  label: Blockdaemon RPC API — Solana
  description: JSON-RPC access to Solana mainnet via the Blockdaemon shared RPC tier.
  tags:
  - Blockdaemon
  - RPC
  - Solana
  - JSON-RPC
  created: '2026-05-25'
  modified: '2026-05-25'
binds:
- namespace: env
  keys:
    BLOCKDAEMON_API_KEY: BLOCKDAEMON_API_KEY
capability:
  consumes:
  - type: http
    namespace: rpc-solana
    baseUri: https://svc.blockdaemon.com
    description: Solana JSON-RPC endpoint.
    resources:
    - name: solana-rpc
      path: /solana/mainnet/native
      operations:
      - name: solrpccall
        method: POST
        description: Send a Solana JSON-RPC method (getSlot, getBalance, getTransaction, sendTransaction, etc.).
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: JSON-RPC 2.0 request body.
          required: true
    authentication:
      type: apikey
      key: X-API-Key
      value: '{{env.BLOCKDAEMON_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: rpc-solana-rest
    port: 8080
    description: REST adapter that forwards Solana JSON-RPC calls.
    resources:
    - path: /v1/solana/rpc
      name: solana-rpc
      description: Forward a JSON-RPC request to Solana.
      operations:
      - method: POST
        name: solrpccall
        description: Forward Solana JSON-RPC body.
        call: rpc-solana.solrpccall
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: rpc-solana-mcp
    port: 9090
    transport: http
    description: MCP adapter for Solana JSON-RPC.
    tools:
    - name: blockdaemon-solana-rpc
      description: Send a Solana JSON-RPC request.
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: rpc-solana.solrpccall
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
