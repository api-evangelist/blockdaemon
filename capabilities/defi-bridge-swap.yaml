naftiko: 1.0.0-alpha2
info:
  label: Blockdaemon DeFi API — Bridge Swaps
  description: Cross-chain bridge swap pricing, aggregation, transaction construction, unlock, and tracking via
    the Blockdaemon DeFi API.
  tags:
  - Blockdaemon
  - DeFi
  - Bridge
  - Cross-Chain
  created: '2026-05-25'
  modified: '2026-05-25'
binds:
- namespace: env
  keys:
    BLOCKDAEMON_API_KEY: BLOCKDAEMON_API_KEY
capability:
  consumes:
  - type: http
    namespace: defi-bridge-swap
    baseUri: https://api.expand.network
    description: DeFi API bridge endpoints.
    resources:
    - name: bridge-price
      path: /bridge/getprice
      operations:
      - name: getbridgeprice
        method: GET
        description: Real-time swap quotation for transferring tokens between chains.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: bridgeId
          in: query
          type: string
          required: true
        - name: from
          in: query
          type: string
          required: true
        - name: to
          in: query
          type: string
          required: true
        - name: amount
          in: query
          type: string
          required: true
    - name: bridge-quotes
      path: /bridge/getquotes
      operations:
      - name: getbridgequotes
        method: GET
        description: Aggregate bridge quotes across supported bridges.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: from
          in: query
          type: string
          required: true
        - name: to
          in: query
          type: string
          required: true
        - name: amount
          in: query
          type: string
          required: true
    - name: bridge-swap
      path: /bridge/swap
      operations:
      - name: createbridgeswap
        method: POST
        description: Create a cross-chain bridge swap transaction.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          required: true
    - name: bridge-tx
      path: /bridge/transactions
      operations:
      - name: getbridgetransaction
        method: GET
        description: Track a specific bridge transaction.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: hash
          in: query
          type: string
          required: true
    authentication:
      type: apikey
      key: X-API-Key
      value: '{{env.BLOCKDAEMON_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: defi-bridge-swap-rest
    port: 8080
    description: REST adapter for bridge swaps.
    resources:
    - path: /v1/defi/bridge/swap
      name: bridge-swap
      description: REST surface for bridge swap creation.
      operations:
      - method: POST
        name: createbridgeswap
        description: Create a bridge swap.
        call: defi-bridge-swap.createbridgeswap
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: defi-bridge-swap-mcp
    port: 9090
    transport: http
    description: MCP adapter for bridge swaps.
    tools:
    - name: blockdaemon-get-bridge-quotes
      description: Aggregate bridge quotes.
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: defi-bridge-swap.getbridgequotes
      with:
        from: tools.from
        to: tools.to
        amount: tools.amount
      outputParameters:
      - type: object
        mapping: $.
    - name: blockdaemon-create-bridge-swap
      description: Create a cross-chain bridge swap.
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: defi-bridge-swap.createbridgeswap
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: blockdaemon-get-bridge-tx
      description: Track a specific bridge transaction.
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: defi-bridge-swap.getbridgetransaction
      with:
        hash: tools.hash
      outputParameters:
      - type: object
        mapping: $.
