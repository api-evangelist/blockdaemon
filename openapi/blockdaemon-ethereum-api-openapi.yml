openapi: 3.2.0
info:
  version: 1.0.0
  title: Staking Ethereum API
  description: 'The Blockdaemon Staking API simplifies and streamlines institutional cryptocurrency staking. The API allows developers to interact with blockchain networks and perform various staking-related operations, such as delegating and undelegating tokens, in a single, unified interface.


    With the Staking API, you can quickly and easily build and deploy applications that automate staking activities and increase efficiency in your blockchain operations.'
  contact:
    name: Blockdaemon
    email: info@blockdaemon.com
    url: https://blockdaemon.com
  x-logo:
    url: https://assets-global.website-files.com/633c5e06513fa35f3391a5f9/645d33beb6fa65f6cfb95eb8_BD%20Logo%20Stack%20-%20Purple.svg
    backgroundColor: '#fafafa'
    altText: Blockdaemon logo
servers:
- url: https://svc.blockdaemon.com/boss
security:
- ApiKeyAuth: []
tags:
- name: Ethereum
  description: Ethereum endpoints
paths:
  /v1/eth2-launchpad-deposit:
    post:
      summary: Generate an Ethereum Launchpad Deposit File
      operationId: generateEthereumLaunchpadDeposit
      tags:
      - Ethereum
      description: Generates an Ethereum Launchpad deposit string for one or more validators. The resulting JSON file will allow you to execute the deposit manually on the official Ethereum Deposit Launchpad web-site.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateEthereumLDParams'
      responses:
        '200':
          description: Launchpad deposit string created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EthereumLaunchpadDeposit'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: validator(s) stake(s) not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/NoValidatorsError'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
  /v1/ethereum/{network}/consolidation-intents:
    parameters:
    - $ref: '#/components/parameters/EthereumNetwork'
    post:
      summary: Generate validator consolidation intent
      operationId: postEthereumCompoundingIntent
      tags:
      - Ethereum
      description: 'Generates a signed intent message to consolidate validator balances by transferring

        funds from a source validator to a target validator. This operation enables balance

        consolidation and can also upgrade withdrawal credentials from Type 1 (0x01) to Type 2 (0x02).


        **Consolidation Types:**

        - **Type 1 to Type 2**: Upgrades a validator from regular withdrawals (0x01) to compounding (0x02)

        - **Type 1 to Type 2**: Consolidates funds from a Type 1 validator to an existing Type 2 validator

        - **Type 2 to Type 2**: Consolidates funds between two Type 2 (compounding) validators


        **Key Notes:**

        - Upgrading from Type 1 to Type 2 is **permanent and irreversible**.

        - After Type 2 upgrade:

        - **Max effective balance (MaxEB)** increases to **2048 ETH**.

        - **Partial withdrawals** become available for balances **above 32 ETH**.

        - Processing may take **several days** to complete across consensus and execution layers.

        - **Consolidation transfers the entire balance** from source to target validator.


        **Prerequisites:**

        - Source validator must be **active or eligible**.

        - Target validator must be **active and valid**.

        - Source validator must **not already** use Type 2 withdrawal credentials (for Type 1 to Type 2 upgrades).

        - No conflicting pending operations (e.g., exits, withdrawals).


        **Costs & Timing:**

        - Consolidation requires on-chain transaction; gas fees apply and execution may take hours or days.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewConsolidationIntentEthereum'
      responses:
        '200':
          description: Intent created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EthereumConsolidationIntentResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/NoValidatorsError'
      security:
      - ApiKeyAuth: []
  /v1/ethereum/{network}/queue-progress/active-exiting:
    post:
      summary: Estimate Ethereum validators progress in the active-exiting queue
      operationId: ActiveExitingQueueProgress
      tags:
      - Ethereum
      description: Retrieve Ethereum validator in the active-exiting queue
      parameters:
      - $ref: '#/components/parameters/EthereumNetwork'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EthereumQueuesProgressRequest'
      responses:
        '200':
          $ref: '#/components/responses/EthereumQueuesProgress'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
  /v1/ethereum/{network}/queue-progress/pending-queued:
    post:
      summary: Estimate Ethereum validators progress in the pending-queued queue
      operationId: PendingQueuedProgress
      tags:
      - Ethereum
      description: Retrieve Ethereum validator in the pending-queued queue
      parameters:
      - $ref: '#/components/parameters/EthereumNetwork'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EthereumQueuesProgressRequest'
      responses:
        '200':
          $ref: '#/components/responses/EthereumQueuesProgress'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
  /v1/ethereum/{network}/signed-voluntary-exit:
    get:
      summary: Generate a Signed Voluntary Exit Message
      operationId: generateSignedVoluntaryExit
      tags:
      - Ethereum
      description: 'Generates a voluntary exit message, but does not broadcast it to the network.

        Instead, the signed message is returned as part of the response.

        You can use the Native Ubiquity API for Ethereum to broadcast the message.


        ---


        - An exit message can be generated shortly after staking, once the validator shows a status on the consensus layer, typically within 7 hours after paying the deposit.

        - Broadcasting or executing the exit is only possible after the validator reaches active status and has completed the activation queue.


        `Note`: The validator must remain active for a minimum of 256 epochs, or approximately 27 hours, as per the Ethereum protocol rules.'
      parameters:
      - $ref: '#/components/parameters/EthereumNetwork'
      - $ref: '#/components/parameters/ShowEthereumForkVersion'
      - $ref: '#/components/parameters/EthereumValidatorIndexParam'
      - $ref: '#/components/parameters/EthereumValidatorPublicKey'
      - $ref: '#/components/parameters/EthereumExitEpoch'
      responses:
        '200':
          $ref: '#/components/responses/EthereumExitValidatorTx'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: validator not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/NoValidatorsError'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
  /v1/ethereum/{network}/stake-intents:
    parameters:
    - $ref: '#/components/parameters/EthereumNetwork'
    - $ref: '#/components/parameters/IdempotencyKey'
    - $ref: '#/components/parameters/ValidatorType'
    post:
      summary: Post Stake Intent
      operationId: postEthereumStakeIntent
      tags:
      - Ethereum
      description: 'Reserves one or more available validators and returns an unsigned transaction.

        Supports 0x01 withdrawal address types.

        The validators will remain reserved for 90 days or until the returned transaction is signed and confirmed in the network. Blockdaemon reserves the right to free any allocated resources if the transaction is not confirmed in time.


        A single transaction can create up to 250 validators through the use of the Blockdaemon batch deposit contract which delivers over 50% reduction in gas fees when compared to submitting individual transactions for each deposit.


        To complete the staking process, you must sign an Ethereum transaction with a data field set to match the returned `unsigned_transaction` property of the response. The `recipient` of the transaction must be set to the `contract_address` property of the response. The account signing the transaction must have the sufficient balance to create the requested number of validators and this amount must be provided as the value of the signed transaction.


        For DVT plans (as indicated by `plan_id`), the `validator_type` value must be 0x02.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewStakeIntentEthereum'
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EthereumStakeIntentResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/NoValidatorsError'
      security:
      - ApiKeyAuth: []
  /v1/ethereum/{network}/topup-intents:
    parameters:
    - $ref: '#/components/parameters/EthereumNetwork'
    post:
      summary: Post Top up Intent
      operationId: postEthereumTopUpIntent
      tags:
      - Ethereum
      description: 'Adds additional balance to one or more eligible validators and returns an unsigned transaction.

        Only withdrawal credentials of type **0x02** are supported.

        If a validator uses 0x01 credentials or if the combined value of the additional deposit and the validator''s current effective balance exceeds **2048 ETH**, the deposit will not be processed.


        The unsigned transaction remains valid for up to 90 days or until it is signed and confirmed on the network.


        Through the Blockdaemon batch deposit contract,

        a single transaction can top up up to 250 validators simultaneously,

        delivering over 50% gas fee savings compared to submitting separate transactions for each validator.


        To complete the staking process, you must sign an Ethereum transaction

        with a data field

        set to match the returned `unsigned_transaction` property of the response.

        The `recipient` of the transaction must be set to the `contract_address`

        property of the response. The account signing the transaction must have

        the sufficient balance to top up the requested number of validators and

        this amount must be provided as the value of the signed transaction.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewEthereumTopUpIntent'
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EthereumTopUpIntent'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/NoValidatorsError'
      security:
      - ApiKeyAuth: []
  /v1/ethereum/{network}/voluntary-exit:
    post:
      summary: Exit Ethereum Validator
      operationId: exitEthereumValidator
      tags:
      - Ethereum
      description: Generates an Ethereum voluntary exit message and broadcasts it to the network.
      parameters:
      - $ref: '#/components/parameters/EthereumNetwork'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExitEthereumValidator'
      responses:
        '202':
          description: Transaction was generated and submitted for processing.
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ValidatorNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/NoValidatorsError'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      x-inbound-policy:
      - apikey-check
      - auth-policy
      - ip-check
      - boss-eth-exit-product-check
      - rate-limit-inbound
  /v1/ethereum/{network}/voluntary-exits:
    post:
      summary: Exit Ethereum Validators
      operationId: exitEthereumValidators
      tags:
      - Ethereum
      x-inbound-policy:
      - apikey-check
      - auth-policy
      - ip-check
      - boss-eth-exit-product-check
      - rate-limit-inbound
      description: 'Generates an Ethereum voluntary exit message and broadcasts it to the network.

        With most error codes, a list of the correctly processed validators is returned. Use it to check which validators will be exited.'
      parameters:
      - $ref: '#/components/parameters/EthereumNetwork'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Data about a list of validators (up to 500) to exit.
              required:
              - validator_identifiers
              properties:
                validator_identifiers:
                  type: array
                  items:
                    $ref: '#/components/schemas/EthereumValidatorIdentifier'
                  maxItems: 500
                  description: Contains a list of validators to exit.
      responses:
        '200':
          description: A list of validators was exited correctly.
          content:
            application/json:
              schema:
                type: object
                description: A list of validators was exited correctly.
                required:
                - code
                - message
                properties:
                  code:
                    type: integer
                    format: int32
                    description: Correct execution
                    example: 200
                  message:
                    type: string
                    description: Confirmation message
                    example: Detailed human-readable diagnostic message
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ValidatorNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/NoValidatorsError'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
    get:
      summary: List of Ethereum voluntary exits
      operationId: listEthereumExits
      tags:
      - Ethereum
      x-inbound-policy:
      - apikey-check
      - auth-policy
      - ip-check
      - boss-eth-exit-product-check
      - rate-limit-inbound
      description: Lists all the Ethereum voluntary exits that have been generated by the system.
      parameters:
      - $ref: '#/components/parameters/EthereumNetwork'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          $ref: '#/components/responses/ListEthereumExits'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
  /v1/ethereum/{network}/withdrawable-amount/{withdrawal_address}:
    parameters:
    - $ref: '#/components/parameters/EthereumNetwork'
    - $ref: '#/components/parameters/WithdrawalAddress'
    get:
      summary: Get Ethereum Withdrawable Amount
      operationId: getEthWithdrawableAmount
      tags:
      - Ethereum
      description: Returns the total staked amount that can be withdrawn across a customer's 0x02 validators on the network with the given withdrawal address. Withdrawable amount per validator is calculated as 'withdrawable_amount = balance - minimum_deposit - pending_withdrawals'. Withdrawable amount does not include the balances of validators that can be exited and fully withdrawn.
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EthereumWithdrawableAmount'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - ApiKeyAuth: []
  /v1/ethereum/{network}/withdrawal-intents/exit:
    parameters:
    - $ref: '#/components/parameters/EthereumNetwork'
    post:
      summary: Generate a validator full exit intent message
      operationId: postEthereumWithdrawalIntentExit
      tags:
      - Ethereum
      description: 'Generates an exit message that a user can sign as part of an exit transaction and submit to the official Ethereum

        withdrawal smart contract. The response includes the withdrawal contract address for the specified network in the

        request path.


        To successfully submit an exit withdrawal intent, the validator must meet the following conditions:

        - The withdrawal credentials prefix must be either ''0x01'' or ''0x02'' and contain the withdrawal address.

        - The validator must be in an active state and have been active for at least 256 epochs.

        - The validator''s balance must be greater than ''0'' Gwei.

        - There must be no pending partial withdrawals with a total sum exceeding ''0'' Gwei.


        **Important:** A successful transaction to the withdrawal smart contract does not guarantee that the validator will

        exit on the Consensus Layer (CL), as validator state changes may affect the process. Standard gas fees will apply

        regardless of the CL outcome.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewWithdrawalEthereum'
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EthereumWithdrawalResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/NoValidatorsError'
      security:
      - ApiKeyAuth: []
  /v1/ethereum/{network}/withdrawal-intents/partial:
    parameters:
    - $ref: '#/components/parameters/EthereumNetwork'
    post:
      summary: Generate a validator partial withdrawal intent message
      operationId: postEthereumWithdrawalIntentPartial
      tags:
      - Ethereum
      description: 'Generates an partial withdrawal message that a user can sign as part of an exit transaction and submit to the official

        Ethereum withdrawal smart contract. The response includes the withdrawal contract address for the specified network in the

        request path.


        To successfully submit an exit withdrawal intent, the validator must meet the following conditions:

        - The withdrawal credentials prefix must be type ''0x02'' and contain the withdrawal address.

        - The validator must be in an active state and have been active for at least 256 epochs.

        - The validator''s balance must be greater than (32000000000 Gwei + total sum of pending partial withdrawals).

        - The validator''s effective balance must be 32000000000 Gwei or greater.


        Standard gas fees will apply.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Required data for Ethereum partial withdrawal
              required:
              - withdrawal_address
              - validator
              - amount
              properties:
                withdrawal_address:
                  $ref: '#/components/schemas/EthereumAddress'
                validator:
                  $ref: '#/components/schemas/EthereumValidatorPublicKey'
                amount:
                  $ref: '#/components/schemas/Gwei'
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EthereumWithdrawalResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/NoValidatorsError'
      security:
      - ApiKeyAuth: []
components:
  parameters:
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      description: the unique idempotency key for this request
      example: f1c971b4-7114-4c4b-8ad2-a6f9e33e2cd0
      schema:
        type: string
        format: uuid
      required: false
    EthereumValidatorPublicKey:
      name: validator_public_key
      in: query
      description: Validator public key
      schema:
        $ref: '#/components/schemas/EthereumValidatorPublicKey'
    ValidatorType:
      name: validator_type
      in: query
      description: Type of validator to create (0x01 for standard, 0x02 for Pectra).  Must be `0x02` for DVT plan types.
      required: false
      schema:
        type: string
        enum:
        - '0x01'
        - '0x02'
        default: '0x01'
    EthereumValidatorIndexParam:
      name: validator_index
      in: query
      schema:
        type: integer
        description: Validator index
        format: uint64
        example: 25
    EthereumNetwork:
      name: network
      in: path
      description: Ethereum network
      required: true
      schema:
        $ref: '#/components/schemas/EthereumNetwork'
    PerPage:
      in: query
      name: per_page
      required: false
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 1000
        default: 250
      description: The number of items to include on a single page
    Page:
      in: query
      name: page
      required: false
      schema:
        type: integer
        format: int64
        minimum: 1
        default: 1
      description: The result set page to view
    ShowEthereumForkVersion:
      name: show_fork_version
      in: query
      description: 'When this parameter is set to `true`, the response will include the field `fork_version` indicating the fork version constant for the currently active fork.


        The fork versions values are unique for each network and each fork. As an example, here is the constants preset file for Mainnet:

        https://github.com/ethereum/consensus-specs/blob/dev/configs/mainnet.yaml'
      required: false
      schema:
        type: boolean
    EthereumExitEpoch:
      name: epoch
      in: query
      schema:
        type: integer
        description: 'Earliest epoch when voluntary exit can be processed.

          If not provided the earliest possible epoch will be fetched from the network.

          '
        format: uint64
        example: 1001
    WithdrawalAddress:
      name: withdrawal_address
      in: path
      description: Withdrawal address
      required: true
      schema:
        $ref: '#/components/schemas/EthereumAddress'
  schemas:
    OnchainValidatorStatus:
      type: string
      description: 'On-chain status of the validator.

        Reference: https://docs.blockdaemon.com/docs/eth-validator-statuses

        '
      enum:
      - pending_initialized
      - pending_queued
      - active_ongoing
      - active_exiting
      - active_slashed
      - exited_unslashed
      - exited_slashed
      - withdrawal_possible
      - withdrawal_done
      - unknown
    NewEthereumTopUp:
      type: object
      description: Required data for Ethereum validator top up
      required:
      - public_key
      - amount
      properties:
        public_key:
          $ref: '#/components/schemas/PublicKey'
        amount:
          $ref: '#/components/schemas/Gwei'
    VoluntaryExits:
      type: array
      description: List of voluntary exits
      items:
        $ref: '#/components/schemas/EthereumVoluntaryExit'
    PlanId:
      type: string
      description: This feature enables you to stake to validators from the specified plan(s). When no plan id is specified, validators across all plans that match the API route will be available for staking. If it is a shared plan, you can to stake to validators on a shared node from the specified plan.
      example: plan_Wgx98Rbi8nQuL9ddn3mTk1
    StakeIntentEthereumStake:
      type: object
      description: Individual Ethereum Stake Response
      required:
      - stake_id
      - amount
      - validator_public_key
      - withdrawal_credentials
      - fee_recipient
      properties:
        stake_id:
          $ref: '#/components/schemas/StakeId'
        amount:
          $ref: '#/components/schemas/Gwei'
        validator_public_key:
          $ref: '#/components/schemas/PublicKey'
        withdrawal_credentials:
          $ref: '#/components/schemas/EthereumWithdrawalCredentials'
        fee_recipient:
          $ref: '#/components/schemas/FeeRecipient'
    EthereumQueuesProgress:
      type: object
      required:
      - validators
      properties:
        last_updated:
          type: string
          description: Time validator state was recorded
          example: '2024-04-15 08:23:00'
        validators:
          type: array
          items:
            $ref: '#/components/schemas/ValidatorQueueProgress'
    EthereumNetwork:
      type: string
      description: Ethereum network
      enum:
      - mainnet
      - hoodi
    CommonWithdrawalResponse:
      type: object
      required:
      - withdraw_intent_id
      - customer_id
      properties:
        withdraw_intent_id:
          $ref: '#/components/schemas/WithdrawIntentId'
        customer_id:
          $ref: '#/components/schemas/CustomerId'
    ConsolidationIntentEthereum:
      type: object
      description: Ethereum Consolidation intent response
      required:
      - source_validator
      - target_validator
      - contract_address
      - unsigned_data
      properties:
        source_validator:
          $ref: '#/components/schemas/EthereumValidatorPublicKey'
        target_validator:
          $ref: '#/components/schemas/EthereumValidatorPublicKey'
        contract_address:
          $ref: '#/components/schemas/EthereumAddress'
        unsigned_data:
          $ref: '#/components/schemas/EthereumUnsignedDataEthereum'
    NewEthereumTopUpIntent:
      type: object
      description: Request object to create a new Ethereum Top Up Intent.
      required:
      - top_ups
      properties:
        top_ups:
          type: array
          description: Top ups for Ethereum 0x02 validators.
          minItems: 1
          maxItems: 1000
          additionalProperties: false
          items:
            $ref: '#/components/schemas/NewEthereumTopUp'
    CommonConsolidateResponse:
      type: object
      required:
      - customer_id
      properties:
        customer_id:
          $ref: '#/components/schemas/CustomerId'
    EthereumValidatorWithdrawableAmount:
      type: object
      description: Ethereum withdrawable amount
      required:
      - public_key
