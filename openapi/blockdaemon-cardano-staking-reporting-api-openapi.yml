components:
  schemas:
    MultiDelegatorHistoricRewardsQuery:
      required:
      - fromTime
      - toTime
      - timeUnit
      - addresses
      type: object
      properties:
        fromTime:
          type: integer
          format: int64
          description: The Unix timestamp in seconds from which you wish to retrieve rewards.
          example: 1577836800
          default: 1577836800
        toTime:
          type: integer
          format: int64
          description: The Unix timestamp in seconds until which rewards are retrieved.
          example: 1685491200
          default: 1685491200
        timeUnit:
          $ref: '#/components/schemas/TimeUnit1'
        addresses:
          type: array
          description: List of addresses to retrieve rewards for.
          default:
          - stake1u8003gtvhcunzzmy85nfnk6kafd8lks2mykfzf0n4hq4qzg9f029u
          - stake1u80058a9nztq6d5sudzynepf63pedvpyr3kzhlxacrcefwqf3ez2y
          items:
            type: string
            pattern: ^stake[a-z0-9]+$
    Rewards:
      type: object
      required:
      - rewards
      properties:
        rewards:
          type: array
          description: A list of rewards.
          items:
            $ref: '#/components/schemas/Reward'
    SingleHistoricRewardsQuery:
      required:
      - fromTime
      - toTime
      - timeUnit
      type: object
      properties:
        fromTime:
          type: integer
          format: int64
          description: The Unix timestamp in seconds from which you wish to retrieve rewards.
          example: 1577836800
          default: 1577836800
        toTime:
          type: integer
          format: int64
          description: The Unix timestamp in seconds until which rewards are retrieved.
          example: 1685491200
          default: 1685491200
        timeUnit:
          $ref: '#/components/schemas/TimeUnit1'
    Metadata2:
      required:
      - epoch
      type: object
      description: The protocol specific data.
      properties:
        commission:
          type: number
          format: double
          description: The commission rate.
          example: 0.01
        epoch:
          type: integer
          format: int
          description: The epoch number the rewards were earned in.
          example: 348
    MultiPoolHistoricRewardsQuery:
      required:
      - fromTime
      - toTime
      - timeUnit
      - addresses
      type: object
      properties:
        fromTime:
          type: integer
          format: int64
          description: The Unix timestamp in seconds from which you wish to retrieve rewards.
          example: 1577836800
          default: 1577836800
        toTime:
          type: integer
          format: int64
          description: The Unix timestamp in seconds until which rewards are retrieved.
          example: 1685491200
          default: 1685491200
        timeUnit:
          $ref: '#/components/schemas/TimeUnit1'
        addresses:
          type: array
          description: List of addresses to retrieve rewards for.
          default:
          - pool10gllgflzl3ngg0fj2xas9hfww25zxn2fdwtc0gd44am92pdlr7p
          - pool1f4lvg6px40kelh4kala6jxn6fnugtyhrtw6hgzgr7ar7ymtr7jd
          items:
            type: string
            pattern: ^pool[a-z0-9]+$
    Reward:
      required:
      - address
      - currency
      - metadata
      - return
      - startingBalance
      - timeAggregation
      - timeEnd
      - timeStart
      type: object
      properties:
        address:
          type: string
          description: The user-defined address.
        currency:
          type: string
          description: The cryptocurrency protocol the request relates to.
          example: ADA
        metadata:
          $ref: '#/components/schemas/Metadata2'
        return:
          type: string
          description: The sum of the rewards for the previous UTC day.
          example: '500.000000'
        startingBalance:
          type: string
          description: The staked amount at the beginning of the previous UTC day (at the timeStart).
          example: '5004.058667'
        timeAggregation:
          type: string
