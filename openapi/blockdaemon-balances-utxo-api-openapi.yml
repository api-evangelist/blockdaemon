openapi: 3.2.0
info:
  version: 3.0.0
  title: Blockdaemon REST Balances & UTXO API
  description: 'Blockdaemon REST API provides a RESTful and uniform way to access blockchain resources,

    with a rich and reusable model across multiple protocols/cryptocurrencies.'
  contact:
    name: Blockdaemon
    email: support@blockdaemon.com
    url: https://blockdaemon.com
  x-logo:
    url: https://storage.googleapis.com/blockdaemon-app-static-images/marketing/PNG/dark-logo.png
    altText: Blockdaemon logo
servers:
- url: https://svc.blockdaemon.com/universal/{version}
  description: Production server
  variables:
    version:
      enum:
      - v1
      default: v1
- url: https://ubiquity.api.blockdaemon.com/{version}
  description: '[Legacy Auth] Production server'
  variables:
    version:
      enum:
      - v1
      default: v1
security:
- apiKeyAuthHeader: []
- bearerAuth: []
tags:
- name: Balances & UTXO
paths:
  /{protocol}/{network}/account/{address}:
    get:
      summary: Get a List of Balances for an Address
      operationId: GetListOfBalancesByAddress
      description: Returns a list of account balances by a user-defined account address for the supported currencies.
      tags:
      - Balances & UTXO
      parameters:
      - $ref: '#/components/parameters/protocol'
      - $ref: '#/components/parameters/network'
      - $ref: '#/components/parameters/address'
      - $ref: '#/components/parameters/assets'
      responses:
        '200':
          description: Balances
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/balances'
              example:
              - currency:
                  asset_path: bitcoin/native/btc
                  symbol: BTC
                  name: Bitcoin
                  decimals: 8
                  type: native
                confirmed_balance: '7268015775'
                pending_balance: '7268015775'
                confirmed_block: 801210
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-internal: false
  /{protocol}/{network}/account/{address}/nonce:
    get:
      summary: Get Account Nonce
      description: Returns the nonce for a user-defined account address.
      operationId: GetAccountNonce
      tags:
      - Balances & UTXO
      parameters:
      - in: path
        name: protocol
        required: true
        description: 'The protocol handle, one of: `ethereum`, `polygon`, `polkadot`, `solana`.

          '
        schema:
          type: string
          default: ethereum
        examples:
          Ethereum:
            value: ethereum
      - $ref: '#/components/parameters/network'
      - $ref: '#/components/parameters/address'
      - name: block_number
        in: query
        required: false
        description: Optional field to get the account nonce at a specific block height (not applicable to solana)
        schema:
          type: string
        example: 19134862
      responses:
        '200':
          description: Transaction outputs filtered by the given parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/nonce'
            text/csv:
              schema:
                type: string
                example: 'Protocol,PublicAddress,Currency,EventID,Block,BlockTimestamp,BlockTime,Hash,Action,Value,SenderAddress,TransactionFee,SenderReward,RecipientReward,Close,CloseAmount,CloseReward

                  Algorand,GXL2EQ6JV54MTMP2IXOTF5CJLS7GAWMRDZMOY7JZAPO72AQRDDYGD6OX3E,ALGO,RNEYUT3MRYGT5ENSLIC7LGJCJMW6BXNS6SAW7A25DTYRW4TFJ5JA,8986217,1599745403,2020-09-10 13:43:23 +0000 UTC,RNEYUT3MRYGT5ENSLIC7LGJCJMW6BXNS6SAW7A25DTYRW4TFJ5JA,pay,1,T3BYUTYZCWV7UVK7IFYPC2UKH5VNBGVP4PUKSUBF5F6GQ244Y4I2XUWCQM,0.001,0.000003,0,,0,0

                  '
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          description: Too Many Transactions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-zuplo-route:
        custom:
          product: ub_universal
          billing_product: balances-utxos
          fh: ubiquity
          target_service: ub-{protocol}-{network}-{service}
          cluster: use4
        corsPolicy: anything-goes
        handler:
          export: urlRewriteHandler
          module: $import(@zuplo/runtime)
          options:
            rewritePattern: service://${context.custom.cluster_prefix}-${params.protocol}-${params.network}-${context.custom.service}-${env.UB_ENV}/v1/${params.protocol}/${params.network}/account/${params.address}/nonce
            forwardSearch: true
        policies:
          inbound:
          - ubiquity-default-policy
          outbound: []
  /{protocol}/{network}/account/{address}/report:
    get:
      summary: Get a Financial Report for an Address Between a Time Period
      operationId: GetReportByAddress
      description: Returns a financial report by a user-defined account address between a time period. Default timescale is within the last 30 days.
      tags:
      - Balances & UTXO
      parameters:
      - in: path
        name: protocol
        required: true
        description: 'Protocol handle, one of: `algorand`, `polkadot`, `stellar` `tezos`, `xrp`.

          '
        schema:
          type: string
          default: polkadot
        examples:
          Polkadot:
            value: polkadot
      - $ref: '#/components/parameters/network'
      - name: address
        in: path
        required: true
        description: The account address of the protocol.
        schema:
          type: string
          default: 12yi4uHFbnSUryffXT7Xq92fbGC3iXvCs3vz9HjVgpb4sBvL
        examples:
          DOT_address:
            value: 12yi4uHFbnSUryffXT7Xq92fbGC3iXvCs3vz9HjVgpb4sBvL
            description: Polkadot address
      - name: from
        in: query
        required: false
        description: The Unix Timestamp from where to start.
        schema:
          type: integer
        example: 961846434
      - name: to
        in: query
        required: false
        description: The Unix Timestamp from where to end.
        schema:
          type: integer
        example: 1119612834
      - name: page_token
        in: query
        required: false
        description: The token to retrieve more items in the next request. Use the `next_page_token` returned from the previous response for this parameter.
        schema:
          type: string
        example: xyz
      - name: page_size
        in: query
        required: false
        description: 'The max number of items to return in a response.

          Defaults to 50k and is capped at 100k.

          '
        schema:
          type: integer
        example: 1000
      responses:
        '200':
          description: Account Activity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/report'
              example:
                fields:
                - protocol: Algorand
                  address: GXL2EQ6JV54MTMP2IXOTF5CJLS7GAWMRDZMOY7JZAPO72AQRDDYGD6OX3E
                  currency: ALGO
                  event_id: RSSPF4EIKXRILWH6I4LZGPZA32YHWIWYFPWZFOHZQOXP23JBX6IA
                  block: 8986308
                  timestamp: 1599745808
                  hash: RSSPF4EIKXRILWH6I4LZGPZA32YHWIWYFPWZFOHZQOXP23JBX6IA
                  action: pay
                  value: '1009113666'
                  fee: '1000'
                  sender_address: SP745JJR4KPRQEXJZHVIEN736LYTL2T2DFMG3OIIFJBV66K73PHNMDCZVM
                  decimals: 6
                  meta:
                    type: algorand_meta
                    sender_reward: '0'
                    recipient_reward: '0'
                    close: ''
                    close_amount: '0'
                    close_reward: '0'
                items: 1
                limit: 50000
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          description: Too Many Transactions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /{protocol}/{network}/account/{address}/utxo:
    get:
      summary: Get a List of Transaction Inputs and Outputs
      operationId: GetUTXOByAccount
      description: Returns the transaction inputs and outputs following the BTC's UTXO model definition by a user-definied account address.
      tags:
      - Balances & UTXO
      parameters:
      - in: path
        name: protocol
        required: true
        description: 'The protocol handle, one of: `bitcoin`, `bitcoincash`, `dogecoin`, `litecoin`.

          '
        schema:
          type: string
          default: bitcoin
        examples:
          Bitcoin:
            value: bitcoin
      - $ref: '#/components/parameters/network'
      - $ref: '#/components/parameters/address'
      - name: spent
        in: query
        description: Whether the transaction output was spent or not.
        schema:
          type: boolean
        example: true
      - name: check_mempool
        in: query
        description: Whether to check for UTXOs spent in the mempool as well as UTXOs pending in the mempool.
        schema:
          type: boolean
        example: true
      - name: from
        in: query
        required: false
        description: The Unix Timestamp from where to start.
        schema:
          type: integer
        example: 961846434
      - name: to
        in: query
        required: false
        description: The Unix Timestamp from where to end.
        schema:
          type: integer
        example: 1119612834
      - $ref: '#/components/parameters/order'
      - $ref: '#/components/parameters/page_token'
      - name: page_size
        in: query
        required: false
        description: 'The max number of items to return in a response

          Defaults to 50k and is capped at 100k.

          '
        schema:
          type: integer
        example: 1000
      responses:
        '200':
          description: Transaction outputs filtered by the given parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tx_outputs'
