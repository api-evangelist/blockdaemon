  /{protocol}/{network}/accounts/:
    post:
      summary: Get a List of Balances for Multiple Addresses
      operationId: GetListOfBalancesByAddresses
      description: 'Returns a list of account balances for a user-defined list of account addresses:

        - The filter allows up to 200 addresses for:

        - Algorand

        - Bitcoin

        - Solana

        - Stellar

        - Ethereum

        - The filter allows up to 10 addresses for other supported protocols.'
      tags:
      - Balances & UTXO
      parameters:
      - $ref: '#/components/parameters/protocol'
      - $ref: '#/components/parameters/network'
      - $ref: '#/components/parameters/assets'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/accounts_obj'
      responses:
        '200':
          description: Balances
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/accounts_balances'
              example:
                1A1zP1eP5QGefi2DMPTfTL5SLmv7DivfNa:
                - currency:
                    asset_path: bitcoin/native/btc
                    symbol: BTC
                    name: Bitcoin
                    decimals: 8
                    type: native
                  confirmed_balance: '7268015775'
                  pending_balance: '7268015775'
                  confirmed_block: 801210
                bc1qxy2kgdygjrsqtzq2n0yrf2493p83kkfjhx0wlh:
                - currency:
                    asset_path: bitcoin/native/btc
                    symbol: BTC
                    name: Bitcoin
                    decimals: 8
                    type: native
                  confirmed_balance: '30224256'
                  pending_balance: '30224256'
                  confirmed_block: 801210
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-internal: false
components:
  parameters:
    protocol:
      in: path
      name: protocol
      required: true
      description: "Protocol handle, one of: \n`algorand`, `avalanche`, `bitcoin`, `bitcoincash`, `dogecoin`, `ethereum`, `litecoin`, `near`, `optimism`, `polkadot`, `polygon`, `solana`, `stellar`, `tezos`, `xrp`.\n"
      schema:
        type: string
        default: bitcoin
      examples:
        Bitcoin:
          value: bitcoin
    order:
      name: order
      in: query
      description: The pagination order.
      schema:
        type: string
        enum:
        - desc
        - asc
        default: desc
    assets:
      name: assets
      in: query
      required: false
      description: "Comma-separated list of asset paths to filter. If the list is empty or all elements are empty, this filter has no effect. Filtering by asset is applicable only for:\n  - **Balances endpoints:** `algorand`, `avalanche`, `bitcoincash`, `ethereum`, `litecoin`, `optimism`, `polygon`, `polkadot`, `solana`\n  - **Transactions endpoints:** `algorand`, `avalanche`, `ethereum`\n\nFind all the asset paths on this [page](https://docs.blockdaemon.com/reference/available-currencies-and-tokens).\n"
      schema:
        type: string
      allowReserved: true
      examples:
        ETH_native_currency:
          value: ethereum/native/eth
        ETH_smart_token:
          value: ethereum/contract/0x0f5d2fb29fb7d3cfee444a200298f468908cc942/erc-20
        More_than_one_asset:
          value: ethereum/native/eth,ethereum/contract/0x0f5d2fb29fb7d3cfee444a200298f468908cc942/erc-20
    address:
      name: address
      in: path
      required: true
      description: The account address of the protocol.
      schema:
        type: string
        default: 1A1zP1eP5QGefi2DMPTfTL5SLmv7DivfNa
      examples:
        BTC_address:
          value: 1A1zP1eP5QGefi2DMPTfTL5SLmv7DivfNa
          description: BTC address
    network:
      name: network
      in: path
      required: true
      description: Which network to target. Available networks can be found in the list of supported protocols or with /{protocol}.
      schema:
        type: string
        default: mainnet
      examples:
        Mainnet:
          value: mainnet
        Mainnet-C:
          value: mainnet-c
        Testnet:
          value: testnet
        Testnet4:
          value: testnet4
          description: Bitcoin testnet network
        Testnet-C:
          value: testnet-c
        Holesky:
          value: holesky
          description: Ethereum testnet network
        Hoodi:
          value: hoodi
          description: Ethereum testnet network
        Sepolia:
          value: sepolia
          description: Ethereum testnet network
        Westend:
          value: westend
          description: Polkadot testnet network
        Amoy:
          value: amoy
          description: Polygon testnet network
    page_token:
      name: page_token
      in: query
      required: false
      description: The token to retrieve more items in the next request. Use the `next_page_token` returned from the previous response for this parameter.
      schema:
        type: string
      example: '8185.123'
  schemas:
    smart_token_currency:
      type: object
      properties:
        asset_path:
          type: string
          description: The asset path of the transferred currency.
          example: ethereum/native/eth
        symbol:
          type: string
          description: The currency symbol.
          example: ETH
        name:
          type: string
          description: The name of the currency.
          example: Ether
        decimals:
          type: integer
          description: The decimal places right to the comma.
          example: 18
        type:
          type: string
          description: The type of the currency.
          default: smart_token
        detail:
          $ref: '#/components/schemas/smart_token'
      required:
      - asset_path
      - type
    balance:
      type: object
      description: Account balance object.
      properties:
        currency:
          $ref: '#/components/schemas/currency'
        confirmed_balance:
          description: The balance that can be spent.
          type: string
        pending_balance:
          description: The balance value from the latest confirmed block.
          type: string
        confirmed_block:
          description: The confirmed block number.
          example: 1313
          type: integer
        confirmed_nonce:
          description: The confirmed nonce of the transaction.
          type: integer
    token_currency:
      type: object
      properties:
        asset_path:
          type: string
          description: The asset path of the transferred currency.
          example: ethereum/native/eth
        symbol:
          type: string
          description: The currency symbol.
          example: ETH
        name:
          type: string
          description: The name of the currency.
          example: Ether
        decimals:
          type: integer
          description: The decimal places right to the comma.
          example: 18
        type:
          type: string
          description: The currency type.
          default: token
        detail:
          $ref: '#/components/schemas/token'
      required:
      - asset_path
      - type
    nonce:
      type: object
      properties:
        nonce:
          type: string
          description: Account Nonce.
          example: '8000'
      required:
      - nonce
    error:
      type: object
      properties:
        type:
          type: string
          description: The HTTP error type.
          example: bad-request
        code:
          type: integer
          description: The numeric error code.
          example: 16384
        title:
          type: string
          description: The short error description.
          example: Invalid Address
        status:
          type: integer
          description: The HTTP status of the error.
          example: 400
        detail:
          type: string
          description: Long error description
          example: The requested address is invalid on this protocol.
    native_currency:
      type: object
      properties:
        asset_path:
          type: string
          description: The asset path of transferred currency.
          example: ethereum/native/eth
        symbol:
          type: string
          description: The currency symbol.
          example: ETH
        name:
          type: string
          description: The name of the currency.
          example: Ether
        decimals:
          type: integer
          description: The decimal places right to the comma.
          example: 18
        type:
          type: string
          default: native
          description: The type of the currency.
      required:
      - asset_path
      - type
    report_field:
      type: object
      properties:
        protocol:
          type: string
          description: The protocol the address relates to.
          example: Algorand
        address:
          type: string
          description: The wallet/account the transaction occurred
          example: GXL2EQ6JV54MTMP2IXOTF5CJLS7GAWMRDZMOY7JZAPO72AQRDDYGD6OX3E
        currency:
          type: string
          description: The currency symbol.
          example: ALGO
        event_id:
          type: string
          description: The ID of the event within a transaction.
          example: RNEYUT3MRYGT5ENSLIC7LGJCJMW6BXNS6SAW7A25DTYRW4TFJ5JA
        block:
          type: integer
          format: int64
          description: The block number the transaction occurred on.
          example: 8986217
        timestamp:
          type: integer
          format: int32
          description: The unix timestamp when the transaction was added to a block.
          example: 1599745403
        hash:
          type: string
          description: The transaction ID.
          example: RNEYUT3MRYGT5ENSLIC7LGJCJMW6BXNS6SAW7A25DTYRW4TFJ5JA
        action:
          type: string
          description: The action type e.g. Transfer, Deposit, Staking Reward etc..
          example: pay
        value:
          type: string
          description: The amount of currency involved in the transaction (smallest unit).
          example: '1000000'
        fee:
          type: string
          description: How much was charged as a fee for processing the transaction.
          example: '1000'
        sender_address:
          type: string
          description: The address where the funds originated.
          example: T3BYUTYZCWV7UVK7IFYPC2UKH5VNBGVP4PUKSUBF5F6GQ244Y4I2XUWCQM
        decimals:
          type: integer
          format: int32
          description: The number of decimals in one coin, used to convert smallest unit to 1 whole coin if needed.
          example: 6
        meta:
          $ref: '#/components/schemas/report_field_meta'
      required:
      - action
      - address
      - block
      - currency
      - decimals
      - event_id
      - fee
      - hash
      - protocol
      - sender_address
      - timestamp
      - value
    tx-output-response:
      type:
      - object
      - 'null'
      properties:
        index:
          type: integer
          description: The output index within a given transaction.
          example: 1
        tx_id:
          type: string
          description: The transaction identifier.
          example: 57f7dc46786c5d56d260186d459f1246943dd6e83ca00235909dad1b826f20b4
        date:
          type: integer
          description: The transaction creation unix timestamp.
          example: 1655419925
        block_id:
          type: string
          description: The hash identifier of the block which the transaction was mined.
          example: 00000000000000000008ad1bdca4288143a0cb20e71de0808a066db89857e153
        block_number:
          type: integer
          description: The number of the block which the transaction was mined.
          example: 741100
        confirmations:
          type: integer
          description: The number of confirmations the transaction took in order to be mined.
          example: 1619
        meta:
          description: The meta details of the transaction.
          type: object
          properties:
            addresses:
              description: A list of addresses.
              type: array
              items:
                type: string
            index:
              description: The index number.
              type: integer
            script:
              description: The script.
              type: string
            script_type:
              description: The script type.
              type: string
    accounts_balances:
      type: object
      description: The accounts balances with account addressses as keys.
      additionalProperties:
        type: array
        items:
          $ref: '#/components/schemas/balance'
    tx_outputs:
      type: object
      description: A list of transaction outputs.
      properties:
        total:
          type: integer
          description: The number of total items.
          example: 25
        data:
          type: array
          description: A list of output items.
          items:
            type: object
            properties:
              status:
                type: string
                description: The status of the given transaction output.
                example: mined
              is_spent:
                type: boolean
                description: Whether the transaction output was spent or not.
                example: false
              value:
                type: integer
                format: int64
                description: The amount of tokens within the given output.
                example: 600
              spent:
                allOf:
                - $ref: '#/components/schemas/tx-output-response'
              mined:
                allOf:
                - $ref: '#/components/schemas/tx-output-response'
              pending:
                allOf:
                - $ref: '#/components/schemas/tx-output-response'
        meta:
          $ref: '#/components/schemas/meta'
    paging:
      type: object
      description: The pagination details.
      properties:
