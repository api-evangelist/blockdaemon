  /defi/v1/fungibletoken/historicallogs:
    get:
      tags:
      - fungibletoken
      summary: Historical Logs
      description: 'Retrieves historical blockchain logs related to an ERC-20 token for a specified user address within a defined block range. It is designed to capture events such as token approvals and transfers, allowing developers and users to audit past activity, verify transaction histories, and analyze token behavior over time.


        > 💡

        **Compute Unit Value:** `70` (Fixed)'
      operationId: fungibletokenHistoricallogs
      parameters:
      - name: chainId
        in: query
        required: false
        schema:
          type: string
          description: The unique ID to direct queries or transactions to the correct blockchain. Find more [here](https://docs.blockdaemon.com/docs/defi-api-supported-protocols#supported-chains).
          enum:
          - '1'
          - '137'
          - '56'
          - '25'
          - '10'
          - '250'
          - '43114'
          - '42161'
          - '8453'
          example: '1'
        description: The unique ID to direct queries or transactions to the correct blockchain. Find more [here](https://docs.blockdaemon.com/docs/defi-api-supported-protocols#supported-chains).
      - name: chainSymbol
        in: query
        required: false
        schema:
          type: string
          description: The abbreviated chain name for queries or transactions.
          example: ETH
        description: The abbreviated chain name for queries or transactions.
      - name: startBlock
        in: query
        required: false
        schema:
          type: string
          description: 'The starting block of the range. Default: latestBlock - 100.'
          example: '100000'
        description: 'The starting block of the range. Default: latestBlock - 100.'
      - name: endBlock
        in: query
        required: false
        schema:
