  /defi/v1/fungibletoken/getuserbalance:
    get:
      tags:
      - fungibletoken
      summary: Get User Balance
      description: 'Retrieve the balance of a specified ERC-20 token for a given user address. It provides an essential function for wallet management and decentralized finance applications by offering real-time balance information across multiple blockchain networks.


        > 💡

        **Compute Unit Value:** `55` (Fixed)'
      operationId: fungibletokenGetuserbalance
      parameters:
      - name: chainId
        in: query
        required: false
        schema:
          type: string
          description: The unique ID to direct queries or transactions to the correct blockchain. Find more [here](https://docs.blockdaemon.com/docs/defi-api-supported-protocols#supported-chains).
          enum:
          - '1'
          - '56'
          - '43114'
          - '137'
          - '250'
          - '10'
          - '11155420'
          - '42161'
          - '421614'
          - '25'
          - '338'
          - '84532'
          - '8453'
          - '43113'
          - '97'
          - '80002'
          - '300'
          - '324'
          - '5000'
          - '5003'
          example: '1'
        description: The unique ID to direct queries or transactions to the correct blockchain. Find more [here](https://docs.blockdaemon.com/docs/defi-api-supported-protocols#supported-chains).
      - name: tokenAddress
        in: query
        required: true
        schema:
          type: string
          description: The address of the token whose balance is to be retrieved.
          example: '0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48'
        description: The address of the token whose balance is to be retrieved.
      - name: address
        in: query
        required: true
        schema:
          type: string
          description: The public address of the user whose token balance is being queried.
          example: '0xdAe2F6EdDdA6fb4fb60cc02633DE27e2b431B402'
        description: The public address of the user whose token balance is being queried.
      - name: chainSymbol
        in: query
        required: false
        schema:
          type: string
          description: The abbreviated chain name for queries or transactions.
          example: ETH
        description: The abbreviated chain name for queries or transactions.
      - name: vsCurrencies
        in: query
        required: false
        schema:
          type: string
          description: A comma-separated list of currency symbols to convert the amount into, such as 'USD,EUR'. This parameter is optional and allows retrieving values in multiple fiat currencies.
          example: usd,eur,gbp
        description: A comma-separated list of currency symbols to convert the amount into, such as 'USD,EUR'. This parameter is optional and allows retrieving values in multiple fiat currencies.
      responses:
