  /defi/v1/fungibletoken/historical/weth:
    get:
      tags:
      - fungibletoken
      summary: Historical WETH
      description: 'Fetches all Wrapped ETH (WETH) transfer transactions for a specified user address within a designated block range across supported blockchain networks.


        > 💡

        **Compute Unit Value:** `155` (Fixed)'
      operationId: fungibletokenHistoricalWeth
      parameters:
      - name: chainId
        in: query
        required: false
        schema:
          type: string
          description: The unique ID to direct queries or transactions to the correct blockchain. Find more [here](https://docs.blockdaemon.com/docs/defi-api-supported-protocols#supported-chains).
          enum:
          - '1'
          - '137'
          - '56'
          - '25'
          - '10'
          - '250'
          - '43114'
          - '42161'
          - '8453'
          example: '1'
        description: The unique ID to direct queries or transactions to the correct blockchain. Find more [here](https://docs.blockdaemon.com/docs/defi-api-supported-protocols#supported-chains).
      - name: chainSymbol
        in: query
        required: false
        schema:
          type: string
          description: The abbreviated chain name for queries or transactions.
          example: ETH
        description: The abbreviated chain name for queries or transactions.
      - name: address
        in: query
        required: false
        schema:
          type: string
          description: The public address of the user for which WETH transfers are being queried.
          example: '0xdAe2F6EdDdA6fb4fb60cc02633DE27e2b431B402'
        description: The public address of the user for which WETH transfers are being queried.
      - name: startBlock
        in: query
        required: false
        schema:
          type: string
          description: The starting block of the range. By default, latestBlock - 100.
          example: '100000'
        description: The starting block of the range. By default, latestBlock - 100.
      - name: endBlock
        in: query
        required: false
        schema:
          type: string
          description: The ending block of the range. By default, latestBlock.
          example: '100010'
        description: The ending block of the range. By default, latestBlock.
      - name: page
        in: query
        required: false
        schema:
          type: string
          description: The page number to fetch. By default, 1.
          example: '1'
        description: The page number to fetch. By default, 1.
      - name: sort
        in: query
        required: false
        schema:
          type: string
          description: 'Sorting order: asc for ascending, desc for descending. By default, desc.'
          enum:
          - desc
          - asc
          example: desc
        description: 'Sorting order: asc for ascending, desc for descending. By default, desc.'
