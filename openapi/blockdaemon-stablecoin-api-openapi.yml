tags:
- name: stablecoin
paths:
  /defi/v1/stablecoin/getprice:
    get:
      tags:
      - stablecoin
      summary: Get Price
      description: 'Retrieves the latest USDT-denominated market price for supported stablecoins (e.g., USDT, USDC), including round ID, price, and recorded timestamps.


        > 💡

        **Compute Unit Value:** `25` (Fixed)'
      operationId: stablecoinGetprice
      parameters:
      - name: asset
        in: query
        required: true
        schema:
          type: string
          description: The name of the stablecoin whose price needs to be fetched.
          example: '0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2'
        description: The name of the stablecoin whose price needs to be fetched.
      - name: stablecoinId
        in: query
        required: false
        schema:
          type: string
          description: The stablecoinId parameter specifies the unique identifier for the requested stablecoin. Use 700 for USDT or 800 for USDC when querying data on the Ethereum chain.
          example: '700'
        description: The stablecoinId parameter specifies the unique identifier for the requested stablecoin. Use 700 for USDT or 800 for USDC when querying data on the Ethereum chain.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: object
                example:
                  status: 200
                  msg: success
                  data:
                    roundId: '36893488147419104052'
                    answer: '0.99999'
                    startedAt: '1675316735'
                    updatedAt: '1675316735'
                    answeredInRound: '36893488147419104052'
      x-bd-cu: '25'
      x-bd-cu-type: fixed
      x-internal: false
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: '`X-API-Key: <Token>` header must be set to authenticate API requests.You can create tokens in the "Configure" tab of your API access area at https://app.blockdaemon.com.'
