      parameters:
      - name: liquidStakingId
        in: query
        required: false
        schema:
          type: string
          description: The unique ID to specify the liquid staking protocol for routing staking-related queries or transactions.
          enum:
          - '1'
          - '200'
          - '201'
          - '2'
          - '56'
          - '97'
          - '137'
          - '43114'
          - '900'
          example: '1'
        description: The unique ID to specify the liquid staking protocol for routing staking-related queries or transactions.
      - name: address
        in: query
        required: true
        schema:
          type: string
          description: Public address of the user.
          example: '0xdAe2F6EdDdA6fb4fb60cc02633DE27e2b431B402'
        description: Public address of the user.
      - name: page
        in: query
        required: false
        schema:
          type: string
          description: The page number that the user wants to fetch. Defaults to 1 if not specified.
          example: '1'
        description: The page number that the user wants to fetch. Defaults to 1 if not specified.
      - name: startBlock
