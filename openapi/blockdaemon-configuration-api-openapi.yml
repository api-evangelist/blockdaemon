openapi: 3.2.0
info:
  title: Sepior Threshold Security Module (TSM) Management…
  description: 'Management API for the Threshold Security Module (TSM).


    This API provides endpoints for monitoring and managing TSM nodes, including

    health checks, metrics, API key management, and authentication configuration.'
  version: 1.0.0
  contact:
    name: Blockdaemon/Sepior Support
    url: https://blockdaemon.com/
  license:
    name: Proprietary
servers:
- url: '{server}'
  description: TSM Management API Server
  variables:
    server:
      default: https://localhost:8080
      description: Server URL
security:
- APIKeyAuth: []
tags:
- name: Configuration
  description: Configuration information operations
paths:
  /management/configuration/auditsigningpublickey:
    get:
      summary: Get audit signing public key
      description: Returns the public key used for signing audit logs
      operationId: getAuditSigningPublicKey
      tags:
      - Configuration
      responses:
        '200':
          description: Successful operation
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /management/configuration/authinfo:
    get:
      summary: Get authentication information
      description: Returns information about available authentication methods
      operationId: getAuthenticationInfo
      tags:
      - Configuration
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuthenticatorInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  schemas:
    AuthenticatorInfo:
      type: object
      additionalProperties: true
      description: Information about an authentication method
    Error:
      type: object
      properties:
        code:
          type: string
          description: Error code
        message:
          type: string
          description: Error message
        details:
          type: object
          description: Additional error details
      required:
      - code
      - message
  responses:
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    APIKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
