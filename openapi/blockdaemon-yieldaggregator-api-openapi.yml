  /defi/v1/yieldaggregator/getmarkettokens:
    get:
      tags:
      - yieldaggregator
      summary: Get Market Tokens
      description: 'Returns the token configuration for a given yield market, including mint/redeem token arrays and a swap configuration object. This information clarifies token flows for effective liquidity management and yield optimization.


        > 💡

