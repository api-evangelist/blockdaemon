      operationId: yieldaggregatorGetmarkettokens
      parameters:
      - name: yieldAggregatorId
        in: query
        required: false
        schema:
          type: string
          description: The unique ID to specify the yield aggregator for queries or transactions.
          enum:
          - '5200'
          - '5201'
          - '5202'
          - '5203'
          - '5204'
          example: '5200'
        description: The unique ID to specify the yield aggregator for queries or transactions.
      - name: marketAddress
        in: query
        required: true
        schema:
          type: string
          description: Specifies the blockchain address of the yield market or liquidity pool.
          example: '0xcdd26eb5eb2ce0f203a84553853667ae69ca29ce'
        description: Specifies the blockchain address of the yield market or liquidity pool.
      responses:
        '200':
