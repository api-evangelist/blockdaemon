openapi: 3.2.0
info:
  contact:
    name: Blockdaemon
    email: info@blockdaemon.com
  description: The Blockdaemon DeFi API provides a single interface to a multitude of DeFi projects and blockchains
  title: Blockdaemon DeFi Yieldaggregator API
  version: 1.0.0
  x-logo:
    altText: Blockdaemon logo
    backgroundColor: '#fafafa'
    url: https://storage.googleapis.com/blockdaemon-app-static-images/marketing/PNG/dark-logo.png
servers:
- url: https://svc.blockdaemon.com
security:
- ApiKeyAuth: []
tags:
- name: yieldaggregator
paths:
  /defi/v1/yieldaggregator/addliquidity:
    post:
      tags:
      - yieldaggregator
      summary: Add Liquidity
      description: 'Constructs a transaction payload for adding liquidity to a specified market. The payload includes chain, address, gas, and function data, enabling users to deposit tokens and expand yield opportunities.


        > 💡

        **Compute Unit Value:** `95` (Fixed)'
      operationId: yieldaggregatorAddliquidity
      requestBody:
        required: true
        description: The request body for a /defi/v1/yieldaggregator/addliquidity
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/_yieldaggregator_addliquidity_Request'
            example:
              yieldAggregatorId: '5200'
              marketAddress: '0xcdd26eb5eb2ce0f203a84553853667ae69ca29ce'
              tokenIn: '0x4db99b79361f98865230f5702de024c69f629fec'
              amount: '1000000000000000000'
              from: '0xdAe2F6EdDdA6fb4fb60cc02633DE27e2b431B402'
              amountPtIn: '10000'
              slippage: '10'
              zeroPriceImpact: false
              gas: '100000'
              gasPriority: low
              enableFee: false
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: object
                example:
                  status: 200
                  msg: success
                  data:
                    chainId: '1'
                    from: '0xdae2f6eddda6fb4fb60cc02633de27e2b431b402'
                    to: '0x888888888889758F76e7103c6CbF23ABbF58F946'
                    value: '0'
                    gas: '1000000'
                    data: ''
                    estimationCheck: 'Returned error: execution reverted: ERC20: insufficient allowance'
                    referenceId: 410bcb32a855442caa186a8a7a599d1e
      x-bd-cu: '95'
      x-bd-cu-type: fixed
      x-internal: false
  /defi/v1/yieldaggregator/depositpool:
    post:
      tags:
      - yieldaggregator
      summary: Deposit Pool
      description: 'Enables users to deposit tokens into yield-generating pools on supported blockchains, specifying the target pool either via a direct poolAddress or by providing the tokenAddress with additional parameters. Upon success, the endpoint returns key details (chainId, addresses, transaction data, referenceId) that streamline investment management in decentralized finance protocols.


        > 💡

        **Compute Unit Value:** `30` (Fixed)'
      operationId: yieldaggregatorDepositpool
      requestBody:
        required: true
        description: The request body for a /defi/v1/yieldaggregator/depositpool
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/_yieldaggregator_depositpool_Request'
            example:
              yieldAggregatorId: '5100'
              amount: '1000000000000000000'
              from: '0xdAe2F6EdDdA6fb4fb60cc02633DE27e2b431B402'
              gas: '100000'
              tokenAddress: '0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48'
              poolAddress: '0xfad57d2039c21811c8f2b5d5b65308aa99d31559'
              gasPriority: low
              enableFee: false
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: object
                example:
                  status: 200
                  msg: success
                  data:
                    chainId: '1'
                    from: '0x63056E00436Da25BcF48A40dfBbDcc7089351006'
                    to: '0x3DA9D911301f8144bdF5c3c67886e5373DCdff8e'
                    value: '0'
                    gas: '2307200'
                    data: '0xa694fc3a00000000000000000000000000000000000000000000000000000000004b4a52'
                    referenceId: 9fdce4b6184e442cbe52d0c3249c7657
      x-bd-cu: '30'
      x-bd-cu-type: fixed
      x-internal: false
  /defi/v1/yieldaggregator/depositvault:
    post:
      tags:
      - yieldaggregator
      summary: Deposit Vault
      description: 'Initiates token deposits into yield-generating vaults with configurable gas parameters and flexible identification methods (via vaultAddress or tokenAddress and vaultNumber). The endpoint processes the deposit transaction on the designated blockchain and returns key details—such as chain ID, addresses, transaction value, gas usage, and a unique reference ID—essential for managing multiple vaults efficiently.


        > 💡

        **Compute Unit Value:** `25` (Fixed)'
      operationId: yieldaggregatorDepositvault
      requestBody:
        required: true
        description: The request body for a /defi/v1/yieldaggregator/depositvault
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/_yieldaggregator_depositvault_Request'
            example:
              amount: '1000000000000000000'
              tokenAddress: '0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48'
              from: '0xdAe2F6EdDdA6fb4fb60cc02633DE27e2b431B402'
              gas: '100000'
              vaultNumber: '1'
              vaultAddress: '0xa258C4606Ca8206D8aA700cE2143D7db854D168c'
              yieldAggregatorId: '5000'
              gasPriority: low
              enableFee: false
              poolAddress: '0xfad57d2039c21811c8f2b5d5b65308aa99d31559'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: object
                example:
                  status: 200
                  msg: success
                  data:
                    chainId: '1'
                    from: '0x63056E00436Da25BcF48A40dfBbDcc7089351006'
                    to: '0xFE09e53A81Fe2808bc493ea64319109B5bAa573e'
                    value: '0'
                    gas: '2307200'
                    data: '0xb6b55f25000000000000000000000000000000000000000000000000000000000007a120'
                    referenceId: d33bc36f30ff49e385388ba332f67594
      x-bd-cu: '25'
      x-bd-cu-type: fixed
      x-internal: false
  /defi/v1/yieldaggregator/getbalance:
    get:
      tags:
      - yieldaggregator
      summary: Get Balance
      description: 'Retrieves a user’s current liquidity balance and position within yield-generating vaults or pools across supported protocols and blockchain networks. This endpoint returns a numeric value representing the total liquidity available for the given address, with detailed breakdowns of both vault and pool balances. Users can query their balance either by providing a direct vaultAddress or by supplying a tokenAddress along with a vaultNumber, in addition to required parameters such as the user’s public address and yieldAggregatorId. This comprehensive data is essential for developers and users seeking to monitor yield positions, manage liquidity, track earned yields, and integrate real-time yield data into DeFi portfolio management and performance analytics tools.


        > 💡

        **Compute Unit Value:** `25` (Fixed)'
      operationId: yieldaggregatorGetbalance
      parameters:
      - name: address
        in: query
        required: true
        schema:
          type: string
          description: The public blockchain address of the user whose liquidity balance is being queried. This value specifies the owner of the tokens deposited in the yield aggregator.
          example: '0xdAe2F6EdDdA6fb4fb60cc02633DE27e2b431B402'
        description: The public blockchain address of the user whose liquidity balance is being queried. This value specifies the owner of the tokens deposited in the yield aggregator.
      - name: tokenAddress
        in: query
        required: false
        schema:
          type: string
          description: The contract address of the token. Use this parameter when querying by token, in combination with vaultNumber, if the vaultAddress is not provided.
          example: '0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48'
        description: The contract address of the token. Use this parameter when querying by token, in combination with vaultNumber, if the vaultAddress is not provided.
      - name: vaultNumber
        in: query
        required: false
        schema:
          type: string
          description: The identifier for the specific vault holding the token, used when multiple vaults exist for the same token. Provide this along with tokenAddress if not directly specifying vaultAddress.
          example: '1'
        description: The identifier for the specific vault holding the token, used when multiple vaults exist for the same token. Provide this along with tokenAddress if not directly specifying vaultAddress.
      - name: yieldAggregatorId
        in: query
        required: false
        schema:
          type: string
          description: The unique ID to specify the yield aggregator for queries or transactions.
          enum:
          - '5000'
          - '5001'
          - '5002'
          - '5003'
          - '5200'
          - '5201'
          - '5202'
          - '5203'
          - '5204'
          - '5100'
          example: '5000'
        description: The unique ID to specify the yield aggregator for queries or transactions.
      - name: vaultAddress
        in: query
        required: false
        schema:
          type: string
          description: The address of the yield vault. Use this parameter to directly query a specific vault instead of using tokenAddress and vaultNumber.
          example: '0xa258C4606Ca8206D8aA700cE2143D7db854D168c'
        description: The address of the yield vault. Use this parameter to directly query a specific vault instead of using tokenAddress and vaultNumber.
      - name: marketAddress
        in: query
        required: true
        schema:
          type: string
          description: The unique blockchain address that identifies the specific yield market or vault within the yield aggregator. This parameter directs the query to the appropriate liquidity pool where deposits are made.
          example: '0xcdd26eb5eb2ce0f203a84553853667ae69ca29ce'
        description: The unique blockchain address that identifies the specific yield market or vault within the yield aggregator. This parameter directs the query to the appropriate liquidity pool where deposits are made.
      - name: poolAddress
        in: query
        required: false
        schema:
          type: string
          description: Pool's address.
          example: '0xfad57d2039c21811c8f2b5d5b65308aa99d31559'
        description: Pool's address.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: object
                example:
                  status: 200
                  msg: success
                  data:
                    vaultBalance: '0'
                    poolBalance: '0'
      x-bd-cu: '25'
      x-bd-cu-type: fixed
      x-internal: false
  /defi/v1/yieldaggregator/getmarketdata:
    get:
      tags:
      - yieldaggregator
      summary: Get Market Data
      description: 'Provides detailed financial metrics (liquidity, trading volume, token supply, PT, LP, SY) for a specified yield market. This snapshot helps users and developers monitor market performance and make informed DeFi decisions.


        > 💡

        **Compute Unit Value:** `70` (Fixed)'
      operationId: yieldaggregatorGetmarketdata
      parameters:
      - name: yieldAggregatorId
        in: query
        required: false
        schema:
          type: string
          description: The unique ID to specify the yield aggregator for queries or transactions.
          enum:
          - '5200'
          - '5201'
          - '5202'
          - '5203'
          - '5204'
          example: '5200'
        description: The unique ID to specify the yield aggregator for queries or transactions.
      - name: marketAddress
        in: query
        required: true
        schema:
          type: string
          description: The blockchain address of the yield market or liquidity pool for which the market data is being requested. This parameter ensures that the query targets the correct market, returning metrics specific to that liquidity pool.
          example: '0xcdd26eb5eb2ce0f203a84553853667ae69ca29ce'
        description: The blockchain address of the yield market or liquidity pool for which the market data is being requested. This parameter ensures that the query targets the correct market, returning metrics specific to that liquidity pool.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: object
                example:
                  status: 200
                  msg: success
                  data:
                    liquidityInUsd: '167264298.4288716'
                    tradingVolumeInUsd: '14114863.261934767'
                    totalSupply: '32849681.13414054'
                    totalPtTokens: '155965599.2172757'
                    totalLpTokens: '77645954.28159352'
                    totalSyTokens: '14596352.533499816'
      x-bd-cu: '70'
      x-bd-cu-type: fixed
  /defi/v1/yieldaggregator/getmarkets:
    get:
      tags:
      - yieldaggregator
      summary: Get Markets
      description: 'Retrieves a comprehensive list of yield markets (e.g., Pendle Finance) with identifiers, expiry dates, asset addresses, and token addresses (PT, YT, SY). This data helps users discover active markets, assess liquidity opportunities, and optimize yield strategies across supported networks.


        > 💡

        **Compute Unit Value:** `25` (Fixed)'
      operationId: yieldaggregatorGetmarkets
      parameters:
      - name: yieldAggregatorId
        in: query
        required: false
        schema:
          type: string
          description: The unique ID to specify the yield aggregator for queries or transactions.
          enum:
          - '5200'
          - '5201'
          - '5202'
          - '5203'
          - '5204'
          example: '5200'
        description: The unique ID to specify the yield aggregator for queries or transactions.
      - name: includeInactive
        in: query
        required: false
        schema:
          type: boolean
          description: A flag indicating whether to include inactive yield markets in the response. Set this parameter to true to return both active and inactive markets; if omitted, only active markets will be returned.
          example: false
        description: A flag indicating whether to include inactive yield markets in the response. Set this parameter to true to return both active and inactive markets; if omitted, only active markets will be returned.
