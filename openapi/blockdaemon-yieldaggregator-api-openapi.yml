components:
  schemas:
    _yieldaggregator_transferliquidity_Request:
      type: object
      properties:
        yieldAggregatorId:
          type: string
          description: A unique identifier to route the transaction to the correct yield aggregator instance. This parameter is optional if a default aggregator is used.
          enum:
          - '5200'
          - '5201'
          - '5202'
          - '5203'
          - '5204'
          example: '5200'
        marketAddress:
          type: string
          description: The blockchain address of the source market from which liquidity is being transferred.
          example: '0xcdd26eb5eb2ce0f203a84553853667ae69ca29ce'
        from:
          type: string
          description: Blockchain address of the sender. For EVM chains, use a checksummed hex address (e.g., 0xABCDEF...). This address must hold sufficient balance and will sign the transaction.
          example: '0xdAe2F6EdDdA6fb4fb60cc02633DE27e2b431B402'
        dstMarketAddress:
          type: string
          description: The blockchain address of the destination market where the liquidity will be deposited.
          example: '0xcdd26eb5eb2ce0f203a84553853667ae69ca29ce'
        lpAmount:
          type: string
          description: 'Amount of liquidity provider (LP) tokens to transfer, specified in the token''s smallest denomination (base units). Example: 1 LP token (18 decimals) = "1000000000000000000".'
          example: '1000000000000000000'
        ptAmount:
          type: string
          description: 'Amount of principal tokens (PT) involved in the transfer, specified in the token''s smallest denomination (base units). Principal tokens represent the original asset value deposited in the yield aggregator. Example: 1 PT token (18 decimals) = "1000000000000000000".'
          example: '1000000000000000000'
        ytAmount:
          type: string
          description: 'Amount of yield tokens (YT) to transfer, specified in the token''s smallest denomination (base units). Yield tokens represent the accrued yield from the user''s deposit. Example: 1 YT token (18 decimals) = "1000000000000000000".'
          example: '1000000000000000000'
        slippage:
          type: string
          description: 'Specifies the maximum acceptable percentage deviation between the expected and actual execution price during the liquidity removal. This helps protect against unfavorable price movements. The value is expressed as a percentage (e.g., 1 for 1%). Valid range: 0 to 100 (e.g., 1 = up to 1% slippage).'
          example: '10'
        gas:
          type: string
          description: 'Maximum number of gas units to allocate for the transaction, as an integer string (e.g., ''200000''). If omitted, gas is estimated automatically. Note: this is gas units, not wei or gwei.'
          example: '100000'
        redeemRewards:
          type: boolean
          description: An optional flag indicating whether accrued rewards should be redeemed as part of the liquidity transfer transaction.
          example: false
        zeroPriceImpact:
          type: boolean
          description: When set to true, the transaction is executed to avoid any change in the asset’s price, resulting in the user receiving both LP and YT tokens, though the LP amount will be lower than in standard mode.
          example: false
        gasPriority:
          type: string
          description: Specifies the desired gas fee priority (e.g., 'low', 'medium', or 'high'), which influences the transaction speed and cost.
          example: low
        enableFee:
          type: boolean
          description: Flag to include a basis points fee transaction alongside the main transaction when set to true.
          example: false
      required:
      - marketAddress
      - from
      - dstMarketAddress
      - lpAmount
      - ptAmount
      - ytAmount
      description: The request body for a /defi/v1/yieldaggregator/transferliquidity
      example:
        yieldAggregatorId: '5200'
        marketAddress: '0xcdd26eb5eb2ce0f203a84553853667ae69ca29ce'
        from: '0xdAe2F6EdDdA6fb4fb60cc02633DE27e2b431B402'
        dstMarketAddress: '0xcdd26eb5eb2ce0f203a84553853667ae69ca29ce'
        lpAmount: '1000000000000000000'
        ptAmount: '1000000000000000000'
        ytAmount: '1000000000000000000'
        slippage: '10'
        gas: '100000'
        redeemRewards: false
        zeroPriceImpact: false
        gasPriority: low
        enableFee: false
    _yieldaggregator_removeliquidity_Request:
      type: object
      properties:
        yieldAggregatorId:
          type: string
          description: A unique identifier to route the transaction to the appropriate yield aggregator instance. This parameter is optional if a default aggregator is used.
          enum:
          - '5200'
          - '5201'
          - '5202'
          - '5203'
          - '5204'
          example: '5200'
        marketAddress:
          type: string
          description: The blockchain address of the liquidity pool or market where tokens will be deposited. This parameter directs the transaction to the correct pool within the yield aggregator.
          example: '0xcdd26eb5eb2ce0f203a84553853667ae69ca29ce'
        tokenOut:
          type: string
          description: The token that the user wishes to receive as a result of the liquidity removal. This parameter specifies which output token is desired when liquidity is withdrawn from the pool.
          example: '0x4db99b79361f98865230f5702de024c69f629fec'
        amountIn:
          type: string
          description: 'Amount of tokens to remove from the liquidity pool, specified in the token''s smallest denomination (base units). Do not send human-readable decimal values. Examples: 1 WETH (18 decimals) = "1000000000000000000"; 1 USDC (6 decimals) = "1000000".'
          example: '1000000000000000000'
        from:
          type: string
          description: Blockchain address of the sender. For EVM chains, use a checksummed hex address (e.g., 0xABCDEF...). This address must hold sufficient balance and will sign the transaction.
          example: '0xdAe2F6EdDdA6fb4fb60cc02633DE27e2b431B402'
        isDual:
          type: boolean
          description: An optional flag indicating whether the liquidity removal should be executed in dual-token mode. If set to true, liquidity will be removed for both tokens in the pool according to the pool’s ratio; if false or omitted, only a single token (as specified by tokenOut) will be withdrawn.
          example: false
        slippage:
          type: string
          description: 'The maximum allowable percentage deviation between the expected and executed swap price. Default is 1, meaning a 1% tolerance (acceptable range: 0 to 100).'
          example: '10'
        enableAggregator:
          type: boolean
          description: Enable swap aggregator functionality to facilitate swaps between tokens that are not directly convertible with the underlying asset. Set this boolean flag to true to activate advanced routing logic for such conversions.
          example: false
        gas:
          type: string
          description: 'Maximum number of gas units to allocate for the transaction, as an integer string (e.g., ''200000''). If omitted, gas is estimated automatically. Note: this is gas units, not wei or gwei.'
          example: '100000'
        gasPriority:
          type: string
          description: Specifies the desired gas fee priority (e.g., 'low', 'medium', or 'high'), which influences the transaction speed and cost.
          example: low
        enableFee:
          type: boolean
          description: Flag to include a basis points fee transaction alongside the main transaction when set to true.
          example: false
      required:
      - marketAddress
      - tokenOut
      - amountIn
      - from
      description: The request body for a /defi/v1/yieldaggregator/removeliquidity
      example:
        yieldAggregatorId: '5200'
        marketAddress: '0xcdd26eb5eb2ce0f203a84553853667ae69ca29ce'
        tokenOut: '0x4db99b79361f98865230f5702de024c69f629fec'
        amountIn: '1000000000000000000'
        from: '0xdAe2F6EdDdA6fb4fb60cc02633DE27e2b431B402'
        isDual: false
        slippage: '10'
        enableAggregator: false
        gas: '100000'
        gasPriority: low
        enableFee: false
    _yieldaggregator_swap_Request:
      type: object
      properties:
        yieldAggregatorId:
          type: string
          description: The unique identifier used to route queries or transactions to the correct yield aggregator.
          enum:
          - '5200'
          - '5201'
          - '5202'
          - '5203'
          - '5204'
          example: '5200'
        marketAddress:
          type: string
          description: The blockchain address of the source yield market from which the tokens will be swapped. This address directs the swap to the appropriate liquidity pool within the aggregator.
          example: '0xcdd26eb5eb2ce0f203a84553853667ae69ca29ce'
        from:
          type: string
          description: Blockchain address of the sender. For EVM chains, use a checksummed hex address (e.g., 0xABCDEF...). This address must hold sufficient balance and will sign the transaction.
          example: '0xdAe2F6EdDdA6fb4fb60cc02633DE27e2b431B402'
        path:
          type: array
          items:
            type: string
          description: 'Ordered array of token contract addresses defining the swap route from input to output. Provide [tokenInAddress, tokenOutAddress] for a direct swap. Example (WETH→USDC): [''0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2'', ''0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48''].'
          example:
          - '0x514910771AF9Ca656af840dff83E8264EcF986CA'
          - '0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48'
        amountIn:
          type: string
          description: 'Amount of the input token to provide, specified in the token''s smallest denomination (base units). Do not send human-readable decimal values. Examples: to swap 1 WETH (18 decimals), use "1000000000000000000"; to swap 1 USDC (6 decimals), use "1000000".'
          example: '1000000000000000000'
        slippage:
          type: string
          description: 'The maximum allowable percentage deviation between the expected and executed swap price. Default is 1, meaning a 1% tolerance (acceptable range: 0 to 100).'
          example: '10'
        gas:
          type: string
          description: 'Maximum number of gas units to allocate for the transaction, as an integer string (e.g., ''200000''). If omitted, gas is estimated automatically. Note: this is gas units, not wei or gwei.'
          example: '100000'
        enableAggregator:
          type: boolean
          description: Enable swap aggregator functionality to facilitate swaps between tokens that are not directly convertible with the underlying asset. Set this boolean flag to true to activate advanced routing logic for such conversions.
          example: false
        gasPriority:
          type: string
          description: Specifies the desired gas fee priority for the transaction. Acceptable values include 'low', 'medium', or 'high', and this setting can influence the speed and cost of the swap.
          example: low
        enableFee:
          type: boolean
          description: Flag to include a basis points fee transaction alongside the main transaction when set to true.
          example: false
      required:
      - marketAddress
      - from
      - path
      - amountIn
      description: The request body for a /defi/v1/yieldaggregator/swap
      example:
        yieldAggregatorId: '5200'
        marketAddress: '0xcdd26eb5eb2ce0f203a84553853667ae69ca29ce'
        from: '0xdAe2F6EdDdA6fb4fb60cc02633DE27e2b431B402'
        path:
        - '0x514910771AF9Ca656af840dff83E8264EcF986CA'
        - '0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48'
        amountIn: '1000000000000000000'
        slippage: '10'
        gas: '100000'
        enableAggregator: false
        gasPriority: low
        enableFee: false
    _yieldaggregator_withdrawvault_Request:
