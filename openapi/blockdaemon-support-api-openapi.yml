openapi: 3.2.0
info:
  contact:
    name: Blockdaemon
    email: info@blockdaemon.com
  description: The Blockdaemon DeFi API provides a single interface to a multitude of DeFi projects and blockchains
  title: Blockdaemon DeFi Support API
  version: 1.0.0
  x-logo:
    altText: Blockdaemon logo
    backgroundColor: '#fafafa'
    url: https://storage.googleapis.com/blockdaemon-app-static-images/marketing/PNG/dark-logo.png
servers:
- url: https://svc.blockdaemon.com
security:
- ApiKeyAuth: []
tags:
- name: Support
  description: API endpoints for supported chains or protocols
paths:
  /defi/v1:
    get:
      tags:
      - Support
      summary: Get API Metadata
      description: 'Return the breakdown a breakdown of supported chains and protocol IDs for a given DeFi API endpoint.


        > 💡

        **Compute Unit Value:** `100` (Fixed)'
      operationId: getapimetadatav2
      parameters:
      - name: category
        in: query
        required: true
        schema:
          type: string
          description: Specifies the general API category. Valid values are `account`, `dex`, and `bridge`.
          example: dex
        description: Specifies the general API category. Valid values are `account`, `dex`, and `bridge`.
      - name: endpoint
        in: query
        required: true
        schema:
          type: string
          description: "Specifies the endpoint name within the selected category. Available options:\n\n- **`account` category:**\n  - [`allowance`](https://docs.blockdaemon.com/reference/defi-account-allowance)\n  - [`portfolio`](https://docs.blockdaemon.com/reference/defi-account-portfolio)\n\n- **`dex` category:**\n  - [`price`](https://docs.blockdaemon.com/reference/defi-dex-get-price)\n  - [`quotes`](https://docs.blockdaemon.com/reference/defi-dex-quote-aggregator)\n  - [`swaps`](https://docs.blockdaemon.com/reference/defi-dex-swap-aggregator)\n  - [`swap`](https://docs.blockdaemon.com/reference/defi-dex-swap)\n  - [`swap-with-approval`](https://docs.blockdaemon.com/reference/defi-dex-swap-with-approval)\n\n- **`bridge` category:**\n  - [`tokens`](https://docs.blockdaemon.com/reference/defi-bridge-tokens)\n  - [`price`](https://docs.blockdaemon.com/reference/defi-bridge-get-price)\n  - [`quotes`](https://docs.blockdaemon.com/reference/defi-bridge-quote-aggregator)\n  - [`swaps`](https://docs.blockdaemon.com/reference/defi-bridge-swap-aggregator)\n  - [`unlock`](https://docs.blockdaemon.com/reference/defi-bridge-unlock)\n  - [`swap`](https://docs.blockdaemon.com/reference/defi-bridge-swap)\n  - [`swap-with-approval`](https://docs.blockdaemon.com/reference/defi-bridge-swap-with-approval)\n  - [`transactions`](https://docs.blockdaemon.com/reference/defi-bridge-get-transaction)\n"
          example: getprice
        description: "Specifies the endpoint name within the selected category. Available options:\n\n- **`account` category:**\n  - [`allowance`](https://docs.blockdaemon.com/reference/defi-account-allowance)\n  - [`portfolio`](https://docs.blockdaemon.com/reference/defi-account-portfolio)\n\n- **`dex` category:**\n  - [`price`](https://docs.blockdaemon.com/reference/defi-dex-get-price)\n  - [`quotes`](https://docs.blockdaemon.com/reference/defi-dex-quote-aggregator)\n  - [`swaps`](https://docs.blockdaemon.com/reference/defi-dex-swap-aggregator)\n  - [`swap`](https://docs.blockdaemon.com/reference/defi-dex-swap)\n  - [`swap-with-approval`](https://docs.blockdaemon.com/reference/defi-dex-swap-with-approval)\n\n- **`bridge` category:**\n  - [`tokens`](https://docs.blockdaemon.com/reference/defi-bridge-tokens)\n  - [`price`](https://docs.blockdaemon.com/reference/defi-bridge-get-price)\n  - [`quotes`](https://docs.blockdaemon.com/reference/defi-bridge-quote-aggregator)\n  - [`swaps`](https://docs.blockdaemon.com/reference/defi-bridge-swap-aggregator)\n  - [`unlock`](https://docs.blockdaemon.com/reference/defi-bridge-unlock)\n  - [`swap`](https://docs.blockdaemon.com/reference/defi-bridge-swap)\n  - [`swap-with-approval`](https://docs.blockdaemon.com/reference/defi-bridge-swap-with-approval)\n  - [`transactions`](https://docs.blockdaemon.com/reference/defi-bridge-get-transaction)\n"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: number
                    description: Numeric status code indicating success or failure of the API call
                    example: 200
                  msg:
                    type: string
                    description: Human-readable message describing the API result or error
                  data:
                    anyOf:
                    - type: array
                      items:
                        type: object
                        properties:
                          protocolName:
                            type: string
                            description: Name of a protocol or dApp
                          protocolLogo:
                            type: string
                            description: Logo URL of the protocol
                          protocolDescription:
                            type: string
                            description: Description of the protocol
                          supportedChains:
                            type: array
                            items:
                              type: object
                              properties:
                                chainName:
                                  type: string
                                  description: Human-readable blockchain network name
                                chainSymbol:
                                  type: string
                                  description: Symbol representing the chain (e.g., ETH, SOL)
                                  example: ETH
                                chainId:
                                  type: string
                                  description: Blockchain network identifier (EVM chain ID, Solana chain name, etc.)
                                  example: '1'
                                protocolId:
                                  type: string
                                  description: Unique identifier for a protocol
                                chainLogo:
                                  type: string
                                  description: Logo URL of the chain
                              required:
                              - chainName
                              - chainSymbol
                              - chainId
                              - protocolId
                              - chainLogo
                            description: List of blockchain networks supported by a protocol
                          curators:
                            type: array
                            items:
                              type: object
                              properties:
                                curatorName:
                                  type: string
                                curatorLogo:
                                  type:
                                  - string
                                  - 'null'
                              required:
                              - curatorName
                              - curatorLogo
                            description: List of curators associated with a protocol
                        required:
                        - protocolName
                        - protocolLogo
                        - supportedChains
                    - type: object
                      properties:
                        supportedChains:
                          type: array
                          items:
                            type: object
                            properties:
                              chainName:
                                type: string
                                description: Human-readable blockchain network name
                              chainSymbol:
                                type: string
                                description: Symbol representing the chain (e.g., ETH, SOL)
                                example: ETH
                              chainId:
                                type: string
                                description: Blockchain network identifier (EVM chain ID, Solana chain name, etc.)
                                example: '1'
                              chainLogo:
                                type: string
                                description: Logo URL of the chain
                            required:
                            - chainName
                            - chainSymbol
                            - chainId
                            - chainLogo
                          description: List of blockchain networks supported by a protocol
                      required:
                      - supportedChains
                example:
                  status: 200
                  msg: success
                  data:
                  - protocolName: Allbridge Classic
                    protocolLogo: https://images.ctfassets.net/hwqnbx905qdp/2vV87CvU8dpOWbEE4S5iyc/a8274f79f7c958f612b67cc6d541396a/85946314.png
                    supportedChains:
                    - chainName: Ethereum
                      chainSymbol: ETH
                      chainId: '1'
                      protocolId: '300'
                      chainLogo: https://images.ctfassets.net/hwqnbx905qdp/1uwuF76WP6poLF5am22HFZ/bcece6e735a0d8505d23de16fdd7b89f/Protocol_Ethereum.svg
                    - chainName: Avalanche
                      chainSymbol: C-AVAX
                      chainId: '43114'
                      protocolId: '300'
                      chainLogo: https://images.ctfassets.net/hwqnbx905qdp/7sdZNsYGFV8zfUNnFrMlXb/7eeee545a13447a0018ce3162ff21d76/eip155_59144-0x5471ea8f739dd37e9b81be9c5c77754d8aa953e4.webp
                    - chainName: Polygon
                      chainSymbol: MATIC
                      chainId: '137'
                      protocolId: '300'
                      chainLogo: https://images.ctfassets.net/hwqnbx905qdp/Gk0M0TjvKl5OMLor03LpV/448163986bfe9319a5128b7ab734b68c/eip155_56-0xcc42724c6683b7e57334c4e856f4c9965ed682bd.webp
                    - chainName: Fantom
                      chainSymbol: FTM
                      chainId: '250'
                      protocolId: '300'
                      chainLogo: https://images.ctfassets.net/hwqnbx905qdp/70kBoXxQrTqEjHrHMQIamh/6a6e76cf5da4b780c26717eeaa823347/eip155_56-0xad29abb318791d579433d831ed122afeaf29dcfe.webp
                    - chainName: BinanceSmartChain
                      chainSymbol: BSC
                      chainId: '56'
                      protocolId: '300'
                      chainLogo: https://images.ctfassets.net/hwqnbx905qdp/4lToZjRQXkpr9xb34e5PEZ/0591c40dbafe060739489d232bc87950/eip155_1284-0xc9baa8cfdde8e328787e29b4b078abf2dadc2055.webp
                    - chainName: Stellar
                      chainSymbol: XLM
                      chainId: '1500'
                      protocolId: '300'
                      chainLogo: https://images.ctfassets.net/hwqnbx905qdp/3KLxLBNccfDXD7ef3PwShn/c49ec95d80ab6c227d9fd320eab39fc6/Protocol_Stellar.png
                    - chainName: XRPLedger
                      chainSymbol: XRPL
                      chainId: '1600'
                      protocolId: '300'
                      chainLogo: https://images.ctfassets.net/hwqnbx905qdp/YfQcBw3g5AQftCB1RnNMN/e9954b2a8316a300bdd0eef66553539f/Protocol_XRP.png
      x-bd-cu: '100'
      x-bd-cu-type: fixed
