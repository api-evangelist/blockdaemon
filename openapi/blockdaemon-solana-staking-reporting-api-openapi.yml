openapi: 3.2.0
info:
  version: 1.0.0
  title: Solana Staking Reporting API
  description: '### Protocols

    The following protocols are currently supported:

    * Cardano

    * Cosmos

    * Ethereum

    * NEAR

    * Polkadot

    * Polygon

    * Solana'
  contact:
    name: Blockdaemon
    email: support@blockdaemon.com
    url: https://blockdaemon.com
  x-logo:
    url: logo.png
servers:
- url: https://svc.blockdaemon.com/reporting/staking
  description: Production server
security:
- apiKeyAuthHeader: []
- bearerAuth: []
tags:
- name: Solana Staking Reporting
paths:
  /v2/solana/{network}/health:
    get:
      summary: Get the Protocol Rewards Processing Health
      description: 'The status of reward processing, if optimal then all rewards data up to the indicated metadata fields are available the processing status is degraded if any of the following are true:


        * `chainEpoch` - `lastProcessedInflationEpoch` > 1

        * `chainEpoch` - `lastProcessedStatusesEpoch` > 1

        * if the `lastProcessedSlot` is over 20 minutes behind the chainSlot - note we run 10 minutes behind by design to alleviate any reorgs so this is a 10 minuate buffer on top of that

        * `chainEpoch` - `lastProcessedMevEpoch` > 1

        * if the `lastProcessedMevTxTimestamp` is older than 3.2 days, this is mainly as a check to see if the jito mev bot has paid out expectedly or not, not that our system is degraded


        **Please note** that mev rewards are allocated to the epoch they are paid out in *not* the epoch they are earned in.'
      tags:
      - Solana Staking Reporting
      operationId: getHealth1
      parameters:
      - in: path
        name: network
        required: true
        description: The network to look up against
        schema:
          type: string
          default: mainnet
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse1'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v2/solana/{network}/{type}/rewards:
    post:
      summary: Get a Stream of Rewards
      description: Returns 0 or more reward objects in a streaming fashion using `ndjson`.
      tags:
      - Solana Staking Reporting
      operationId: getRewards1
      parameters:
      - in: path
        name: network
        required: true
        description: The network to look up against.
        schema:
          type: string
          default: mainnet
      - in: path
        name: type
        required: true
        schema:
          $ref: '#/components/schemas/Type'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RewardRequest1'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/x-ndjson:
              schema:
                $ref: '#/components/schemas/RewardsResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v2/solana/{network}/{type}/rewards/{address}:
    get:
      summary: Get a Stream of Rewards for a Single Address
      description: Returns 0 or more reward objects in a streaming fashion using `ndjson`. Must specify either a start and end time or an epoch
      tags:
      - Solana Staking Reporting
      operationId: getRewardsSingle1
      parameters:
      - in: path
        name: network
        required: true
        description: The network to look up against.
        schema:
          type: string
          default: mainnet
      - in: path
        name: type
        required: true
        schema:
          $ref: '#/components/schemas/Type'
      - in: path
        name: address
        required: true
        description: The address to look up rewards for.
        example: FQwewNXahV7MiZcLpY6p1xhUs2acVGQ3U5Xxc7FzV571
        schema:
          type: string
          default: FQwewNXahV7MiZcLpY6p1xhUs2acVGQ3U5Xxc7FzV571
      - in: query
        name: startTime
        required: false
        description: Epoch-based start time for reward queries. You can not specify both an epoch and start/end times.
        example: 1709251200
        schema:
          type: number
          default: 1709251200
      - in: query
        name: endTime
        required: false
        description: Epoch-based end time for reward queries. You can not specify both an epoch and start/end times
        example: 1711929600
        schema:
          type: number
          default: 1711929600
      - in: query
        name: epoch
        required: false
        description: The epoch to look up rewards for, you can not specify both an epoch and start/end times
        example: 755
        schema:
          type: number
          default: 755
      - in: query
        name: period
        required: true
        description: The type of aggregation to apply.
        schema:
          $ref: '#/components/schemas/TimePeriod2'
      - in: query
        name: denomination
        required: false
        description: the denomination to return the rewards in
        schema:
          $ref: '#/components/schemas/Denomination1'
      responses:
        '200':
          description: OK
          content:
            application/x-ndjson:
              schema:
                $ref: '#/components/schemas/RewardsResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v2/solana/{network}/{type}/stats/{address}:
    get:
      summary: Get Stats for an address
      description: Returns stats for an address including 30 and 90 days of yield and rewards data based on utc days If an address is not currently monitored a 404 is returned, on the first query for an address data is async calculated and then updated daily
      tags:
      - Solana Staking Reporting
      operationId: getStatsSolana
      parameters:
      - in: path
        name: network
        required: true
        description: The blockchain network to query (e.g., mainnet).
        schema:
          type: string
          default: mainnet
      - in: path
        name: type
        required: true
        schema:
          $ref: '#/components/schemas/Type'
      - in: path
        name: address
        required: true
        description: The validator address to retrieve stats data for.
        example: FQwewNXahV7MiZcLpY6p1xhUs2acVGQ3U5Xxc7FzV571
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsResponseSolana'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Preemptively add an address to the stats tracking
      tags:
      - Solana Staking Reporting
      operationId: putStatsSolana
      parameters:
      - in: path
        name: network
        required: true
        description: The blockchain network to query (e.g., mainnet).
        schema:
          type: string
          default: mainnet
      - in: path
        name: type
        required: true
        schema:
          $ref: '#/components/schemas/Type'
      - in: path
        name: address
        required: true
        description: The validator address to retrieve stats data for.
        example: FQwewNXahV7MiZcLpY6p1xhUs2acVGQ3U5Xxc7FzV571
        schema:
          type: string
      responses:
        '201':
          description: CREATED
  /v2/solana/{network}/{type}/status:
    post:
      summary: Get a Stream of Statuses
      description: Returns 0 or more status objects in a streaming fashion using `ndjson`.
      tags:
      - Solana Staking Reporting
      operationId: getStatuses1
      parameters:
      - in: path
        name: network
        required: true
        description: The network to look up against.
        schema:
          type: string
          default: mainnet
      - in: path
        name: type
        required: true
        schema:
          $ref: '#/components/schemas/Type'
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
              example:
              - FQwewNXahV7MiZcLpY6p1xhUs2acVGQ3U5Xxc7FzV571
              default:
              - FQwewNXahV7MiZcLpY6p1xhUs2acVGQ3U5Xxc7FzV571
        required: true
      responses:
        '200':
          description: OK
          content:
            application/x-ndjson:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v2/solana/{network}/{type}/status/{address}:
    get:
      summary: Get Status for an Address
      description: Returns a status object for an address.
      tags:
      - Solana Staking Reporting
      operationId: getStatus1
      parameters:
      - in: path
        name: network
        required: true
        description: The network to look up against
        schema:
          type: string
          default: mainnet
      - in: path
        name: type
        required: true
        schema:
          $ref: '#/components/schemas/Type'
      - in: path
        name: address
        required: true
        description: The address to look up rewards for
        example: FQwewNXahV7MiZcLpY6p1xhUs2acVGQ3U5Xxc7FzV571
        schema:
          type: string
          default: FQwewNXahV7MiZcLpY6p1xhUs2acVGQ3U5Xxc7FzV571
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v2/solana/{network}/{type}/yield:
    get:
      summary: Get a Stream of Yield Summaries
      description: 'Returns a **network-wide** stream of yield summaries for the specified type and time range. Results are streamed in NDJSON format.


        For more details on yield metrics and how they are calculated, see the Yield Metrics overview.'
      tags:
      - Solana Staking Reporting
      operationId: getYieldsSolana
      parameters:
      - in: path
        name: network
        required: true
        description: The blockchain network to query (e.g., mainnet).
        schema:
          type: string
          default: mainnet
      - in: path
        name: type
        required: true
        description: 'The type of yield data to retrieve:

          - `validator`: includes the validator’s own rewards.

          - `delegator`: includes rewards distributed to delegators of that validator.


          Call both endpoints and aggregate the results to get a complete network-wide view.

          '
        schema:
          $ref: '#/components/schemas/TypeYieldSolana'
      - in: query
        name: startTime
        required: true
        description: Epoch-based start time for reward queries.
        example: 1709251200
        schema:
          type: number
      - in: query
        name: endTime
        required: true
        description: Epoch-based end time for reward queries.
        example: 1711929600
        schema:
          type: number
      - in: query
        name: denomination
        description: The unit to return the yield in (e.g., `lamports`).
        required: false
        schema:
          $ref: '#/components/schemas/Denomination1'
      - in: query
        name: raw
        description: Gives the yield values raw per-epoch. Set to `true` to get per-epoch raw values.
        required: false
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: OK
          content:
            application/x-ndjson:
              schema:
                $ref: '#/components/schemas/YieldResponseSolana'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v2/solana/{network}/{type}/yield/{address}:
    get:
      summary: Get a Yield for a Validator Address
      description: 'Returns yield data for the specified validator address within a given type.

        For more details on yield metrics and how they are calculated, see the Yield Metrics overview.


        ⚠️ **Note:** This endpoint does not support validators with a 100% commission rate and will not return yield data for them.'
      tags:
      - Solana Staking Reporting
      operationId: getYieldSolana
      parameters:
      - in: path
        name: network
        required: true
        description: The blockchain network to query (e.g., mainnet).
        schema:
          type: string
          default: mainnet
      - in: path
        name: type
        required: true
        description: "The type of yield data to retrieve:\n- `validator`: includes the validator’s own rewards.\n- `delegator`: includes rewards distributed to delegators of that validator.                 \n"
        schema:
          $ref: '#/components/schemas/TypeYieldSolana'
      - in: path
        name: address
        required: true
        description: The validator address to query yield data for.
        example: FQwewNXahV7MiZcLpY6p1xhUs2acVGQ3U5Xxc7FzV571
        schema:
          type: string
          default: FQwewNXahV7MiZcLpY6p1xhUs2acVGQ3U5Xxc7FzV571
      - in: query
        name: startTime
        required: true
        description: Epoch-based start time for reward queries.
        example: 1709251200
        schema:
          type: number
      - in: query
        name: endTime
        required: true
        description: Epoch-based end time for reward queries.
        example: 1711929600
        schema:
          type: number
      - in: query
        name: denomination
        description: The unit to return the yield in (e.g., `lamports`).
        required: false
        schema:
          $ref: '#/components/schemas/Denomination1'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YieldResponseSolana'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    DelegatorStakeStatusMetadata:
      title: Delegator Stake Status Metadata
      properties:
        identity:
          description: the validator identity address the stake account is delegated to
          type: string
          example: 7cVfgArCheMR6Cs4t6vz5rfnqd56vZq4ndaBrY5xkxXy
        voteKey:
          description: the validator vote key address the stake account is delegated to
          type: string
          example: FQwewNXahV7MiZcLpY6p1xhUs2acVGQ3U5Xxc7FzV571
        type:
          description: the type of status object this is
          type: string
          enum:
          - delegator
        activationEpoch:
          description: the activation epoch of the stake account
          type: string
          format: number
          example: 308
        deactivationEpoch:
          description: the deactivation epoch of the stake account if set to 18446744073709551615 then the account is active
          type: string
          format: number
          example: 508
        solanaAccount:
          description: the solana account the stake account is linked to
          type: string
          example: 5LJ93G4SQh9GiewTQJNAu6X9sQ1VVyrpCAgbQsRSgn22
        stakeAccount:
          description: the stake account address
          type: string
          example: HEcQHKyVaM6mRd4728RTJPvWcezm2mkPoAUazt992RJt
        activeStake:
          description: "The total active stake for the stake account, if the overall status is inactive then this is not \"active stake\". \nThis is updated at approximately hourly intervals.\n"
          type: string
          format: number
          example: 331417862470541
    TimePeriod2:
      description: How the data is aggregated, raw is checkpoint level data
      type: string
      default: monthly
      enum:
      - yearly
      - daily
      - weekly
      - monthly
      - epoch
      - raw
    Denomination1:
      description: The denomination to return rewards in
      type: string
      default: lamports
      enum:
      - lamports
      - sol
    ValidatorStatusMetadata:
      title: Validator Status Metadata
      properties:
        authorisedWithdrawer:
          description: the authorised withdrawer address
          type: string
          example: GRKMJ1zE99jGh4SVA8HCwizVN9fL3yvr8JCCgvqUpbNv
        commission:
          description: the commisson the validator charges
          type: string
          format: number
          example: 8
        identity:
          description: the validator identity address
          type: string
          example: 7cVfgArCheMR6Cs4t6vz5rfnqd56vZq4ndaBrY5xkxXy
        voteKey:
          description: the validator vote key address
          type: string
          example: FQwewNXahV7MiZcLpY6p1xhUs2acVGQ3U5Xxc7FzV571
        type:
          description: the type of status object this is
          type: string
          enum:
          - validator
        activeStake:
          description: "the total active stake against the a validator, as defined by calling the getProgramAccounts method for the stake program \nand summing the stake account stakes by the validator pub key, note: a stake account is \"active\" if it does not have a \ndeactivation epoch set. This is updated at approximately hourly intervals.\n"
          type: string
          format: number
          example: 331417862470541
    YieldResponseSolana:
      description: The reward response object
      type: object
      properties:
        startTime:
          description: Epoch-based start time for reward queries.
          type: number
          example: 1709251200
        endTime:
          description: Epoch-based end time for reward queries.
          type: number
          example: 1711929600
        return:
          description: The staking return for all delegators or validators for the period
          type: string
          example: '283291849202'
          format: number
        apr:
          description: The APR for delegators or validators based on the return, total stake of the network and assuming 180 epochs a year
          type: string
          example: '0.0601'
          format: number
        aprPercentage:
          description: The same as above but in percentage form
          type: string
          example: 6.01%
          format: number
        apy:
          description: The APY based on the above and assuming re-staking of all rewards after each epoch
          type: string
          example: '0.06912'
          format: number
        apyPercentage:
          description: The same as above but in percentage form
          type: string
          example: 6.912%
          format: number
        denomination:
          description: the denomination the reward is in
          type: string
          example: lamports
        stake:
          description: the total stake across the full network
          type: string
          example: '3830810096309000'
          format: number
        metadata:
          oneOf:
          - $ref: '#/components/schemas/ValidatorYieldMetadataSolana'
          - $ref: '#/components/schemas/DelegatorYieldMetadataSolana'
    DelegatorYieldMetadataSolana:
      properties:
        fee:
          description: the amount of rewards from fees
          type: string
          format: number
          example: '532626257312'
        epoch:
          description: Only present for protocol yield, The epoch number/s that the period covers
          type: string
          format: number
          example: '1'
        mev:
          description: the amount of rewards from jito mev
          type: string
          format: number
          example: '532626257312'
        staking:
          description: the amount of rewards from staking
          type: string
          format: number
          example: '532626257312'
    HealthResponse1:
      description: The health response object
      type: object
      properties:
        status:
          description: the health status
          type: string
          default: OPTIMAL
          enum:
          - UNKNOWN
          - OPTIMAL
          - DEGRADED
        timestamp:
          description: the timestamp when the status was last updated in epoch seconds
          type: number
          example: 1704067200
        metadata:
          $ref: '#/components/schemas/HealthMetadata1'
    Type:
      description: Specifies whether the request is for a validator or delegator.
      type: string
      enum:
      - validator
      - delegator
    RewardRequest1:
      required:
      - addresses
      type: object
      properties:
        startTime:
          description: Epoch-based start time for reward queries.
          type: number
          example: 1709251200
          default: 1709251200
        endTime:
          description: Epoch-based end time for reward queries.
          type: number
          example: 1711929600
          default: 1711929600
        epoch:
          description: The epoch
          type: number
          example: 755
          default: 755
        addresses:
          description: List of addresses to retrieve rewards for.
          type: array
          items:
            type: string
          example:
          - FQwewNXahV7MiZcLpY6p1xhUs2acVGQ3U5Xxc7FzV571
          default:
          - FQwewNXahV7MiZcLpY6p1xhUs2acVGQ3U5Xxc7FzV571
        period:
          $ref: '#/components/schemas/TimePeriod2'
        aggregate:
          description: Whether to aggregate across provided addresses or per address - true to aggregate across all addresses.
          type: boolean
          default: false
        denomination:
          $ref: '#/components/schemas/Denomination1'
    DelegatorRewardsMetadata:
      title: Delegator Rewards Metadata
      description: 'A map of string keys to string values, note that not all fields will be present depending on the period chosen in the request and that new fields could also be added at any time

        '
      properties:
        epoch:
          description: The epoch number/s that the period covers
          type: string
          format: number
          example: '1'
        identity:
          description: The validator identity that the stake account is delegated to
          type: string
          example: 7cVfgArCheMR6Cs4t6vz5rfnqd56vZq4ndaBrY5xkxXy
        slot:
          description: The slot/s that are included in the period
          type: string
          format: number
          example: '251296884'
        voteKey:
          description: The validator vote key that the stake account is delegated to
          type: string
          example: FQwewNXahV7MiZcLpY6p1xhUs2acVGQ3U5Xxc7FzV571
        mev:
          description: the amount of rewards from jito mev
          type: string
          format: number
          example: '532626257312'
        staking:
          description: the amount of rewards from staking
          type: string
          format: number
          example: '532626257312'
        stakeAccount:
          description: the stake account this reward is for
          type: string
          example: HEcQHKyVaM6mRd4728RTJPvWcezm2mkPoAUazt992RJt
        solanaAccount:
          description: the solana account the stake account is linked to
          type: string
          example: 5LJ93G4SQh9GiewTQJNAu6X9sQ1VVyrpCAgbQsRSgn22
    DelegatorAccountStatusMetadata:
      title: Delegator Account Status Metadata
      properties:
        type:
          description: the type of status object this is
          type: string
          enum:
          - delegator
        solanaAccount:
          description: the solana account
          type: string
          example: 5LJ93G4SQh9GiewTQJNAu6X9sQ1VVyrpCAgbQsRSgn22
        activeStakeAccounts:
          description: csv of active stake accounts this solana account is linked to, only present in delegator solana account statuses
          type: string
          format: csv
          example: FJLNfMzEz3Jt3SNWurkhF8iwRtpPbAte9CVaTsnAjsQT,8SWy8cePppycfhhcrnfBEBNqTZTpNRNGQARbgWaYeKjb
        inactiveStakeAccounts:
          description: csv of inactive stake accounts this solana account is linked to, only present in delegator solana account statuses
          type: string
          format: csv
          example: EQrjCtqFowuFPa15UxbBPKbisVgtynF8FUDKmNghZXE6,2PhQgAbcaDTnjxKQ8DFwwHZiXBa6Ekq9MvEc2DyaboCy
        activeStake:
          description: "the total active stake against the a solana account, as defined by calling the getProgramAccounts method for the stake program \nand summing the stake account stakes by the solana pub key, note: a stake account is \"active\" if it does not have a \ndeactivation epoch set. This is updated at approximately hourly intervals.\n"
          type: string
          format: number
          example: 331417862470541
    StatsResponseSolana:
      type: object
      description: "note: the delegatorYield field is only included if the address is a validator, \nwhen included this is delegators yield information to that validator\n"
      properties:
        updateTime:
          type: integer
          format: int64
          example: 1775718200
          description: epoch second timestamp of the end time the stats is for
        thirtyDays:
          type: object
          properties:
            yield:
              $ref: '#/components/schemas/YieldResponseSolana'
            delegatorYield:
              $ref: '#/components/schemas/YieldResponseSolana'
            rewards:
              $ref: '#/components/schemas/RewardsResponse'
