openapi: 3.0.3
info:
  title: Transaction API
  version: 1.0.0
  description: Blockdaemon transaction API to create, compile, send and verify transactions for supported blockchains.
  contact:
    name: Blockdaemon
    email: info@blockdaemon.com
    url: https://blockdaemon.com
  x-logo:
    url: https://storage.googleapis.com/blockdaemon-app-static-images/marketing/PNG/dark-logo.png
    altText: Blockdaemon logo
servers:
- url: https://svc.blockdaemon.com/tx/v1
  description: Blockdaemon transaction API
security:
- apiKeyAuthHeader: []
- bearerAuth: []
paths:
  /{blockchain_id}:
    parameters:
    - $ref: '#/components/parameters/blockchain_id'
    get:
      summary: Get the Supported Protocol Info
      description: Returns the transaction endpoints supported for the given chain.
      operationId: GetOverview
      responses:
        '200':
          description: A list of endpoints
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OverviewResponse'
  /{blockchain_id}/compile:
    parameters:
    - $ref: '#/components/parameters/blockchain_id'
    post:
      summary: Compile an Unsigned Transaction
      description: Takes an unsigned transaction and a signature and returns a signed transaction.
      operationId: TxCompile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiTxCompileRequest'
            examples:
              evm:
                summary: EVM example
                value:
                  unsigned_tx: e909843b9aca008252089481b7e08f65bdf5648606c89998a9cc81643976478601d1a94a200080808080
                  address: b9aca008252089481b7e08f65bdf5648606c8
                  signature: ''
                  public_key: ''
              btc_single_signature:
                summary: Bitcoin P2PKH example with a single signature for a single UTxO
                value:
                  unsigned_tx: 010000000131da247ea6672d26661559a06d677cf1756feebc2b8fb299a36125b68047d2050000000000ffffffff0210270000000000001976a91417e036c0c8b9e59c99cf1e2d6b7d0a4864a336f988ac729a0000000000001976a914b3d049ba9f8947c29b491cb14ddea70241ba353e88ac00000000
                  signatures:
                  - signature: 3045022100e4db442039a65eb2a0043647a5f88c5211dd3dcc39d4eba379301c87940587190220764dd4609b7efac2be539bdca148072ad172f53314ff68e9f8801f4b1ea754b0
                    address: mwuimViRhJ5nMJDFiS3ZTQ73hmBH1NUjZA
                    public_key: '0x027513c263c79dc1acde054bbb754616b67612924b98893efa73708f73441bccdb'
              btc_multiple_signatures:
                summary: Bitcoin P2WPKH example with multiple signatures for each UTxO
                value:
                  unsigned_tx: 
                  signatures:
                  - signature: 30440220428fc6fd5cff7b5023699f1e32694c8cab3f8de2dc841d886f9235b2658c0ef4022059e344ea9d5a2434c416ad2164e445aa44d87daaba507bc8f8fde198ab9a5b57
                    address: tb1q3htkpzlf344ajvmg7fx5tvgktd6vhyfhlq9urn
                    public_key: 025dafb4159e25323eb2c7c684bec7de6bb5a3d17b1adc66a0025563e4081adf3f
                  - signature: 304402207ed5e14b8fff54138b1f1e7e3d19c7f7d670c783b5aa157edca7d433eb55e4e5022067ebd3f41b788ecb109d0fb053ae895dfa172ee0556c94bdc1ab798d59753714
                    address: tb1q3htkpzlf344ajvmg7fx5tvgktd6vhyfhlq9urn
                    public_key: 025dafb4159e25323eb2c7c684bec7de6bb5a3d17b1adc66a0025563e4081adf3f
                  - signature: 3045022100a3a2082e864caf7b3645d942a96c68da7aed2bccffbdddf5d11456440f3c960a022073ee6723e6ff1a99f78ced51a04669947f4799fdb55900ddfa4747b9eb5ec4be
                    address: tb1q3htkpzlf344ajvmg7fx5tvgktd6vhyfhlq9urn
                    public_key: 025dafb4159e25323eb2c7c684bec7de6bb5a3d17b1adc66a0025563e4081adf3f
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTxSigned'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests'
        '500':
          $ref: '#/components/responses/ErrorInternal'
        '501':
          $ref: '#/components/responses/ErrorNotImplemented'
        '503':
          $ref: '#/components/responses/ErrorServiceUnavailable'
  /{blockchain_id}/compile_and_send:
    parameters:
    - $ref: '#/components/parameters/blockchain_id'
    post:
      summary: Compile and Broadcast an Unsigned Transaction
      description: Compile and broadcast an unsigned EVM transaction with signature.
      operationId: TxCompileAndSend
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiTxCompileRequest'
            example:
              unsigned_tx: e909843b9aca008252089481b7e08f65bdf5648606c89998a9cc81643976478601d1a94a200080808080
              address: b9aca008252089481b7e08f65bdf5648606c8
              signature: ''
              public_key: ''
      responses:
        '200':
          description: A submitted Transaction ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTxSendResponse'
              example:
                id: 9c8ac345b443dd10a418ea0beaa320ef233dbae5590be2a11ac090e0e9839c1c
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests'
        '500':
          $ref: '#/components/responses/ErrorInternal'
        '501':
          $ref: '#/components/responses/ErrorNotImplemented'
        '503':
          $ref: '#/components/responses/ErrorServiceUnavailable'
  /{blockchain_id}/create:
    parameters:
    - $ref: '#/components/parameters/blockchain_id'
    post:
      summary: Create an Unsigned Transaction
      description: 'Creates an unsigned transaction for the specified blockchain. The output is raw transaction data ready for signing.

        '
      operationId: TxCreate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiTxCreateRequest'
            examples:
              evm:
                summary: (EVM) Utilizing fees and nonce
                value:
                  from: '0x035F67C6D401514f58E6b121bc38b161cCABF7B9'
                  to: '0xcC1d7718ce9C6aae689c95672BFC5341e5a4De77'
                  value: 2500000000000
                  nonce: 1010
                  maxFeePerGas: 1000
                  maxPriorityFeePerGas: 500
              evm_erc20:
                summary: (EVM) Erc-20 transfer using contract address
                value:
                  from: '0x035F67C6D401514f58E6b121bc38b161cCABF7B9'
                  to: '0xaFF4481D10270F50f203E0763e2597776068CBc5'
                  value: 0
                  maxFeePerGas: 1000
                  maxPriorityFeePerGas: 500
                  data: '0xa9059cbb000000000000000000000000ecbedcf205b361eb671de51d20657ff55b3389d00000000000000000000000000000000000000000000000000000000001287a70'
              btc_mainnet:
                summary: (Bitcoin) Bitcoin mainnet example
                value:
                  from:
                  - tx_id: effd7af88861ccb25714216ba78561a8bf2e93ebe45b2deac37da8f284591b0e
                    index: 1
                  to:
                  - destination: bc1pndths0lnsvem2a0n2c6t49u462xam0n4krjl6kpfwn0nknc0cd7qmnxhf8
                    value: 400
                  - destination: bc1p67w73lj44z2m3x8l4ftu3ukcygjm3qyl6esjqcrpf6wn5m35gmns2szzta
                    value: 400
              btc_testnet:
                summary: (Bitcoin) Bitcoin testnet example
                value:
                  from:
                  - tx_id: 3419478ccb58b2683ecd6e250f96973cf9edc771e57189f85173047f4adc6024
                    index: 4
                  - tx_id: b6024f22e8ed126d5187a43c57f8bf8238b090129c98253adba05d8859d308dd
                    index: 4
                  - tx_id: 5a50bbb90725b3e7697b78b33301d79bc3c1353ff1e2020e14faf0132ddc2913
                    index: 1
                  to:
                  - destination: tb1qc4sd2dtjrpta4h4euxtv73wtetupt5gclqpuep
                    value: 2000
      responses:
        '200':
          description: An unsigned transaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTxCreateResponse'
              example:
                id: '0x0a878b702b7a1c3714ad696a0a173b2ce7248d8be65274f736d8a2afbefdb552'
                unsigned_tx: 02f86f0180838dafc985243504640582b59b94dac17f958d2ee523a2206206994597c13d831ec780b844a9059cbb000000000000000000000000ecbedcf205b361eb671de51d20657ff55b3389d00000000000000000000000000000000000000000000000000000000001287a70c0808080
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests'
        '500':
          $ref: '#/components/responses/ErrorInternal'
        '501':
          $ref: '#/components/responses/ErrorNotImplemented'
        '503':
          $ref: '#/components/responses/ErrorServiceUnavailable'
  /{blockchain_id}/create/token:
    parameters:
    - $ref: '#/components/parameters/blockchain_id'
    post:
      summary: Create an Unsigned Token Transfer Transaction
      description: 'Creates an unsigned token transfer transaction.

        '
      operationId: TxCreateToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiTxCreateTokenRequest'
            example:
              contract_address: '0xdAC17F958D2ee523a2206206994597C13D831ec7'
              data:
                from: '0x1440ec793aE50fA046B95bFeCa5aF475b6003f9e'
                to: '0xecbEdcF205B361Eb671dE51d20657ff55b3389D0'
                value: 1943000000
      responses:
        '200':
          description: An unsigned transaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTxCreateResponse'
              example:
                id: '0x0a878b702b7a1c3714ad696a0a173b2ce7248d8be65274f736d8a2afbefdb552'
                unsigned_tx: 02f86f0180838dafc985243504640582b59b94dac17f958d2ee523a2206206994597c13d831ec780b844a9059cbb000000000000000000000000ecbedcf205b361eb671de51d20657ff55b3389d00000000000000000000000000000000000000000000000000000000001287a70c0808080
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              example:
                type: bad-request
                code: 16396
                title: Bad Request
                status: 400
                detail: The requested address is invalid on this protocol
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests'
        '500':
          $ref: '#/components/responses/ErrorInternal'
        '501':
          $ref: '#/components/responses/ErrorNotImplemented'
        '503':
          $ref: '#/components/responses/ErrorServiceUnavailable'
  /{blockchain_id}/decode:
    parameters:
    - $ref: '#/components/parameters/blockchain_id'
    post:
      summary: Decode a transaction
      description: Returns the raw json of the decoded transaction
      operationId: TxDecode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiTxDecodeRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTxDecodeResponse'
              examples:
                btc_decoded_unsigned:
                  summary: Result of decoding raw unsigned Bitcoin transaction
                  value:
                    from:
                    - index: 1
                      script_sig_hex: ''
                      tx_id: effd7af88861ccb25714216ba78561a8bf2e93ebe45b2deac37da8f284591b0e
                      value: 1000
                      address: bc1pndths0lnsvem2a0n2c6t49u462xam0n4krjl6kpfwn0nknc0cd7qmnxhf8
                    to:
                    - value: 400
                      destination: tb1pndths0lnsvem2a0n2c6t49u462xam0n4krjl6kpfwn0nknc0cd7qvmscng
                      script_pub_key:
                        hex: 51209b57783ff38333b575f35634ba9795d28dddbe75b0e5fd582974df3b4f0fc37c
                        type: witness_v1_taproot
                    - value: 400
                      destination: tb1p67w73lj44z2m3x8l4ftu3ukcygjm3qyl6esjqcrpf6wn5m35gmnsac5d3j
                      script_pub_key:
                        hex: 5120d79de8fe55a895b898ffaa57c8f2d82225b8809fd6612060614e9d3a6e3446e7
                        type: witness_v1_taproot
                btc_decoded_signed:
                  summary: Result of decoding raw signed Bitcoin transaction
                  value:
                    from:
                    - index: 1
                      script_sig_hex: 47304402204be99e5a1c70b460e4ee42b21519d20806610895d3c9e602c0743d14a0e1607202204520e9b0b468dc6096ebfedc9d73e9ce64b6480ce0c779d62d9fe401386dd80f012103786af4b32017ec640dba2d2a7e1fd5aa4a231a658e4cbc114d51c031576e19bc
                      tx_id: 0db756f7b889a5bfa6f2af44f267b60f989c712e49a882ac5768df92e9244687
