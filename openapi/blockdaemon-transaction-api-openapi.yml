  /{blockchain_id}/derive_signing_payload:
    parameters:
    - $ref: '#/components/parameters/blockchain_id'
    post:
      summary: Derive signing payload from unsigned transaction
      description: 'Create a signing payload.

        '
      operationId: TxDeriveSigningPayload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiTxDeriveSigningPayloadRequest'
      responses:
        '200':
          description: A signing payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTxDeriveSigningPayloadResponse'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests'
        '500':
          $ref: '#/components/responses/ErrorInternal'
        '501':
          $ref: '#/components/responses/ErrorNotImplemented'
        '503':
          $ref: '#/components/responses/ErrorServiceUnavailable'
  /{blockchain_id}/estimate_fee:
    parameters:
    - $ref: '#/components/parameters/blockchain_id'
    post:
      summary: Get the Fee Estimation
      description: Returns the estimated fee for a given chain.
      operationId: TxEstimateFee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiTxEstimateFeeRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTxEstimateFeeResponse'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests'
        '500':
          $ref: '#/components/responses/ErrorInternal'
        '501':
          $ref: '#/components/responses/ErrorNotImplemented'
        '503':
          $ref: '#/components/responses/ErrorServiceUnavailable'
  /{blockchain_id}/send:
    parameters:
    - $ref: '#/components/parameters/blockchain_id'
    post:
      summary: Submit a Signed Transaction
      description: 'Submit a signed transaction to the network.


        **Note**: A successful transaction may still be rejected on chain or not processed due to a too low fee.

        '
      operationId: TxSend
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiTxSigned'
      responses:
        '200':
          description: A submitted Transaction ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTxSendResponse'
              example:
                id: 9c8ac345b443dd10a418ea0beaa320ef233dbae5590be2a11ac090e0e9839c1c
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests'
        '500':
          $ref: '#/components/responses/ErrorInternal'
        '501':
          $ref: '#/components/responses/ErrorNotImplemented'
        '503':
          $ref: '#/components/responses/ErrorServiceUnavailable'
  /{blockchain_id}/verify:
    parameters:
    - $ref: '#/components/parameters/blockchain_id'
    post:
      summary: Verify a Transaction
      description: Verifies whether a signed/unsigned transaction matches the expected input parameters.
      operationId: TxVerify
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiTxVerifyRequest'
            examples:
              btc_with_errors:
                summary: Bitcoin mainnet intent verification with errors
                value:
                  raw_encoded_tx: 
                  tx:
                    from:
                    - index: 1
                      tx_id: 0db756f7b889a5bfa6f2af44f267b60f989c712e49a882ac5768df92e9244687
                    to:
                    - value: 527560000
                      destination: bc1qgcgc5f0f5fth60ycqh6ufdehdds39cc3rajs5j
      responses:
        '200':
          description: Request successful
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                generic:
                  value:
                    type: bad-request
                    code: 16396
                    title: Bad Request
                    status: 400
                    detail: the provided input does not match the transaction
                btc_with_errors:
                  summary: Bitcoin mainnet intent verification with errors
                  value:
                    type: bad-request
                    code: 16388
                    title: Bad Request
                    status: 400
                    detail: tx hash '4a5fd6d85ccb73bc7e5dd429b4c6a6cc13e472408fc264466f38a6d660057884' input at index 0 does not match expected hash '0db756f7b889a5bfa6f2af44f267b60f989c712e49a882ac5768df92e9244687'; tx output index 12 of input at index 0 does not match expected index 1; address 'bc1qskxv4jnvfeyz7c5lm0x92w0xjhvxw04zpzg6gn' of tx output at index 0 does not match expected address 'bc1qgcgc5f0f5fth60ycqh6ufdehdds39cc3rajs5j'; amount of 294 sats of tx output at index 0 does not match expected amount of 527560000 sats
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
        '429':
          $ref: '#/components/responses/ErrorTooManyRequests'
        '500':
          $ref: '#/components/responses/ErrorInternal'
        '501':
          $ref: '#/components/responses/ErrorNotImplemented'
        '503':
          $ref: '#/components/responses/ErrorServiceUnavailable'
components:
  securitySchemes:
    apiKeyAuthHeader:
      type: apiKey
      in: header
      name: X-API-Key
      description: 'Unlock higher TPS - Create your own API key in the [Blockdaemon App](https://app.blockdaemon.com).

        '
      x-default: 2go1YqUcuAr4WZ2-3WgSD3c7qpatZqQuNWhTVBldKZnTSUtw
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Opaque
      description: '[Legacy Auth] Unlock higher TPS - Create your own API key in the [Blockdaemon App](https://app.blockdaemon.com).

