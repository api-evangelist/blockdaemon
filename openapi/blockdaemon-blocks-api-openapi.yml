  /{protocol}/{network}/block_identifier/{block_identifier}:
    get:
      summary: Get a Block Identifier by Number of Hash
      description: 'Get the minimal block data, block header, by a user-defined block number or block hash.


        Use `-1` or `current` parameter to return the current block.'
      operationId: GetBlockIdentifierByNumber
      tags:
      - Blocks
      parameters:
      - $ref: '#/components/parameters/protocol'
      - $ref: '#/components/parameters/network'
      - $ref: '#/components/parameters/block_identifier'
      responses:
        '200':
          description: Block
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/block_identifier'
              example:
                number: 700000
                id: 0000000000000000000590fc0f3eba193a278534220b2b37e9849e1a770ca959
                parent_id: 0000000000000000000aa3ce000eb559f4143be419108134e0ce71042fc636eb
                date: 1631333672
                num_txs: 1276
        '400':
          description: Invalid Block hash
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-internal: false
  /{protocol}/{network}/block_identifiers:
    get:
      summary: Get a List of Block Identifiers
      description: Returns a list of minimal block data, block headers such as block hash and block number.
      operationId: GetBlockIdentifiers
      tags:
      - Blocks
      parameters:
      - in: path
        name: protocol
        required: true
        description: 'Protocol handle, one of: `avalanche`, `bitcoin`, `bitcoincash`, `dogecoin`, `ethereum`,`litecoin`, `optimism`, `polkadot`, `polygon`, `tezos`.

          '
        schema:
          type: string
          default: bitcoin
        examples:
          Bitcoin:
            value: bitcoin
      - $ref: '#/components/parameters/network'
      - $ref: '#/components/parameters/order'
      - $ref: '#/components/parameters/page_token'
      - $ref: '#/components/parameters/page_size'
      responses:
        '200':
          description: Block headers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/block_identifiers'
              example:
                total: 4
