  /{protocol}/{network}/sync/block_id:
    get:
      summary: Get the Current Block Hash
      description: Get the current block id (hash) of the protocol.
      operationId: GetCurrentBlockHash
      tags:
      - Blocks
      parameters:
      - $ref: '#/components/parameters/protocol'
      - $ref: '#/components/parameters/network'
      responses:
        '200':
          description: Current block hash
          content:
            application/json:
              schema:
                type: string
                description: The current block hash.
              example: 3ea7cfb439e0baa4d91525b66b1f7b4e79ac0302a054a83d12f4e2ee7c933c8f
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-internal: false
  /{protocol}/{network}/sync/block_number:
    get:
      summary: Get the Current Block Number
      description: Returns the current block number/height of the protocol.
      operationId: GetCurrentBlockNumber
      tags:
      - Blocks
      parameters:
      - $ref: '#/components/parameters/protocol'
      - $ref: '#/components/parameters/network'
      responses:
        '200':
          description: Current block number
          content:
            application/json:
              schema:
                format: int64
                description: The current block number.
                type: integer
              example: 801212
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-internal: false
  /{protocol}/{network}/tx/{hash}/confirmations:
    get:
      summary: Get the Transaction Confirmations
      description: Returns the number of transaction confirmations by a user-defined transaction hash.
      operationId: GetTxConfirmations
      tags:
      - Blocks
      parameters:
      - in: path
        name: protocol
        required: true
        description: 'Protocol handle, one of: `algorand`, `avalanche`, `bitcoin`, `bitcoincash`, `dogecoin`, `ethereum`, `litecoin`, `optimism`, `polkadot`, `polygon`, `stellar`, `tezos`.

          '
