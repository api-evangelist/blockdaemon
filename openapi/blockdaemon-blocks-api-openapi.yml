components:
  schemas:
    block:
      type: object
      description: The block object.
      properties:
        number:
          type: integer
          format: int64
          description: The block number.
          example: 8000000
        id:
          type: string
          description: The block hash.
          example: '0x123456070D674D44a7F9cb4Ab272bd88fAd004b5'
        parent_id:
          type: string
          description: The parent block hash.
          example: '0xfcf029ffd36a6714aae09dcc7acbdd8f2b96327f'
        date:
          type: integer
          format: int64
          description: The block date in unix timestamp format.
          example: 1571222657
        num_txs:
          type: integer
          description: The amount of transaction in the block.
          example: 10
        txs:
          type: array
          description: A list of normalized transactions presented in the block (not filtered or unknown model).
          items:
            $ref: '#/components/schemas/tx'
    event:
      type: object
      properties:
        id:
          type: string
          description: The event identifier.
        transaction_id:
          type: string
          description: The transaction identifer this event is presented.
        type:
          type: string
          description: The event type.
          example: transfer
        denomination:
          type:
          - string
          - 'null'
          description: The Symbol of currency, can be natibe currency or token currency.
        destination:
          type:
          - string
          - 'null'
          example: 1A1zP1eP5QGefi2DMPTfTL5SLmv7DivfNa
          description: The destination address of the event.
        source:
          type:
          - string
          - 'null'
          description: The source address of the event.
        meta:
          type: object
          description: Protocol specific data that doesn't fit into a standard model.
          properties:
            addresses:
              description: A list of addresses.
              type: array
              items:
                type: string
            index:
              description: The index number.
              type: integer
            script:
              description: The script.
              type: string
            script_type:
              description: The script type.
              type: string
        date:
          type: integer
          format: int64
          description: The event date in unix timestamp format.
        amount:
          type:
          - integer
          - 'null'
          format: bigint
          example: 5000000000
          description: The coin amount transfered in the event.
        decimals:
          type:
          - integer
          - 'null'
          description: The coin amount transfered in the event.
    tx_page:
      type: object
      properties:
        total:
          type: integer
          description: The number of items in txs.
          example: 1
        data:
          type: array
          items:
            $ref: '#/components/schemas/tx'
        meta:
          $ref: '#/components/schemas/meta'
    tx_confirmation:
      type: object
      properties:
        current_height:
          type: integer
          format: int64
          description: The current block height.
          example: 150123
        tx_id:
          type: string
          description: The transaction hash.
          example: '0x123456070D674D44a7F9cb4Ab272bd88fAd004b5'
        confirmations:
          type: integer
          format: int64
          description: The total transaction confirmations.
          example: 10
    error:
      type: object
      properties:
        type:
          type: string
          description: The HTTP error type.
          example: bad-request
        code:
          type: integer
          description: The numeric error code.
          example: 16384
        title:
          type: string
          description: The short error description.
          example: Invalid Address
        status:
          type: integer
          description: The HTTP status of the error.
          example: 400
        detail:
          type: string
          description: Long error description
          example: The requested address is invalid on this protocol.
    tx:
      type: object
      properties:
        id:
          type: string
          description: Unique transaction identifier.
          example: '0xF00Fa860473130C1df10707223E66Cb4B839B165'
        block_id:
          type:
          - string
          - 'null'
          description: Block hash if mined, otherwise omitted.
          example: '0xaf2948aba2ed8cc7d5b7d4e4f4164a7c8819efc94d30aab3fce6904df68dbc07'
        date:
          type: integer
          format: int64
          description: The transaction creation unix timestamp.
          example: 1571222657
        status:
          type: string
          description: Result status of the transaction.
          enum:
          - completed
          - failed
        num_events:
          type: integer
          description: List of transaction events.
        meta:
          type: object
          description: Protocol specific data that doesn't fit into a standard model.
        block_number:
          type:
          - integer
          - 'null'
          description: Block number if mined, otherwise omitted.
          example: 789387
        confirmations:
          type: integer
          description: Total transaction confirmations.
        events:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/event'
        assets:
          type:
          - array
          - 'null'
          description: List of moved assets by asset path. Find all the asset paths on this [page](https://docs.blockdaemon.com/reference/available-currencies-and-tokens).
          uniqueItems: true
          items:
            type: string
            example: ethereum/native/eth
        nonce:
          type: integer
          description: The nonce of the transaction.
    paging:
      type: object
      description: The pagination details.
      properties:
        next_page_token:
          type: string
          description: The next page token to use in the following request.
    block_identifiers:
      type: object
      properties:
        total:
          type: integer
          description: The number of items in block identifiers.
          example: 25
        data:
          type: array
          items:
            $ref: '#/components/schemas/block_identifier'
        meta:
          $ref: '#/components/schemas/meta'
    block_identifier:
      type: object
      properties:
        number:
          type: integer
          format: int64
          description: The block number.
          example: 8000000
        id:
          type: string
          description: The block hash.
          example: '0x123456070D674D44a7F9cb4Ab272bd88fAd004b5'
        parent_id:
          type: string
          description: The parent block hash.
          example: '0xfcf029ffd36a6714aae09dcc7acbdd8f2b96327f'
        date:
          type: integer
          format: int64
          description: The block date in Unix timestamp format.
          example: 1571222657
        num_txs:
          type: integer
          description: The amount of transaction in the block.
          example: 10
    meta:
      type:
      - object
      - 'null'
      description: The meta details.
      properties:
        paging:
          $ref: '#/components/schemas/paging'
  parameters:
    protocol:
      in: path
      name: protocol
      required: true
      description: "Protocol handle, one of: \n`algorand`, `avalanche`, `bitcoin`, `bitcoincash`, `dogecoin`, `ethereum`, `litecoin`, `near`, `optimism`, `polkadot`, `polygon`, `solana`, `stellar`, `tezos`, `xrp`.\n"
      schema:
        type: string
        default: bitcoin
      examples:
        Bitcoin:
          value: bitcoin
    order:
      name: order
      in: query
      description: The pagination order.
      schema:
        type: string
        enum:
        - desc
        - asc
        default: desc
    page_size:
      name: page_size
      in: query
      required: false
      description: 'Max number of items to return in a response.

        Defaults to 25 and is capped at 100.

        '
      schema:
        type: integer
      example: 25
    block_identifier:
      name: block_identifier
      in: path
      required: true
      description: The block identifier, hash or number.
      schema:
        type: string
        default: 0000000000000000000590fc0f3eba193a278534220b2b37e9849e1a770ca959
      examples:
        Block_hash:
          value: 0000000000000000000590fc0f3eba193a278534220b2b37e9849e1a770ca959
        Block_number:
          value: '100000'
    block_number:
      name: block_number
      in: query
      schema:
        type: integer
      description: Filter by block number.
      example: 789387
    block_hash:
      name: block_hash
      in: query
      description: Filter by block hash. You can specify only one block hash at a time.
      schema:
        type: string
      example: '0x2444165297806ad5598e4569e5823b3df0cde3e48b346781ab632fa6cef1a0ec'
    tx-hash:
      name: hash
      in: path
      required: true
      description: The transaction hash.
      schema:
        type: string
        default: 71d4f3412ec11128bbd9ce988d5bff2ec3bb6ea3953c8faf189d88ae49de9f7a
      examples:
        BTC_tx_hash:
          value: 71d4f3412ec11128bbd9ce988d5bff2ec3bb6ea3953c8faf189d88ae49de9f7a
        ETH_tx_hash:
          value: '0x6d550b76008d75d25a735d2d96c640cc13b7a711372557955fbd3b1cad8a78cb'
    assets:
      name: assets
      in: query
      required: false
      description: "Comma-separated list of asset paths to filter. If the list is empty or all elements are empty, this filter has no effect. Filtering by asset is applicable only for:\n  - **Balances endpoints:** `algorand`, `avalanche`, `bitcoincash`, `ethereum`, `litecoin`, `optimism`, `polygon`, `polkadot`, `solana`\n  - **Transactions endpoints:** `algorand`, `avalanche`, `ethereum`\n\nFind all the asset paths on this [page](https://docs.blockdaemon.com/reference/available-currencies-and-tokens).\n"
      schema:
        type: string
      allowReserved: true
      examples:
        ETH_native_currency:
          value: ethereum/native/eth
        ETH_smart_token:
          value: ethereum/contract/0x0f5d2fb29fb7d3cfee444a200298f468908cc942/erc-20
        More_than_one_asset:
          value: ethereum/native/eth,ethereum/contract/0x0f5d2fb29fb7d3cfee444a200298f468908cc942/erc-20
    network:
      name: network
      in: path
      required: true
      description: Which network to target. Available networks can be found in the list of supported protocols or with /{protocol}.
      schema:
        type: string
        default: mainnet
