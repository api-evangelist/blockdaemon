tags:
- name: synthetic
paths:
  /defi/v1/synthetic/depositpeggedtoken:
    post:
      tags:
      - synthetic
      summary: Deposit Pegged Token
      description: 'Enables users to deposit synthetic pegged tokens into the Synthetix protocol with customizable gas settings and transaction parameters. Upon a successful transaction, the endpoint returns key details including the chain ID, sender and recipient addresses, gas used, and the raw transaction data, ensuring a secure and efficient deposit process.


        > 💡

        **Compute Unit Value:** `130` (Fixed)'
      operationId: syntheticDepositpeggedtoken
      requestBody:
        required: true
        description: The request body for a /defi/v1/synthetic/depositpeggedtoken
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/_synthetic_depositpeggedtoken_Request'
            example:
              syntheticId: '6000'
              amount: '1000000000000000000'
              from: '0xdAe2F6EdDdA6fb4fb60cc02633DE27e2b431B402'
              gas: '100000'
              gasPriority: low
              enableFee: false
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: object
                example:
                  status: 200
                  msg: success
                  data:
                    chainId: '1'
                    from: '0x63056E00436Da25BcF48A40dfBbDcc7089351006'
                    value: '0'
                    gas: '300000'
                    data: '0xdc8fa6c2000000000000000000000000000000000000000000000000016345785d8a0000'
                    to: '0xE1f64079aDa6Ef07b03982Ca34f1dD7152AA3b86'
      x-bd-cu: '130'
      x-bd-cu-type: fixed
      x-internal: false
  /defi/v1/synthetic/getprice:
    get:
      tags:
      - synthetic
      summary: Get Price
      description: 'Calculates the exchange rate between synthetic (pegged) tokens and protocol tokens. It accepts a specified synthetic token amount and returns the equivalent number of protocol tokens based on current market conditions, providing accurate and reliable pricing data for Synthetix operations.


        > 💡

        **Compute Unit Value:** `40` (Fixed)'
      operationId: syntheticGetprice
      parameters:
      - name: syntheticId
        in: query
        required: false
        schema:
          type: string
          description: The unique ID to specify the synthetic protocol for queries or transactions.
          enum:
          - '6000'
          example: '6000'
        description: The unique ID to specify the synthetic protocol for queries or transactions.
      - name: amount
        in: query
        required: true
        schema:
          type: string
          description: 'Amount of Synth tokens, specified in the token''s smallest denomination (18 decimal wei). Do not send human-readable decimal values. Example: 1 sUSD = "1000000000000000000".'
          example: '1000000000000000000'
        description: 'Amount of Synth tokens, specified in the token''s smallest denomination (18 decimal wei). Do not send human-readable decimal values. Example: 1 sUSD = "1000000000000000000".'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: object
                example:
                  status: 200
                  msg: success
                  data:
                    peggedToProtocolToken: '22177'
      x-bd-cu: '40'
      x-bd-cu-type: fixed
      x-internal: false
  /defi/v1/synthetic/withdrawpeggedtoken:
    post:
      tags:
      - synthetic
      summary: Withdraw Pegged Token
      description: 'Processes the withdrawal of synthetic tokens from the Synthetix protocol. It executes a transaction that includes configurable gas priorities and built-in security validations, ensuring that synthetic token withdrawals are handled securely and efficiently on the blockchain.


        > 💡

        **Compute Unit Value:** `100` (Fixed)'
      operationId: syntheticWithdrawpeggedtoken
      requestBody:
        required: true
        description: The request body for a /defi/v1/synthetic/withdrawpeggedtoken
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/_synthetic_withdrawpeggedtoken_Request'
            example:
              syntheticId: '6000'
              from: '0xdAe2F6EdDdA6fb4fb60cc02633DE27e2b431B402'
              gas: '100000'
              gasPriority: low
              enableFee: false
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: object
                example:
                  status: 200
                  msg: success
                  data:
                    chainId: '1'
                    from: '0x63056E00436Da25BcF48A40dfBbDcc7089351006'
                    value: '0'
                    gas: '300000'
                    data: '0x81b797dc'
                    to: '0xE1f64079aDa6Ef07b03982Ca34f1dD7152AA3b86'
      x-bd-cu: '100'
      x-bd-cu-type: fixed
      x-internal: false
components:
  schemas:
    _synthetic_withdrawpeggedtoken_Request:
      type: object
      properties:
        syntheticId:
          type: string
          description: The unique ID to specify the synthetic protocol for queries or transactions.
          enum:
          - '6000'
          example: '6000'
        from:
          type: string
          description: Blockchain address of the sender. For EVM chains, use a checksummed hex address (e.g., 0xABCDEF...). This address must hold sufficient balance and will sign the transaction.
          example: '0xdAe2F6EdDdA6fb4fb60cc02633DE27e2b431B402'
        gas:
          type: string
          description: 'Maximum number of gas units to allocate for the transaction, as an integer string (e.g., ''200000''). If omitted, gas is estimated automatically. Note: this is gas units, not wei or gwei.'
          example: '100000'
        gasPriority:
          type: string
          description: Specifies the priority level for gas fees (e.g., 'low', 'medium', or 'high'), which influences the transaction speed and cost.
          example: low
        enableFee:
          type: boolean
          description: Flag to include a basis points fee transaction alongside the main transaction when set to true.
          example: false
      required:
      - from
      description: The request body for a /defi/v1/synthetic/withdrawpeggedtoken
      example:
        syntheticId: '6000'
        from: '0xdAe2F6EdDdA6fb4fb60cc02633DE27e2b431B402'
        gas: '100000'
        gasPriority: low
        enableFee: false
