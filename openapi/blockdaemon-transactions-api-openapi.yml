  /{protocol}/{network}/tx/{hash}:
    get:
      summary: Get a Transaction
      description: Returns a transaction by a user-defined transaction hash.
      operationId: GetTxByHash
      tags:
      - Transactions
      parameters:
      - in: path
        name: protocol
        required: true
        description: 'Protocol handle, one of: `algorand`, `avalanche`, `bitcoin`, `bitcoincash`, `dogecoin`, `ethereum`, `litecoin`, `optimism`, `polkadot`, `polygon`, `solana`, `stellar` `tezos`, `xrp`.

          '
        schema:
          type: string
          default: bitcoin
        examples:
          Bitcoin:
            value: bitcoin
      - $ref: '#/components/parameters/network'
      - $ref: '#/components/parameters/tx-hash'
      responses:
        '200':
          description: Transaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tx'
              example:
                id: 71d4f3412ec11128bbd9ce988d5bff2ec3bb6ea3953c8faf189d88ae49de9f7a
