openapi: 3.2.0
info:
  version: 3.0.0
  title: Blockdaemon REST Transactions API
  description: 'Blockdaemon REST API provides a RESTful and uniform way to access blockchain resources,

    with a rich and reusable model across multiple protocols/cryptocurrencies.'
  contact:
    name: Blockdaemon
    email: support@blockdaemon.com
    url: https://blockdaemon.com
  x-logo:
    url: https://storage.googleapis.com/blockdaemon-app-static-images/marketing/PNG/dark-logo.png
    altText: Blockdaemon logo
servers:
- url: https://svc.blockdaemon.com/universal/{version}
  description: Production server
  variables:
    version:
      enum:
      - v1
      default: v1
- url: https://ubiquity.api.blockdaemon.com/{version}
  description: '[Legacy Auth] Production server'
  variables:
    version:
      enum:
      - v1
      default: v1
security:
- apiKeyAuthHeader: []
- bearerAuth: []
tags:
- name: Transactions
paths:
  /{protocol}/{network}/account/{address}/txs:
    get:
      summary: Get a List of Transactions for a Given Address
      description: Returns the transactions that an address was involved with, from newest to oldest.
      operationId: GetTxsByAddress
      tags:
      - Transactions
      parameters:
      - in: path
        name: protocol
        required: true
        description: 'The protocol handle, one of: `algorand`, `avalanche`, `bitcoin`, `bitcoincash`, `dogecoin`, `ethereum`, `litecoin`, `optimism`, `polkadot`, `polygon`, `solana`, `tezos`, `stellar`, `xrp`.

          '
        schema:
          type: string
          default: bitcoin
        examples:
          Bitcoin:
            value: bitcoin
      - $ref: '#/components/parameters/network'
      - $ref: '#/components/parameters/address'
      - $ref: '#/components/parameters/assets'
      - name: from
        in: query
        required: false
        description: Unix Timestamp from where to start. The date range is exclusive (results include transactions starting 1 second after this timestamp).
        schema:
          type: integer
        example: 961846434
      - name: to
        in: query
        required: false
        description: Unix Timestamp from where to end. The date range is exclusive (results include transactions up to 1 second before this timestamp).
        schema:
          type: integer
        example: 1119612834
      - $ref: '#/components/parameters/order'
      - $ref: '#/components/parameters/page_token'
      - $ref: '#/components/parameters/page_size'
      responses:
        '200':
          description: Transactions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tx_page'
              example:
                total: 25
                data:
