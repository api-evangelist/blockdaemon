  /{protocol}/{network}/tx/{hash}/{index}:
    get:
      summary: Get a Transaction Output by Hash and Index
      description: Get a transaction output by a user-defined transaction hash and the transaction output index.
      operationId: GetTxOutputByHashAndIndex
      tags:
      - Transactions
      parameters:
      - in: path
        name: protocol
        required: true
        description: 'Protocol handle, one of: `bitcoin`, `bitcoincash`, `dogecoin`, `litecoin`.

          '
        schema:
          type: string
          default: bitcoin
        examples:
          Bitcoin:
            value: bitcoin
      - $ref: '#/components/parameters/network'
      - $ref: '#/components/parameters/tx-hash'
      - name: index
        in: path
        required: true
        description: The transaction output index.
        schema:
          type: integer
          default: 0
        example: 0
      responses:
        '200':
          description: Transaction output.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tx_output'
              example:
                status: mined
                is_spent: true
                spent:
                  tx_id: 18e3fac4bd7ba82660c3cc7b892a464de873e93396f0e447958b0f5320d2b322
                  date: 1667989493
                  block_id: 000000000000000000056843bef110e6b82b36211681ed733f8dd454be374829
                  block_number: 762402
                  confirmations: 1
                value: 81031
                mined:
                  index: 1
                  tx_id: 71d4f3412ec11128bbd9ce988d5bff2ec3bb6ea3953c8faf189d88ae49de9f7a
                  date: 1667882555
                  block_id: 000000000000000000031911bca2ecf6c19ede467d81659f0c43a420ede1fd21
                  block_number: 762213
                  confirmations: 1
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  parameters:
    order:
      name: order
      in: query
      description: The pagination order.
      schema:
        type: string
        enum:
        - desc
        - asc
        default: desc
    page_size:
      name: page_size
      in: query
      required: false
      description: 'Max number of items to return in a response.

        Defaults to 25 and is capped at 100.

        '
      schema:
        type: integer
      example: 25
    tx-hash:
      name: hash
      in: path
      required: true
      description: The transaction hash.
      schema:
        type: string
        default: 71d4f3412ec11128bbd9ce988d5bff2ec3bb6ea3953c8faf189d88ae49de9f7a
      examples:
        BTC_tx_hash:
          value: 71d4f3412ec11128bbd9ce988d5bff2ec3bb6ea3953c8faf189d88ae49de9f7a
        ETH_tx_hash:
          value: '0x6d550b76008d75d25a735d2d96c640cc13b7a711372557955fbd3b1cad8a78cb'
    assets:
      name: assets
      in: query
      required: false
      description: "Comma-separated list of asset paths to filter. If the list is empty or all elements are empty, this filter has no effect. Filtering by asset is applicable only for:\n  - **Balances endpoints:** `algorand`, `avalanche`, `bitcoincash`, `ethereum`, `litecoin`, `optimism`, `polygon`, `polkadot`, `solana`\n  - **Transactions endpoints:** `algorand`, `avalanche`, `ethereum`\n\nFind all the asset paths on this [page](https://docs.blockdaemon.com/reference/available-currencies-and-tokens).\n"
      schema:
        type: string
      allowReserved: true
      examples:
        ETH_native_currency:
          value: ethereum/native/eth
        ETH_smart_token:
          value: ethereum/contract/0x0f5d2fb29fb7d3cfee444a200298f468908cc942/erc-20
        More_than_one_asset:
          value: ethereum/native/eth,ethereum/contract/0x0f5d2fb29fb7d3cfee444a200298f468908cc942/erc-20
    address:
      name: address
      in: path
      required: true
      description: The account address of the protocol.
      schema:
        type: string
        default: 1A1zP1eP5QGefi2DMPTfTL5SLmv7DivfNa
      examples:
        BTC_address:
          value: 1A1zP1eP5QGefi2DMPTfTL5SLmv7DivfNa
          description: BTC address
    network:
      name: network
      in: path
      required: true
      description: Which network to target. Available networks can be found in the list of supported protocols or with /{protocol}.
      schema:
        type: string
        default: mainnet
      examples:
        Mainnet:
          value: mainnet
        Mainnet-C:
          value: mainnet-c
        Testnet:
          value: testnet
        Testnet4:
          value: testnet4
          description: Bitcoin testnet network
        Testnet-C:
          value: testnet-c
        Holesky:
          value: holesky
          description: Ethereum testnet network
        Hoodi:
          value: hoodi
          description: Ethereum testnet network
        Sepolia:
          value: sepolia
          description: Ethereum testnet network
        Westend:
          value: westend
          description: Polkadot testnet network
        Amoy:
          value: amoy
          description: Polygon testnet network
    page_token:
      name: page_token
      in: query
      required: false
      description: The token to retrieve more items in the next request. Use the `next_page_token` returned from the previous response for this parameter.
      schema:
        type: string
      example: '8185.123'
  schemas:
    tx_minify:
      type:
      - object
      - 'null'
      description: Transaction
      properties:
        index:
          type: integer
          description: The output index within a given transaction.
          example: 1
        tx_id:
          type: string
          description: The transaction identifier.
          example: 57f7dc46786c5d56d260186d459f1246943dd6e83ca00235909dad1b826f20b4
        date:
          type: integer
          format: int64
          description: The Unix timestamp.
          example: 1571222657
        block_id:
          type:
          - string
          - 'null'
          description: The ID of block.
          example: '0xaf2948aba2ed8cc7d5b7d4e4f4164a7c8819efc94d30aab3fce6904df68dbc07'
        block_number:
          type:
          - integer
          - 'null'
          format: int64
          description: The height of block.
          example: 77477
        confirmations:
          type: integer
          format: int64
          description: Total transaction confirmations.
          example: 10
    event:
      type: object
      properties:
        id:
          type: string
          description: The event identifier.
        transaction_id:
          type: string
          description: The transaction identifer this event is presented.
        type:
          type: string
          description: The event type.
          example: transfer
        denomination:
