tags:
- name: weth
paths:
  /defi/v1/weth/getbalance:
    get:
      tags:
      - weth
      summary: Get Balance
      description: 'Retrieves the current WETH balance for a specified wallet address across multiple networks. It accepts optional parameters (RPC, chain ID, chain symbol) to target a specific network, making it ideal for portfolio tracking and wallet management.


        > 💡

        **Compute Unit Value:** `45` (Fixed)'
      operationId: wethGetbalance
      parameters:
      - name: chainId
        in: query
        required: false
        schema:
          type: string
          description: The unique ID to direct queries or transactions to the correct blockchain. Find more [here](https://docs.blockdaemon.com/docs/defi-api-supported-protocols#supported-chains).
          enum:
          - '1'
          - '11155111'
          - '56'
          - '97'
          - '43114'
          - '43113'
          - '137'
          - '80002'
          - '25'
          - '338'
          - '42161'
          - '250'
          - '4002'
          - '10'
          - '11155420'
          - '8453'
          - '84532'
          - '324'
          - '300'
          example: '1'
        description: The unique ID to direct queries or transactions to the correct blockchain. Find more [here](https://docs.blockdaemon.com/docs/defi-api-supported-protocols#supported-chains).
      - name: chainSymbol
        in: query
        required: false
        schema:
          type: string
          description: The abbreviated chain name for queries or transactions.
          example: ETH
        description: The abbreviated chain name for queries or transactions.
      - name: address
        in: query
        required: true
        schema:
          type: string
          description: The public address to get the balance of.
          example: '0xdAe2F6EdDdA6fb4fb60cc02633DE27e2b431B402'
        description: The public address to get the balance of.
      - name: vsCurrencies
        in: query
        required: false
        schema:
          type: string
          description: A comma-separated list of currency symbols to convert the amount into, such as 'USD,EUR'. This parameter is optional and allows retrieving values in multiple fiat currencies.
          example: usd,eur,gbp
        description: A comma-separated list of currency symbols to convert the amount into, such as 'USD,EUR'. This parameter is optional and allows retrieving values in multiple fiat currencies.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: object
                example:
                  status: 200
                  msg: success
                  data:
                    balance: '462462170932810524189278'
                    prices:
                      inr:
                      - '0xc02aaa39b223fe8d0a0e5c4f27ead9083c756cc2': '312980.5979501781'
                      usd:
                      - '0xc02aaa39b223fe8d0a0e5c4f27ead9083c756cc2': '3621.388291112711'
                      eur:
                      - '0xc02aaa39b223fe8d0a0e5c4f27ead9083c756cc2': '3082.250487885014'
      x-bd-cu: '45'
      x-bd-cu-type: fixed
      x-internal: false
  /defi/v1/weth/historical/logs:
    get:
      tags:
      - weth
      summary: Historical Logs
      description: 'Returns a chronological history of WETH deposit and withdrawal events within a specified block range, including contract addresses, event topics, parameters, and block metadata. Users can filter by event type, chain ID, chain symbol, and block range, enabling robust auditing and analysis of historical token activity.


        > 💡

        **Compute Unit Value:** `70` (Fixed)'
      operationId: wethHistoricalLogs
      parameters:
      - name: chainId
        in: query
        required: false
        schema:
          type: string
          description: The unique ID to direct queries or transactions to the correct blockchain. Find more [here](https://docs.blockdaemon.com/docs/defi-api-supported-protocols#supported-chains).
          enum:
          - '1'
          example: '1'
        description: The unique ID to direct queries or transactions to the correct blockchain. Find more [here](https://docs.blockdaemon.com/docs/defi-api-supported-protocols#supported-chains).
      - name: chainSymbol
        in: query
        required: false
        schema:
          type: string
          description: The abbreviated chain name for queries or transactions.
          example: ETH
        description: The abbreviated chain name for queries or transactions.
      - name: startBlock
        in: query
        required: false
        schema:
          type: string
          description: Starting block of the range. By default, latestBlock - 100.
          example: '100000'
        description: Starting block of the range. By default, latestBlock - 100.
      - name: endBlock
        in: query
        required: false
        schema:
          type: string
          description: Last block of the range. By default, it is the latestBlock.
          example: '100010'
        description: Last block of the range. By default, it is the latestBlock.
      - name: type
        in: query
        required: true
        schema:
          type: string
          description: 'Type of WETH event: Deposit or Withdrawal.'
          enum:
          - Approval
          - Transfer
          example: Approval
        description: 'Type of WETH event: Deposit or Withdrawal.'
      - name: page
        in: query
        required: false
        schema:
          type: string
          description: The page number to fetch. By default, 1.
          example: '1'
        description: The page number to fetch. By default, 1.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: object
                example:
                  status: 200
                  msg: success
                  data:
                    logs:
                    - address: '0xc02aaa39b223fe8d0a0e5c4f27ead9083c756cc2'
                      topics:
                      - '0xe1fffcc4923d04b559f4d29a8bfc6cda04eb5b0d3c460751c2402c5c5cc9109c'
                      - '0x0000000000000000000000007a250d5630b4cf539739df2c5dacb4c659f2488d'
                      params:
                        dst: '0x7a250d5630b4cf539739df2c5dacb4c659f2488d'
                        wad: '100000000000000000'
                      data: '0x000000000000000000000000000000000000000000000000016345785d8a0000'
                      blockNumber: '17320569'
                      blockHash: '0xcbc13d3439e115dcb6203a45d82da137b7f546286224f29248192a7e428e29d6'
                      timeStamp: '1684828271'
                      gasPrice: '101893509354'
                      gasUsed: '142805'
                      logIndex: '0'
                      transactionHash: '0xa36d80f70960af4a7f67145670e589795edd3fda2c3334eb7c6fce962f06d99e'
                      transactionIndex: '4'
      x-bd-cu: '70'
      x-bd-cu-type: fixed
      x-internal: false
