openapi: 3.2.0
info:
  version: 1.0.0
  title: Staking Polygon API
  description: 'The Blockdaemon Staking API simplifies and streamlines institutional cryptocurrency staking. The API allows developers to interact with blockchain networks and perform various staking-related operations, such as delegating and undelegating tokens, in a single, unified interface.


    With the Staking API, you can quickly and easily build and deploy applications that automate staking activities and increase efficiency in your blockchain operations.'
  contact:
    name: Blockdaemon
    email: info@blockdaemon.com
    url: https://blockdaemon.com
  x-logo:
    url: https://assets-global.website-files.com/633c5e06513fa35f3391a5f9/645d33beb6fa65f6cfb95eb8_BD%20Logo%20Stack%20-%20Purple.svg
    backgroundColor: '#fafafa'
    altText: Blockdaemon logo
servers:
- url: https://svc.blockdaemon.com/boss
security:
- ApiKeyAuth: []
tags:
- name: Polygon
  description: Polygon endpoints
paths:
  /v1/polygon/{network}/bootstrapping-intents:
    parameters:
    - $ref: '#/components/parameters/PolygonNetwork'
    post:
      summary: Post Bootstrapping Intent
      operationId: postPolygonBootstrappingIntent
      tags:
      - Polygon
      description: 'Creates a new account bootstrapping intent transaction.


        Returns an unsigned transaction that sets up the user’s wallet for delegation. It is required to sign and send this transaction only once, the very first time the user is going to delegate. If this step is not completed, any subsequent delegation transactions will fail.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewBootstrappingIntentPolygon'
      responses:
        '200':
          $ref: '#/components/responses/BootstrappingIntent'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - ApiKeyAuth: []
  /v1/polygon/{network}/deactivation-intents:
    parameters:
    - $ref: '#/components/parameters/PolygonNetwork'
    post:
      summary: Post Deactivation Intent
      operationId: postPolygonDeactivationIntent
      tags:
      - Polygon
      description: 'Creates a new unbond intent that opts out of the delegation program.

        The user is getting back both their stake and the earned reward. The reward is sent immediately, but the stake gets locked for the so-called “unbonding period” of 2–3 days (or 80 Polygon checkpoints). Once the period is over, the user should call GET Deactivation Intents and POST Withdrawal Intent to actually get their stake back.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewDeactivateIntentPolygon'
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolygonDeactivationIntentResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - ApiKeyAuth: []
    get:
      parameters:
      - $ref: '#/components/parameters/WalletAddress'
      summary: Lists Deactivation Intents
      operationId: getPolygonDeactivationIntents
      tags:
      - Polygon
      description: 'Returns deactivation requests (only unclaimed stakes) for a **given wallet address**.


        Deactivation requests are stored in the blockchain and provide the user with an unbond nonce for each. Nonces are used to unstake (withdraw) your tokens with Post Withdrawal Intent.'
      responses:
        '200':
          description: Deactivation intents listed
          content:
            application/json:
              schema:
                type: object
                description: Deactivation intents
                required:
                - protocol
                - network
                - customer_id
                properties:
                  protocol:
                    $ref: '#/components/schemas/PolygonProtocol'
                  network:
                    $ref: '#/components/schemas/PolygonNetwork'
                  polygon:
                    $ref: '#/components/schemas/DeactivationIntentsPolygon'
                  customer_id:
                    $ref: '#/components/schemas/CustomerId'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - ApiKeyAuth: []
    put:
      summary: Cancel Deactivation Intent
      operationId: cancelPolygonDeactivationIntent
      tags:
      - Polygon
      description: Cancels a previously issued deactivation intent by specifying its ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelIntent'
      responses:
        '200':
          $ref: '#/components/responses/Cancelled'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - ApiKeyAuth: []
  /v1/polygon/{network}/rewards/restake-intents:
    parameters:
    - $ref: '#/components/parameters/PolygonNetwork'
    post:
      summary: Post Rewards Restake Intent
      operationId: postPolygonRewardsRestakeIntent
      tags:
      - Polygon
      description: Creates a new restake intent that restakes token rewards to the validator and increases the delegation stake.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewRewardsRestakeIntentPolygon'
      responses:
        '200':
          $ref: '#/components/responses/RewardsRestakeIntent'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - ApiKeyAuth: []
  /v1/polygon/{network}/rewards/withdrawal-intents:
    parameters:
    - $ref: '#/components/parameters/PolygonNetwork'
    post:
      summary: Post Rewards Withdrawal Intent
      operationId: postPolygonRewardsWithdrawalIntent
      tags:
      - Polygon
      description: Creates a new withdrawal intent that withdraws only the accumulated rewards. Staked tokens stay untouched and keep earning rewards.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              x-go-type: interface{}
              oneOf:
              - $ref: '#/components/schemas/NewRewardsWithdrawIntentPolygon'
      responses:
        '200':
          $ref: '#/components/responses/RewardsWithdrawIntentPolygon'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - ApiKeyAuth: []
  /v1/polygon/{network}/stake-intents:
    parameters:
    - $ref: '#/components/parameters/PolygonNetwork'
    - $ref: '#/components/parameters/IdempotencyKey'
    post:
      summary: Post Stake Intent
      operationId: postPolygonStakeIntent
      tags:
      - Polygon
      description: Returns an unsigned transaction for delegation. Before using this endpoint, the user must sign and submit the unsigned transaction returned by Post Bootstrapping Intent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewStakeIntentPolygon'
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolygonStakeIntentResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/NoValidatorsError'
      security:
      - ApiKeyAuth: []
  /v1/polygon/{network}/withdrawal-intents:
    post:
      parameters:
      - $ref: '#/components/parameters/PolygonNetwork'
      summary: Post Withdrawal Intent
      operationId: postPolygonWithdrawalIntent
      tags:
      - Polygon
      description: 'Creates a new unstake intent to fully withdraw a stake. It should be used only after the unbonding period has passed. If no unbond nonce is specified, transactions for all available unstakes will be returned.

        Nonces are returned by List Deactivation Intents.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewWithdrawIntentPolygon'
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolygonWithdrawalIntentResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - ApiKeyAuth: []
components:
  schemas:
    PolygonTokenType:
      type: string
      description: Polygon token type
      enum:
      - MATIC
      - POL
      default: POL
    BootstrappingIntentPolygon:
      type: object
      description: Polygon Bootstrapping Intent
      required:
      - to
      - unsigned_transaction
      - wallet_address
      properties:
        to:
          $ref: '#/components/schemas/EthereumAddress'
        unsigned_transaction:
          $ref: '#/components/schemas/UnsignedTransaction'
        wallet_address:
          $ref: '#/components/schemas/EthereumAddress'
    PolygonDeactivationIntentResponse:
      allOf:
      - $ref: '#/components/schemas/CommonDeactivationResponse'
      - type: object
        description: Response to a new deactivation intent request.
        required:
        - protocol
        - network
        - polygon
        properties:
          protocol:
            $ref: '#/components/schemas/PolygonProtocol'
          network:
            $ref: '#/components/schemas/PolygonNetwork'
          polygon:
            $ref: '#/components/schemas/DeactivateIntentPolygon'
    CancelIntent:
      type: object
      description: Intent id.
      required:
      - intent_id
      properties:
        intent_id:
          type: string
          format: uuid
          description: Unique idenifier for deactivate intent.
          example: 4ba06e89-8c29-483e-ac36-318de5aa7364
    Error:
      type: object
      description: Error response envelope
      required:
      - code
      - message
      properties:
        code:
          type: integer
          format: int32
          description: Error code
          example: 500
        message:
          type: string
          description: Error Message
          example: A descriptive error message
    WithdrawIntentId:
      type: string
      format: uuid
      description: Unique idenifier for a withdrawal intent.
      example: 4ba06e89-8c29-483e-ac36-318de5aa7364
    BootstrappingIntent:
      type: object
      required:
      - protocol
      - network
      - customer_id
      properties:
        protocol:
          $ref: '#/components/schemas/Protocol'
          example: polygon
        network:
          $ref: '#/components/schemas/Network'
        polygon:
          $ref: '#/components/schemas/BootstrappingIntentPolygon'
        customer_id:
          $ref: '#/components/schemas/CustomerId'
    DeactivateIntentPolygon:
      type: object
      description: Polygon Deactivate Intent
      required:
      - to
      - unsigned_transaction
      - amount
      - wallet_address
      properties:
        to:
          $ref: '#/components/schemas/EthereumAddress'
        unsigned_transaction:
          $ref: '#/components/schemas/UnsignedTransaction'
        amount:
          $ref: '#/components/schemas/Wei'
        wallet_address:
          $ref: '#/components/schemas/EthereumAddress'
    PlanId:
      type: string
      description: This feature enables you to stake to validators from the specified plan(s). When no plan id is specified, validators across all plans that match the API route will be available for staking. If it is a shared plan, you can to stake to validators on a shared node from the specified plan.
      example: plan_Wgx98Rbi8nQuL9ddn3mTk1
    PolygonProtocol:
      type: string
      description: Polygon protocol
      enum:
      - polygon
    UnbondNonces:
      type: array
      items:
        $ref: '#/components/schemas/Nonce'
    NewRewardsRestakeIntentPolygon:
      type: object
      description: Request object to create a new Rewards Restake Intent for Polygon
      required:
      - wallet_address
      properties:
        wallet_address:
          $ref: '#/components/schemas/EthereumAddress'
        validator_share_address:
          $ref: '#/components/schemas/EthereumAddress'
        plan_id:
          $ref: '#/components/schemas/PlanId'
        token_type:
          $ref: '#/components/schemas/PolygonTokenType'
    NewRewardsWithdrawIntentPolygon:
      type: object
      description: Request object to create a new rewards withdrawal intent for Polygon.
      required:
      - wallet_address
      properties:
        wallet_address:
          $ref: '#/components/schemas/EthereumAddress'
        validator_share_address:
          $ref: '#/components/schemas/EthereumAddress'
        plan_id:
          $ref: '#/components/schemas/PlanId'
        token_type:
          $ref: '#/components/schemas/PolygonTokenType'
    Network:
      type: string
      description: Protocol-specific network.
      enum:
      - mainnet
      - localnet
      - goerli
      - prater
      - hoodi
      - testnet
      - devnet
      - kusama
      - westend
      - preprod
      - fuji
      - local
    PolygonNetwork:
      type: string
      description: Polygon network
      enum:
      - mainnet
      - goerli
      - prater
    NewWithdrawIntentPolygon:
      type: object
      description: Request object to create a new withdrawal intent for Polygon.
      required:
      - wallet_address
      properties:
        unbond_nonces:
          $ref: '#/components/schemas/UnbondNonces'
        wallet_address:
          $ref: '#/components/schemas/EthereumAddress'
          description: An array of unbond nonces.
        validator_share_address:
          $ref: '#/components/schemas/EthereumAddress'
        plan_id:
          $ref: '#/components/schemas/PlanId'
        token_type:
          $ref: '#/components/schemas/PolygonTokenType'
    WithdrawIntentPolygon:
      type: object
      required:
      - to
      - unsigned_transaction
      - unbond_nonce
      - wallet_address
      properties:
        to:
          $ref: '#/components/schemas/EthereumAddress'
        unsigned_transaction:
          $ref: '#/components/schemas/UnsignedTransaction'
        unbond_nonce:
          $ref: '#/components/schemas/Nonce'
        wallet_address:
          $ref: '#/components/schemas/EthereumAddress'
    CommonWithdrawalResponse:
      type: object
      required:
      - withdraw_intent_id
      - customer_id
      properties:
        withdraw_intent_id:
          $ref: '#/components/schemas/WithdrawIntentId'
        customer_id:
          $ref: '#/components/schemas/CustomerId'
    NewStakeIntentPolygon:
      type: object
      description: Request object to create a new Stake Intent for Polygon
      required:
      - amount
      - wallet_address
      properties:
        amount:
          $ref: '#/components/schemas/Wei'
          description: The amount of tokens (in Wei) you want to stake.
        wallet_address:
          $ref: '#/components/schemas/EthereumAddress'
        validator_share_address:
          $ref: '#/components/schemas/EthereumAddress'
        plan_id:
          $ref: '#/components/schemas/PlanId'
        token_type:
          $ref: '#/components/schemas/PolygonTokenType'
    StakeIntentId:
      type: string
      format: base58
      description: Unique idenifier for a group of stakes.
      example: stake_intent_Wgx98Rbi8nQuL9ddn3mTk1
    PolygonStakeIntentResponse:
      allOf:
      - $ref: '#/components/schemas/CommonStakeIntentResponse'
      - type: object
        required:
        - protocol
        - network
        properties:
          protocol:
            $ref: '#/components/schemas/PolygonProtocol'
          network:
            $ref: '#/components/schemas/PolygonNetwork'
          polygon:
            $ref: '#/components/schemas/StakeIntentPolygon'
    CommonDeactivationResponse:
      type: object
      required:
      - deactivate_intent_id
      - customer_id
      properties:
        deactivate_intent_id:
          $ref: '#/components/schemas/DeactivateIntentId'
        customer_id:
          $ref: '#/components/schemas/CustomerId'
    StakeIntentPolygon:
      type: object
      description: Polygon Stake Intent
      required:
      - to
      - unsigned_transaction
      - amount
      - wallet_address
      properties:
        to:
          $ref: '#/components/schemas/EthereumAddress'
        unsigned_transaction:
          $ref: '#/components/schemas/UnsignedTransaction'
        amount:
          $ref: '#/components/schemas/Wei'
        wallet_address:
          $ref: '#/components/schemas/EthereumAddress'
    RewardsRestakeIntent:
      type: object
      required:
      - protocol
      - network
      - customer_id
      properties:
        protocol:
          $ref: '#/components/schemas/Protocol'
        network:
          $ref: '#/components/schemas/Network'
        polygon:
          $ref: '#/components/schemas/RewardsRestakeIntentPolygon'
        customer_id:
          $ref: '#/components/schemas/CustomerId'
    DeactivationIntentsPolygon:
      type: object
      required:
      - items
      - wallet_address
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Unbond'
        wallet_address:
          $ref: '#/components/schemas/EthereumAddress'
    PolygonWithdrawalIntentResponse:
      allOf:
      - $ref: '#/components/schemas/CommonWithdrawalResponse'
      - type: object
        description: Result of a new withdrawal intent request.
        required:
        - protocol
        - network
        properties:
          protocol:
            $ref: '#/components/schemas/PolygonProtocol'
          network:
            $ref: '#/components/schemas/PolygonNetwork'
          polygon:
            type: array
            items:
              $ref: '#/components/schemas/WithdrawIntentPolygon'
    CustomerId:
      type: string
      description: Unique identifier for a customer
      example: SatoshiNakamoto-xUYJbPw9hw
      minimum: 1
    RewardsWithdrawIntentPolygon:
      type: object
      required:
      - protocol
      - network
      - polygon
      - customer_id
      properties:
        protocol:
          $ref: '#/components/schemas/PolygonProtocol'
        network:
          $ref: '#/components/schemas/PolygonNetwork'
        polygon:
          $ref: '#/components/schemas/PolygonRewardsWithdrawIntent'
        customer_id:
          $ref: '#/components/schemas/CustomerId'
    NewDeactivateIntentPolygon:
      type: object
      description: Request object to create a new deactivation intent for Polygon.
      required:
      - amount
      - wallet_address
      properties:
        amount:
          $ref: '#/components/schemas/Wei'
        wallet_address:
          $ref: '#/components/schemas/EthereumAddress'
        validator_share_address:
          $ref: '#/components/schemas/EthereumAddress'
        plan_id:
          $ref: '#/components/schemas/PlanId'
        token_type:
          $ref: '#/components/schemas/PolygonTokenType'
    Wei:
      type: string
      description: Denomination of the cryptocurrency Polygon.
      pattern: ^[1-9]\d+$
      example: '100'
    Protocol:
      type: string
      description: Blockchain protocol.
      enum:
      - ethereum
      - polkadot
      - solana
      - cosmos
      - polygon
      - near
      - cardano
      - avalanche
      - binance
    UnsignedTransaction:
      type: string
      format: base64
      description: Generated unsigned transaction smart contract call data.
      example: '

        '
    CommonStakeIntentResponse:
      type: object
      required:
      - stake_intent_id
      - customer_id
      properties:
        stake_intent_id:
          $ref: '#/components/schemas/StakeIntentId'
        customer_id:
          $ref: '#/components/schemas/CustomerId'
        plan_id:
          $ref: '#/components/schemas/PlanId'
    PolygonRewardsWithdrawIntent:
      type: object
      required:
      - to
      - unsigned_transaction
      - wallet_address
      properties:
        to:
          $ref: '#/components/schemas/EthereumAddress'
        unsigned_transaction:
          $ref: '#/components/schemas/UnsignedTransaction'
        wallet_address:
          $ref: '#/components/schemas/EthereumAddress'
    RewardsRestakeIntentPolygon:
      type: object
      required:
      - to
      - unsigned_transaction
      - wallet_address
      properties:
        to:
          $ref: '#/components/schemas/EthereumAddress'
        unsigned_transaction:
          $ref: '#/components/schemas/UnsignedTransaction'
        wallet_address:
          $ref: '#/components/schemas/EthereumAddress'
    NewBootstrappingIntentPolygon:
      type: object
      description: Request object to create a new Bootstrapping Intent for Polygon.
      required:
      - wallet_address
      properties:
        wallet_address:
          $ref: '#/components/schemas/EthereumAddress'
        token_type:
          $ref: '#/components/schemas/PolygonTokenType'
    Unbond:
      type: object
      description: Unbond information
      required:
      - nonce
      - amount
      - withdraw_epoch
      properties:
        nonce:
          $ref: '#/components/schemas/Nonce'
        amount:
          $ref: '#/components/schemas/Wei'
        withdraw_epoch:
          type: integer
    DeactivateIntentId:
      type: string
      format: uuid
      description: Unique idenifier for deactivate intent.
      example: 4ba06e89-8c29-483e-ac36-318de5aa7364
    Nonce:
      type: integer
      description: Number for one use only
      example: 1
    UnauthorizedError:
      type: object
      description: Error response envelope
      required:
      - code
      - message
      properties:
        code:
          type: integer
          format: int32
          description: Error code
          example: 401
        message:
          type: string
          description: Error Message
          example: A human-readable diagnostic message detailing any authorization failure
    EthereumAddress:
      type: string
      description: Hex-encoded Ethereum [account or smart contract address](https://ethereum.org/en/developers/docs/accounts/).
      format: hex
      pattern: ^0x[a-fA-F0-9]{40}$
      example: '0x00000000219ab540356cBB839Cbe05303d7705Fa'
  parameters:
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      description: the unique idempotency key for this request
      example: f1c971b4-7114-4c4b-8ad2-a6f9e33e2cd0
      schema:
        type: string
        format: uuid
      required: false
    PolygonNetwork:
      name: network
      in: path
      description: Polygon network
      required: true
      schema:
        $ref: '#/components/schemas/PolygonNetwork'
    WalletAddress:
      name: wallet_address
      in: query
      required: false
      description: User wallet address.
      schema:
        $ref: '#/components/schemas/EthereumAddress'
  responses:
    BootstrappingIntent:
      description: Bootstrapping intent created
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BootstrappingIntent'
    RewardsRestakeIntent:
      description: Rewards restake intent created
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RewardsRestakeIntent'
    RewardsWithdrawIntentPolygon:
      description: Rewards withdrawal intent created
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RewardsWithdrawIntentPolygon'
    InvalidRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            type: object
            description: Error response envelope
            required:
            - code
            - message
            properties:
              code:
                type: integer
                format: int32
                description: Error code
                example: 400
              message:
                type: string
                description: Error Message
                example: Detailed human-readable diagnostic message regarding any invalid request parameters
    InternalServerError:
      description: Internal server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Cancelled:
      description: Cancellation Successful
      content:
        application/json:
          schema:
            type: object
            description: Success Response
            required:
            - code
            - message
            properties:
              code:
                type: integer
                format: int32
                description: Status Code
                example: 201
              message:
                type: string
                description: Confirmation Message
                example: Canceled
    Unauthorized:
      description: Header 'X-API-Key' missing.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UnauthorizedError'
    NoValidatorsError:
      description: Insufficient validators available to process Stake Intent request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    ApiKeyAuth:
      description: 'When signing up for a staking account, you are provided with an API key.


        To authenticate a Staking API request, pass your API key in the `X-API-Key` header.'
      type: apiKey
      in: header
      name: X-API-KEY
