openapi: 3.0.3
info:
  title: Sepior Threshold Security Module (TSM) Management API
  description: 'Management API for the Threshold Security Module (TSM).


    This API provides endpoints for monitoring and managing TSM nodes, including

    health checks, metrics, API key management, and authentication configuration.

    '
  version: 1.0.0
  contact:
    name: Blockdaemon/Sepior Support
    url: https://blockdaemon.com/
  license:
    name: Proprietary
servers:
- url: '{server}'
  description: TSM Management API Server
  variables:
    server:
      default: https://localhost:8080
      description: Server URL
security:
- APIKeyAuth: []
paths:
  /management/apikey:
    get:
      summary: List API keys
      description: Returns a list of all API keys
      operationId: listApiKeys
      tags:
      - API Keys
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: Create API key
      description: Creates a new API key
      operationId: createApiKey
      tags:
      - API Keys
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiKeyCreateRequest'
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyCreateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /management/apikey/{apiKeyID}:
    delete:
      summary: Delete API key
      description: Deletes an API key by ID
      operationId: deleteApiKey
      tags:
      - API Keys
      parameters:
      - name: apiKeyID
        in: path
        description: ID of the API key to delete
        required: true
        schema:
          type: string
      responses:
        '204':
          description: API key deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /management/configuration/auditsigningpublickey:
    get:
      summary: Get audit signing public key
      description: Returns the public key used for signing audit logs
      operationId: getAuditSigningPublicKey
      tags:
      - Configuration
      responses:
        '200':
          description: Successful operation
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /management/configuration/authinfo:
    get:
      summary: Get authentication information
      description: Returns information about available authentication methods
      operationId: getAuthenticationInfo
      tags:
      - Configuration
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuthenticatorInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /management/health:
    get:
      summary: Health check
      description: Returns the health status of the TSM node
      operationId: healthCheck
      tags:
      - Health
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthInformation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /management/metrics:
    get:
      summary: Get system metrics
      description: Returns system metrics in either Prometheus or expvar format
      operationId: getMetrics
      tags:
      - Metrics
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                description: Metrics data (format depends on configuration)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /management/profiling/debug/fgprof:
    get:
      summary: Get fgprof profile
      description: Returns fgprof profiling data
      operationId: getFGProf
      tags:
      - Profiling
      responses:
        '200':
          description: Successful operation
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '500':
          $ref: '#/components/responses/InternalServerError'
  /management/profiling/debug/pprof:
    get:
      summary: Get pprof index
      description: Returns pprof index page
      operationId: getPProfIndex
      tags:
      - Profiling
      responses:
        '200':
          description: Successful operation
          content:
            text/html:
              schema:
                type: string
        '500':
          $ref: '#/components/responses/InternalServerError'
  /management/profiling/debug/pprof/{profile}:
    get:
      summary: Get specific pprof profile
      description: Returns a specific pprof profile
      operationId: getPProfProfile
      tags:
      - Profiling
      parameters:
      - name: profile
        in: path
        description: Name of the profile to retrieve
        required: true
        schema:
          type: string
          enum:
          - allocs
          - block
          - cmdline
          - goroutine
          - heap
          - mutex
          - profile
          - threadcreate
          - trace
      responses:
        '200':
          description: Successful operation
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  schemas:
    HealthInformation:
      type: object
      properties:
        pendingAuditLogEntries:
          type: integer
          description: Number of pending audit log entries
      required:
      - pendingAuditLogEntries
    Error:
      type: object
      properties:
        code:
          type: string
          description: Error code
        message:
          type: string
          description: Error message
        details:
          type: object
          description: Additional error details
      required:
      - code
      - message
    AuthenticatorInfo:
      type: object
      additionalProperties: true
      description: Information about an authentication method
    ApiKeyListResponse:
      type: object
      properties:
        apiKeys:
          type: array
          description: List of API keys
          items:
            $ref: '#/components/schemas/ApiKeyListEntry'
      required:
      - apiKeys
    ApiKeyListEntry:
      type: object
      properties:
        id:
          type: string
          description: ID of the API key
        applicationId:
          type: string
          description: ID of the application using this API key
        description:
          type: string
          description: Description of the API key
        createdAt:
          type: string
          format: date-time
          description: When the API key was created
      required:
      - id
      - applicationId
      - description
      - createdAt
    ApiKeyCreateRequest:
      type: object
      properties:
        applicationId:
          type: string
          description: ID of the application that will use the API key
        description:
          type: string
          description: Description of the API key
      required:
      - applicationId
      - description
    ApiKeyCreateResponse:
      type: object
      properties:
        apiKeyId:
          type: string
          description: ID of the created API key
        apiKey:
          type: string
          description: The API key value (only shown once at creation time)
      required:
      - apiKeyId
      - apiKey
  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    APIKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
tags:
- name: Health
  description: Health check operations
- name: Configuration
  description: Configuration information operations
- name: API Keys
  description: API key management operations
- name: Metrics
  description: System metrics operations
- name: Profiling
  description: Application profiling operations
