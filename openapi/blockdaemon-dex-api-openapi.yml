components:
  schemas:
    _dex_addliquidity_Request:
      type: object
      properties:
        dexId:
          type: string
          description: The unique ID to specify the decentralized exchange (DEX) within a particular blockchain. Find more [here](https://docs.blockdaemon.com/docs/defi-api-supported-protocols#supported-dexs-protocols).
          enum:
          - '1000'
          - '1001'
          - '1300'
          - '1301'
          - '1305'
          - '1306'
          - '1307'
          - '1308'
          - '1309'
          - '1310'
          - '1100'
          - '1101'
          - '1200'
          - '1201'
          - '2900'
          - '2901'
          - '2800'
          - '2808'
          - '2809'
          - '1500'
          - '1400'
          - '1402'
          - '2300'
          - '2100'
          - '2101'
          - '2500'
          - '2501'
          - '2700'
          - '2400'
          - '2401'
          - '3000'
          - '3001'
          - '3300'
          - '3301'
          - '3500'
          - '3501'
          - '3400'
          - '3401'
          - '3600'
          example: '1000'
        tokenA:
          type: string
          description: Address of the first token being added.
          example: '0x514910771AF9Ca656af840dff83E8264EcF986CA'
        tokenB:
          type: string
          description: Address of the second token being added.
          example: '0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48'
        amountADesired:
          type: string
          description: 'Desired amount of token A to add as liquidity, specified in the token''s smallest denomination (base units). Do not send human-readable decimal values. Examples: 1 WETH (18 decimals) = "1000000000000000000"; 1 USDC (6 decimals) = "1000000".'
          example: '1000000000000000000'
        amountBDesired:
          type: string
          description: 'Desired amount of token B to add as liquidity, specified in the token''s smallest denomination (base units). Do not send human-readable decimal values. Examples: 1 WETH (18 decimals) = "1000000000000000000"; 1 USDC (6 decimals) = "1000000".'
          example: '1000000000000000000'
        amountAMin:
          type: string
          description: Minimum acceptable amount of token A in the token's smallest denomination (base units). Provides slippage protection — the transaction reverts if the deposited amount falls below this value. Set to "0" to disable slippage protection.
          example: '0'
        amountBMin:
          type: string
          description: Minimum acceptable amount of token B in the token's smallest denomination (base units). Provides slippage protection — the transaction reverts if the deposited amount falls below this value. Set to "0" to disable slippage protection.
          example: '0'
        deadline:
          type: string
          description: Deadline for the transaction to be executed (UNIX Timestamp).
          example: '1707313948'
        to:
          type: string
          description: Address of the recipient of the token.
          example: '0xdAe2F6EdDdA6fb4fb60cc02633DE27e2b431B402'
        from:
          type: string
          description: Address of the sender of the token.
          example: '0xdAe2F6EdDdA6fb4fb60cc02633DE27e2b431B402'
        gas:
          type: string
          description: 'Maximum number of gas units to allocate for the transaction, as an integer string (e.g., ''200000''). If omitted, gas is estimated automatically. Note: this is gas units, not wei or gwei.'
          example: '100000'
        gasPriority:
          type: string
          description: Specifies the priority level for gas fees (e.g., 'low', 'medium', or 'high'), which influences the transaction speed and cost.
          example: low
        slippage:
          type: string
          description: Percentage of total swap value allowed for slippage. By default, 1.
          example: '10'
        enableFee:
          type: boolean
          description: Flag to include a basis points fee transaction alongside the main transaction when set to true.
          example: false
        poolFees:
          type: string
          description: Different pool based on the fees.
          example: '3000'
        tokenId:
          type: string
          description: The token ID for Uniswap V3 liquidity position.
          example: '3238'
        path:
          type: array
          items:
            type: string
          description: 'Array of token contract addresses for the liquidity pool. Provide [tokenAAddress, tokenBAddress]. Example (LINK/USDC): [''0x514910771AF9Ca656af840dff83E8264EcF986CA'', ''0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48''].'
          example:
          - '0x514910771AF9Ca656af840dff83E8264EcF986CA'
          - '0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48'
        amountIn:
          type: string
          description: 'Amount of tokens to add as liquidity, specified in the token''s smallest denomination (base units). Do not send human-readable decimal values. Examples: 1 WETH (18 decimals) = "1000000000000000000"; 1 USDC (6 decimals) = "1000000".'
          example: '1000000000000000000'
        amountOut:
          type: string
          description: 'Amount of the output token to receive, specified in the token''s smallest denomination (base units). Do not send human-readable decimal values. Examples: 1 WETH (18 decimals) = "1000000000000000000"; 1 USDC (6 decimals) = "1000000".'
          example: '1000000000000000000'
        fromInternalBalance:
          type: boolean
          description: True if sending from internal token balances, otherwise False for ERC20.
          example: false
        amountA:
          type: string
          description: 'Amount of token A, specified in the token''s smallest denomination (base units). Examples: 1 WETH (18 decimals) = "1000000000000000000"; 1 USDC (6 decimals) = "1000000".'
          example: '1000000000000000000'
        amountB:
          type: string
          description: 'Amount of token B, specified in the token''s smallest denomination (base units). Examples: 1 WETH (18 decimals) = "1000000000000000000"; 1 USDC (6 decimals) = "1000000".'
          example: '1000000000000000000'
        strategy:
          type: string
          description: 'Liquidity strategy to be used: spotUniform, curve, or bidask. Default is spotUniform.'
          enum:
          - stable
          - uncorrelated
          example: stable
        amountOutMin:
          type: string
          description: 'Minimum acceptable output amount in the token''s smallest denomination (base units). Provides slippage protection — the transaction reverts if the output falls below this value. Set to "0" to disable slippage protection. Examples: to require at least 0.99 USDC (6 decimals), use "990000"; to require at least 0.99 WETH (18 decimals), use "990000000000000000".'
          example: '0'
      required:
      - tokenA
      - tokenB
      - amountADesired
      - amountBDesired
      - amountAMin
      - amountBMin
      - deadline
      - to
      - from
      - poolFees
      - path
      - amountIn
      - gas
      - amountOut
      - fromInternalBalance
      - amountA
      - amountB
      description: The request body for a /defi/v1/dex/addliquidity
      example:
        dexId: '1000'
        tokenA: '0x514910771AF9Ca656af840dff83E8264EcF986CA'
        tokenB: '0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48'
        amountADesired: '1000000000000000000'
        amountBDesired: '1000000000000000000'
        amountAMin: '0'
        amountBMin: '0'
        deadline: '1707313948'
        to: '0xdAe2F6EdDdA6fb4fb60cc02633DE27e2b431B402'
        from: '0xdAe2F6EdDdA6fb4fb60cc02633DE27e2b431B402'
        gas: '100000'
        gasPriority: low
        slippage: '10'
        enableFee: false
        poolFees: '3000'
        tokenId: '3238'
        path:
        - '0x514910771AF9Ca656af840dff83E8264EcF986CA'
        - '0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48'
        amountIn: '1000000000000000000'
        amountOut: '1000000000000000000'
        fromInternalBalance: false
        amountA: '1000000000000000000'
        amountB: '1000000000000000000'
        strategy: stable
        amountOutMin: '0'
    _dex_swap_Request:
      type: object
      properties:
        dexId:
          type: string
          description: The unique ID to specify the decentralized exchange (DEX) within a particular blockchain. Find more [here](https://docs.blockdaemon.com/docs/defi-api-supported-protocols#supported-dexs-protocols).
          enum:
          - '1000'
          - '1001'
          - '1900'
          - '1300'
          - '1301'
          - '1305'
          - '1306'
          - '1307'
          - '1308'
          - '1309'
          - '1310'
          - '1100'
          - '1101'
          - '1200'
          - '1201'
          - '2900'
          - '2901'
          - '2800'
          - '2808'
          - '2809'
          - '1500'
          - '1400'
          - '1402'
          - '2300'
          - '2100'
          - '2101'
          - '2500'
          - '2501'
          - '2700'
          - '2600'
          - '2400'
          - '2401'
          - '1600'
          - '1602'
          - '1604'
          - '1605'
          - '1607'
          - '1608'
          - '1700'
          - '1701'
          - '1702'
          - '1703'
          - '1704'
          - '1706'
          - '1707'
          - '2200'
          - '2201'
          - '2202'
          - '2203'
          - '2204'
          - '2205'
          - '2206'
          - '3000'
          - '3001'
          - '3100'
          - '3300'
          - '3301'
          - '3500'
          - '3501'
          - '3400'
          - '3401'
          - '3600'
          - '3800'
          - '3700'
          example: '1000'
        path:
          type: array
          items:
            type: string
          description: 'Ordered array of token contract addresses defining the swap route. Provide [tokenInAddress, tokenOutAddress] for a direct swap. Example (WETH→USDC on Ethereum): [''0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2'', ''0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48''].'
          example:
          - '0x514910771AF9Ca656af840dff83E8264EcF986CA'
          - '0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48'
        amountIn:
          type: string
          description: 'Amount of the input token to provide, specified in the token''s smallest denomination (base units). Do not send human-readable decimal values. Examples: to swap 1 WETH (18 decimals), use "1000000000000000000"; to swap 1 USDC (6 decimals), use "1000000".'
          example: '1000000000000000000'
        amountOutMin:
          type: string
          description: 'Minimum acceptable output amount in the token''s smallest denomination (base units). Provides slippage protection — the transaction reverts if the output falls below this value. Set to "0" to disable slippage protection. Examples: to require at least 0.99 USDC (6 decimals), use "990000"; to require at least 0.99 WETH (18 decimals), use "990000000000000000".'
          example: '0'
        to:
          type: string
          description: Blockchain address of the token recipient. For EVM chains, use a checksummed hex address (e.g., 0xABCDEF...). Output tokens are delivered to this address after the swap.
          example: '0xdAe2F6EdDdA6fb4fb60cc02633DE27e2b431B402'
        deadline:
          type: string
          description: 'Transaction expiry time as a Unix timestamp in seconds (not milliseconds). The transaction will revert if not submitted before this time. Example: to set a 20-minute deadline, use current Unix timestamp + 1200.'
          example: '1707313948'
        from:
          type: string
          description: Blockchain address of the token sender. For EVM chains, use a checksummed hex address (e.g., 0xABCDEF...). This address must hold sufficient balance of the input token and will sign the transaction.
          example: '0xdAe2F6EdDdA6fb4fb60cc02633DE27e2b431B402'
        gas:
          type: string
          description: 'Maximum number of gas units to allocate for the transaction, as an integer string (e.g., ''200000''). If omitted, gas is estimated automatically. Note: this is gas units, not wei or gwei.'
          example: '100000'
        gasPriority:
          type: string
          description: Specifies the priority level for gas fees (e.g., 'low', 'medium', or 'high'), which influences the transaction speed and cost.
          example: low
        slippage:
          type: string
          description: 'Maximum acceptable slippage as a percentage of the swap value. Valid range: 0 to 100 (e.g., 1 = up to 1% slippage). Defaults to 1. The transaction reverts if the output deviates more than this percentage from the quoted price.'
          example: '10'
        enableFee:
          type: boolean
          description: Flag to include a basis points fee transaction alongside the main transaction when set to true.
          example: false
        batchOption:
          type: string
          description: 'Transaction batching standard to use. Supported values: ''EIP-5792'' (wallet-level batching via wallet_sendCalls) or ''EIP-7702'' (EOA code delegation via batcherContract). Requires batcherContract when using EIP-7702.'
          enum:
          - EIP-5792
          - EIP-7702
          example: EIP-5792
        batcherContract:
          type: string
          description: The EOA address of the batcher that will be used to execute the transaction when using EIP-7702 batching. If not provided, the default batcher contract for the chain will be used.
          example: '0x9c933f9d2efd76ce25b0d3dde84d3f94e78a50ca'
        simulate:
          type: boolean
          description: When true, dry-runs the transaction batch via eth_simulateV1 and returns a simulate field with status and error on each transaction.
          example: false
        poolFees:
          type: string
          description: 'Fee tier of the target liquidity pool in basis points (1 bp = 0.01%). Common values for Uniswap V3-style AMMs: 100 (0.01%), 500 (0.05%), 3000 (0.3%), 10000 (1%). If omitted, the pool yielding the highest output amount is selected automatically.'
          example: '3000'
      required:
      - path
      - amountIn
      - to
      - deadline
      - from
      description: The request body for a /defi/v1/dex/swap
      example:
        dexId: '1000'
        path:
        - '0x514910771AF9Ca656af840dff83E8264EcF986CA'
        - '0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48'
        amountIn: '1000000000000000000'
        amountOutMin: '0'
        to: '0xdAe2F6EdDdA6fb4fb60cc02633DE27e2b431B402'
        deadline: '1707313948'
        from: '0xdAe2F6EdDdA6fb4fb60cc02633DE27e2b431B402'
        gas: '100000'
        gasPriority: low
        slippage: '10'
        enableFee: false
        batchOption: EIP-5792
        batcherContract: '0x9c933f9d2efd76ce25b0d3dde84d3f94e78a50ca'
        simulate: false
        poolFees: '3000'
    _dex_publishorder_Request:
      type: object
      properties:
        dexId:
          type: string
          description: The unique ID to specify the decentralized exchange (DEX) within a particular blockchain. Find more [here](https://docs.blockdaemon.com/docs/defi-api-supported-protocols#supported-dexs-protocols).
          enum:
          - '2200'
          - '2201'
          - '2202'
          - '2203'
          - '2204'
          - '2205'
          - '2206'
          example: '2200'
        orderType:
          type: string
          description: The type of order to publish. Can be 'create' or 'cancel'. Defaults to 'create'.
          enum:
          - create
          - cancel
          example: create
        makerAsset:
          type: string
          description: The token address of the asset that the Maker is selling.
          example: '0x0d500B1d8E8eF31E21C99d1Db9A6444d3ADf1270'
        takerAsset:
          type: string
          description: The token address of the asset that the Maker expects in return.
          example: '0xc2132d05d31c914a87c6611c10748aeb04b58e8f'
        from:
          type: string
          description: The address of the sender (Maker) initiating the transaction.
          example: '0xdAe2F6EdDdA6fb4fb60cc02633DE27e2b431B402'
        to:
          type: string
          description: The address of the recipient (Taker) for the transaction.
          example: '0xdAe2F6EdDdA6fb4fb60cc02633DE27e2b431B402'
        amountIn:
          type: string
          description: 'Amount of the input token to provide, specified in the token''s smallest denomination (base units). Do not send human-readable decimal values. Examples: to swap 1 WETH (18 decimals), use "1000000000000000000"; to swap 1 USDC (6 decimals), use "1000000".'
          example: '1000000000000000000'
        amountOut:
          type: string
          description: 'Amount of the output token to receive, specified in the token''s smallest denomination (base units). Do not send human-readable decimal values. Examples: 1 WETH (18 decimals) = "1000000000000000000"; 1 USDC (6 decimals) = "1000000".'
          example: '1000000000000000000'
        deadline:
          type: string
          description: The deadline for the transaction to be executed (in UNIX Timestamp format).
          example: '1707313948'
        orderId:
          type: boolean
          description: The unique identifier of the order to retrieve. Use this to fetch details for a specific order.
          example: '95167'
        salt:
          type: string
          description: A randomized value to prevent replay attacks, used as an additional input in hashing.
          example: '140518201020656697335313758999689041588'
        enableFee:
          type: boolean
          description: Flag to include a basis points fee transaction alongside the main transaction when set to true.
          example: false
      required:
      - from
      description: The request body for a /defi/v1/dex/publishorder
      example:
        dexId: '2200'
        orderType: create
        makerAsset: '0x0d500B1d8E8eF31E21C99d1Db9A6444d3ADf1270'
        takerAsset: '0xc2132d05d31c914a87c6611c10748aeb04b58e8f'
        from: '0xdAe2F6EdDdA6fb4fb60cc02633DE27e2b431B402'
