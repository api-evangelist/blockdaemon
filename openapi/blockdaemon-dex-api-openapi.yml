  /defi/v1/dex/gethistoricaltransactions:
    get:
      tags:
      - dex
      summary: Get Historical Transactions
      description: 'Retrieves a chronological list of swap transactions for a specified DEX pool within a defined block range, returning transaction hashes, addresses, and gas metrics. Block-level details (e.g., block number, timestamp) and transfer categorization (e.g., send, receive, contract interaction) help facilitate in-depth auditing and performance analysis, with a pagination token for navigating extended data.


        > 💡

        **Compute Unit Value:** `205` (Fixed)'
      operationId: dexGethistoricaltransactions
      parameters:
      - name: dexId
        in: query
        required: false
        schema:
          type: string
          description: The unique ID to specify the decentralized exchange (DEX) within a particular blockchain. Find more [here](https://docs.blockdaemon.com/docs/defi-api-supported-protocols#supported-dexs-protocols).
          enum:
          - '1000'
          - '1300'
          - '1305'
          - '1306'
          - '1307'
          - '1308'
          - '1309'
          - '1100'
          - '1200'
          - '1201'
          example: '1000'
        description: The unique ID to specify the decentralized exchange (DEX) within a particular blockchain. Find more [here](https://docs.blockdaemon.com/docs/defi-api-supported-protocols#supported-dexs-protocols).
      - name: endBlock
        in: query
        required: false
        schema:
          type: string
          description: Last block of the range.
          example: '100010'
        description: Last block of the range.
      - name: startBlock
