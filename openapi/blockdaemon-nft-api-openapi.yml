- url: https://svc.blockdaemon.com
security:
- ApiKeyAuth: []
tags:
- name: NFT
paths:
  /defi/v1/nft/getbalance:
    get:
      tags:
      - NFT
      summary: Get Balance
      description: 'Retrieves the quantity of NFTs held by a specific wallet address for a given collection across multiple blockchain networks. This endpoint allows users and developers to quickly determine the number of NFTs an address owns within a particular collection, facilitating portfolio tracking, auditing of NFT holdings, and interactions with NFT marketplaces or decentralized applications.


        > 💡

        **Compute Unit Value:** `95` (Fixed)'
      operationId: nftGetbalance
      parameters:
      - name: chainId
        in: query
        required: false
        schema:
          type: string
          description: The unique ID to direct queries or transactions to the correct blockchain. Find more [here](https://docs.blockdaemon.com/docs/defi-api-supported-protocols#supported-chains).
          enum:
          - '1'
          - '56'
          - '43114'
          - '137'
          - '250'
          - '10'
          - '11155420'
          - '42161'
          - '421614'
          - '25'
          - '338'
          - '84532'
          - '8453'
          - '43113'
          - '97'
          - '80002'
          - '300'
          - '324'
          - '5000'
          - '5003'
          - '900'
          - '901'
          example: '1'
        description: The unique ID to direct queries or transactions to the correct blockchain. Find more [here](https://docs.blockdaemon.com/docs/defi-api-supported-protocols#supported-chains).
      - name: chainSymbol
        in: query
        required: false
        schema:
          type: string
          description: The abbreviated chain name for queries or transactions.
          example: ETH
        description: The abbreviated chain name for queries or transactions.
      - name: nftCollection
        in: query
        required: true
        schema:
          type: string
          description: The smart contract address of the NFT collection whose balance is to be retrieved.
          example: '0xBC4CA0EdA7647A8aB7C2061c2E118A18a936f13D'
        description: The smart contract address of the NFT collection whose balance is to be retrieved.
      - name: address
        in: query
        required: true
        schema:
          type: string
          description: The user's blockchain address for which the NFT balance will be queried.
          example: '0xdAe2F6EdDdA6fb4fb60cc02633DE27e2b431B402'
        description: The user's blockchain address for which the NFT balance will be queried.
      - name: nftProtocolId
        in: query
        required: false
        schema:
          type: string
          description: Specifies the NFT standard to use for the query. Acceptable values are 721 for ERC-721 tokens and 1155 for ERC-1155 tokens. If not provided, the default value is 721
          example: '721'
        description: Specifies the NFT standard to use for the query. Acceptable values are 721 for ERC-721 tokens and 1155 for ERC-1155 tokens. If not provided, the default value is 721
      - name: tokenId
        in: query
        required: false
        schema:
          type: string
          description: The unique token ID within the NFT collection. Required for ERC-1155 (nftProtocolId=1155) since multiple token types share one contract. For ERC-721, if only querying total owned, this can be omitted.
          example: '3238'
        description: The unique token ID within the NFT collection. Required for ERC-1155 (nftProtocolId=1155) since multiple token types share one contract. For ERC-721, if only querying total owned, this can be omitted.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: object
                example:
                  status: 200
                  msg: success
                  data:
                    balance: '2'
      x-bd-cu: '95'
      x-bd-cu-type: fixed
      x-internal: false
  /defi/v1/nft/getmetadata:
    get:
      tags:
      - NFT
      summary: Get Metadata
      description: 'Fetches comprehensive metadata for a specified NFT collection, including key details such as the collection’s name, symbol, attributes, images, and additional descriptive information. This endpoint is essential for rendering rich NFT displays, powering detailed collection analytics, and enabling seamless integration with NFT marketplaces across supported blockchain networks.


        > 💡

        **Compute Unit Value:** `95` (Fixed)'
      operationId: nftGetmetadata
      parameters:
      - name: chainId
        in: query
        required: false
        schema:
          type: string
          description: The unique ID to direct queries or transactions to the correct blockchain. Find more [here](https://docs.blockdaemon.com/docs/defi-api-supported-protocols#supported-chains).
          enum:
          - '1'
          - '56'
          - '43114'
          - '137'
          - '250'
          - '10'
          - '11155420'
          - '42161'
          - '421614'
          - '25'
          - '338'
          - '84532'
          - '8453'
          - '43113'
          - '97'
          - '80002'
          - '300'
          - '324'
          - '5000'
          - '5003'
          - '900'
          - '901'
          example: '1'
        description: The unique ID to direct queries or transactions to the correct blockchain. Find more [here](https://docs.blockdaemon.com/docs/defi-api-supported-protocols#supported-chains).
      - name: chainSymbol
        in: query
        required: false
        schema:
          type: string
          description: The abbreviated chain name for queries or transactions.
          example: ETH
        description: The abbreviated chain name for queries or transactions.
      - name: nftCollection
        in: query
        required: true
        schema:
          type: string
          description: The smart contract address of the NFT collection whose balance is to be retrieved.
          example: '0xBC4CA0EdA7647A8aB7C2061c2E118A18a936f13D'
        description: The smart contract address of the NFT collection whose balance is to be retrieved.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: object
                example:
                  status: 200
                  msg: success
                  data:
                    name: 'Crowdsurfers #1000'
                    symbol: CROWD
                    uri: https://us-central1-simpl3r.cloudfunctions.net/m?id=8fGYVuiq5REaVwWTwatPvk342dm4xSY9ok2dE5rYEU5f&pid=eW6BNOjMgIFva6BNQ4Du
      x-bd-cu: '95'
      x-bd-cu-type: fixed
