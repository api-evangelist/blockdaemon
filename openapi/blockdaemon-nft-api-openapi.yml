      description: 'Retrieves a chronological list of historical NFT transactions for a specified collection on Ethereum, with customizable block ranges, pagination, and sorting. The response includes comprehensive details (block numbers, timestamps, transaction hashes, addresses, token IDs, gas metrics) to facilitate NFT auditing, market analysis, and dashboard integrations.


        > 💡

        **Compute Unit Value:** `90` (Fixed)'
      operationId: nftHistoricaltransactions
      parameters:
      - name: chainId
        in: query
        required: false
        schema:
          type: string
          description: The unique ID to direct queries or transactions to the correct blockchain. Find more [here](https://docs.blockdaemon.com/docs/defi-api-supported-protocols#supported-chains).
          enum:
          - '1'
          example: '1'
        description: The unique ID to direct queries or transactions to the correct blockchain. Find more [here](https://docs.blockdaemon.com/docs/defi-api-supported-protocols#supported-chains).
      - name: chainSymbol
        in: query
        required: false
