      - name: nftCollection
        in: query
        required: true
        schema:
          type: string
          description: The smart contract address of the NFT collection whose balance is to be retrieved.
          example: '0xBC4CA0EdA7647A8aB7C2061c2E118A18a936f13D'
        description: The smart contract address of the NFT collection whose balance is to be retrieved.
      - name: nftProtocolId
        in: query
        required: false
        schema:
          type: string
          description: Specifies the NFT standard to use for the query. Acceptable values are 721 for ERC-721 tokens and 1155 for ERC-1155 tokens. If not provided, the default value is 721
          example: '721'
        description: Specifies the NFT standard to use for the query. Acceptable values are 721 for ERC-721 tokens and 1155 for ERC-1155 tokens. If not provided, the default value is 721
      - name: startBlock
        in: query
        required: false
        schema:
          type: string
          description: Specifies the starting block number for the event log query. If not provided, the default value is set to 100 blocks prior to the latest finalized block, ensuring a recent historical range is returned.
          example: '100000'
        description: Specifies the starting block number for the event log query. If not provided, the default value is set to 100 blocks prior to the latest finalized block, ensuring a recent historical range is returned.
      - name: page
        in: query
        required: false
        schema:
          type: string
          description: Indicates the page number for paginated results. Defaults to '1' if no value is specified, allowing for easy navigation through large sets of log data.
          example: '1'
        description: Indicates the page number for paginated results. Defaults to '1' if no value is specified, allowing for easy navigation through large sets of log data.
      - name: endBlock
        in: query
        required: false
        schema:
          type: string
          description: Specifies the ending block number for the event log query. If omitted, the default is the latest finalized block, capturing all events up to the most recent block.
          example: '100010'
        description: Specifies the ending block number for the event log query. If omitted, the default is the latest finalized block, capturing all events up to the most recent block.
      - name: sort
        in: query
        required: false
        schema:
          type: string
          description: Determines the order in which the transactions are returned. Acceptable values are 'asc' for ascending order and 'desc' for descending order. If not provided, the default value is 'desc', which returns the most recent logs first.
          enum:
          - desc
          - asc
          example: desc
        description: Determines the order in which the transactions are returned. Acceptable values are 'asc' for ascending order and 'desc' for descending order. If not provided, the default value is 'desc', which returns the most recent logs first.
      responses:
        '200':
          description: Successful response
