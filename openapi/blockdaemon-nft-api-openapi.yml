  /defi/v1/nft/getowner:
    get:
      tags:
      - NFT
      summary: Get Owner
      description: 'Identifies and retrieves the current owner of a specific NFT within a collection on supported blockchain networks. By providing the necessary identifiers or parameters, this endpoint returns the owner’s public address, thereby enabling verification of ownership, tracking of NFT transfers, and supporting secondary market transactions.


        > 💡

        **Compute Unit Value:** `85` (Fixed)'
      operationId: nftGetowner
      parameters:
      - name: chainId
        in: query
        required: false
        schema:
          type: string
          description: The unique ID to direct queries or transactions to the correct blockchain. Find more [here](https://docs.blockdaemon.com/docs/defi-api-supported-protocols#supported-chains).
          enum:
          - '1'
          - '56'
          - '43114'
          - '137'
          - '900'
          - '901'
          - '250'
          - '10'
          - '11155420'
          - '42161'
          - '421614'
          - '25'
          - '338'
          - '84532'
          - '8453'
          - '43113'
          - '97'
          - '80002'
          - '300'
          - '324'
          - '5000'
          - '5003'
          example: '1'
        description: The unique ID to direct queries or transactions to the correct blockchain. Find more [here](https://docs.blockdaemon.com/docs/defi-api-supported-protocols#supported-chains).
      - name: chainSymbol
        in: query
        required: false
        schema:
          type: string
          description: The abbreviated chain name for queries or transactions.
          example: ETH
        description: The abbreviated chain name for queries or transactions.
      - name: nftCollection
        in: query
        required: true
        schema:
          type: string
          description: The smart contract address of the NFT collection whose balance is to be retrieved.
          example: '0xBC4CA0EdA7647A8aB7C2061c2E118A18a936f13D'
        description: The smart contract address of the NFT collection whose balance is to be retrieved.
      - name: nftProtocolId
        in: query
        required: false
        schema:
          type: string
          description: Specifies the NFT standard to use for the query. Acceptable values are 721 for ERC-721 tokens and 1155 for ERC-1155 tokens. If not provided, the default value is 721
          example: '721'
        description: Specifies the NFT standard to use for the query. Acceptable values are 721 for ERC-721 tokens and 1155 for ERC-1155 tokens. If not provided, the default value is 721
      - name: nftIndex
        in: query
        required: true
        schema:
          type: string
          description: The unique index or identifier for the NFT within the specified collection. For ERC-721 collections, this typically corresponds to the token's ID, while for ERC-1155 collections it distinguishes between different token types within the contract. This parameter specifies exactly which NFT's owner should be retrieved.
          example: '1000'
        description: The unique index or identifier for the NFT within the specified collection. For ERC-721 collections, this typically corresponds to the token's ID, while for ERC-1155 collections it distinguishes between different token types within the contract. This parameter specifies exactly which NFT's owner should be retrieved.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: object
                example:
                  status: 200
                  msg: success
                  data:
                    owner: '0x68761dE35422d8e36d18dC2F7f6313a58c1a3616'
      x-bd-cu: '85'
      x-bd-cu-type: fixed
      x-internal: false
  /defi/v1/nft/historicallogs:
    get:
      tags:
      - NFT
      summary: Historical Logs
      description: 'Extracts detailed historical event logs for NFT collections within a specified block range on Ethereum. Designed to support different NFT standards (such as ERC721 and ERC1155), the endpoint returns granular log data—including event topics, parameters (like from, to, and tokenId), block details, and transaction identifiers—allowing developers and auditors to analyze the full history of NFT-related events, track transfers, and perform forensic or compliance analyses.


        > 💡

        **Compute Unit Value:** `100` (Fixed)'
      operationId: nftHistoricallogs
      parameters:
      - name: chainId
        in: query
        required: false
        schema:
          type: string
          description: The unique ID to direct queries or transactions to the correct blockchain. Find more [here](https://docs.blockdaemon.com/docs/defi-api-supported-protocols#supported-chains).
          enum:
          - '1'
          example: '1'
        description: The unique ID to direct queries or transactions to the correct blockchain. Find more [here](https://docs.blockdaemon.com/docs/defi-api-supported-protocols#supported-chains).
      - name: chainSymbol
        in: query
        required: false
        schema:
          type: string
          description: The abbreviated chain name for queries or transactions.
          example: ETH
        description: The abbreviated chain name for queries or transactions.
      - name: nftCollection
        in: query
        required: true
        schema:
          type: string
          description: The smart contract address of the NFT collection whose balance is to be retrieved.
          example: '0xBC4CA0EdA7647A8aB7C2061c2E118A18a936f13D'
        description: The smart contract address of the NFT collection whose balance is to be retrieved.
      - name: nftProtocolId
        in: query
        required: false
        schema:
          type: string
          description: Specifies the NFT standard to use for the query. Acceptable values are 721 for ERC-721 tokens and 1155 for ERC-1155 tokens. If not provided, the default value is 721
          example: '721'
        description: Specifies the NFT standard to use for the query. Acceptable values are 721 for ERC-721 tokens and 1155 for ERC-1155 tokens. If not provided, the default value is 721
      - name: startBlock
        in: query
        required: false
        schema:
          type: string
          description: Specifies the starting block number for the event log query. If not provided, the default value is set to 100 blocks prior to the latest finalized block, ensuring a recent historical range is returned.
          example: '100000'
        description: Specifies the starting block number for the event log query. If not provided, the default value is set to 100 blocks prior to the latest finalized block, ensuring a recent historical range is returned.
      - name: page
        in: query
        required: false
        schema:
          type: string
          description: Indicates the page number for paginated results. Defaults to '1' if no value is specified, allowing for easy navigation through large sets of log data.
          example: '1'
        description: Indicates the page number for paginated results. Defaults to '1' if no value is specified, allowing for easy navigation through large sets of log data.
      - name: endBlock
        in: query
        required: false
        schema:
          type: string
          description: Specifies the ending block number for the event log query. If omitted, the default is the latest finalized block, capturing all events up to the most recent block.
          example: '100010'
        description: Specifies the ending block number for the event log query. If omitted, the default is the latest finalized block, capturing all events up to the most recent block.
      - name: type
        in: query
        required: true
        schema:
          type: string
          description: Defines the event type to retrieve. For example, for ERC721 collections, valid values include 'Approval' or 'Transfer'. This parameter is required to filter the logs based on the specific event type of interest.
          enum:
          - Approval
          - Transfer
          example: Approval
        description: Defines the event type to retrieve. For example, for ERC721 collections, valid values include 'Approval' or 'Transfer'. This parameter is required to filter the logs based on the specific event type of interest.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: object
                example:
                  status: 200
                  msg: success
                  data:
                    logs:
                    - address: '0x08d7c0242953446436f34b4c78fe9da38c73668d'
                      topics:
                      - '0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef'
                      - '0x00000000000000000000000050d36f27872f637ec9ecb4eedff300df44a608ab'
                      - '0x000000000000000000000000fcbe7b6da18a08a86ab1beb68c7372a60ab4e331'
                      - '0x00000000000000000000000000000000000000000000000000000000000003d5'
                      params:
                        from: '0x50d36f27872f637ec9ecb4eedff300df44a608ab'
                        to: '0xfcbe7b6da18a08a86ab1beb68c7372a60ab4e331'
                        tokenId: '981'
                      data: 0x
                      blockNumber: '17147007'
                      blockHash: '0x0af8cae4fce3cabdad9dbcac77ba4761afea961c040817ea835260ea6d56703a'
                      timeStamp: '1682713763'
                      gasPrice: '35684114147'
                      gasUsed: '267808'
                      logIndex: '250'
                      transactionHash: '0x0eb9b987533eee819a1509b5e50691438d0de6f9c43b46973fdd2516eccefd97'
                      transactionIndex: '98'
      x-bd-cu: '100'
      x-bd-cu-type: fixed
      x-internal: false
