openapi: 3.2.0
info:
  version: 1.0.0
  title: Event Streaming Overview API
  description: Creates and manages config for event streams
  contact:
    name: Blockdaemon
    email: info@blockdaemon.com
    url: https://blockdaemon.com
  x-logo:
    url: https://storage.googleapis.com/blockdaemon-app-static-images/marketing/PNG/dark-logo.png
    altText: Blockdaemon logo
servers:
- url: https://svc.blockdaemon.com
security:
- bearerAuth: []
- apiKeyAuthHeader: []
tags:
- name: Overview
paths:
  /streaming/v2/:
    x-zuplo-path:
      pathMode: open-api
    get:
      tags:
      - Overview
      summary: List Supported Protocols and Networks
      description: Returns all supported protocols and networks with event matching details.
      operationId: getProtocolOverview
      parameters:
      - name: protocol
        in: query
        description: Filter results by protocol name (e.g., bitcoin)
        required: false
        schema:
          type: string
        example: bitcoin
      - name: network
        in: query
        description: Filter results by network name (e.g., mainnet)
        required: false
        schema:
          type: string
        example: mainnet
      responses:
        '200':
          description: Protocol overview response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProtocolOverview'
        '400':
          description: Returned when filtering on an unsupported protocol or network
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-zuplo-route:
        custom:
          product: ub_event_streaming
          fh: ubiquity
          target_service: stream-configurator
          billing_product: event-streaming
        corsPolicy: anything-goes
        handler:
          export: urlRewriteHandler
          module: $import(@zuplo/runtime)
          options:
            rewritePattern: service://bd-workloads-${context.custom.cluster}-k8s-cluster-aegis-stream-configurator-${env.UB_ENV}/
        policies:
          inbound:
          - event-streaming-default-policy
          outbound: []
      x-operation-id-source: normalized
      x-operation-id-original: get protocol overview
components:
  schemas:
    Error:
      type: object
      x-go-type: ApiError
      x-go-name: ApiError
      required:
      - message
      - type
      - code
      - status
      - timestamp
      properties:
        type:
          type: string
          description: HTTP error type
          example: bad-request
        code:
          type: integer
          description: Numeric error code
          example: 16384
        status:
          type: integer
          description: HTTP status of the error
          example: 500
        message:
          type: string
          description: Long error description
          example: Oops theres been an internal error handling
        timestamp:
          type: string
          description: Long error description
          example: Oops theres been an internal error handling
    InfoMatchVarType:
      type: object
      required:
      - variable_type
      - source
      properties:
        variable_type:
          type: string
        source:
          type: string
    ProtocolOverview:
      type: array
      items:
        $ref: '#/components/schemas/ProtocolOverviewInfo'
    ProtocolOverviewInfo:
      type: object
      required:
      - protocol
      - network
      - antlr_supported
      - match_variable_supported
      - match_variable_types
      properties:
        protocol:
          type: string
        network:
          type: string
        antlr_supported:
          type: boolean
        match_variable_supported:
          type: boolean
        match_variable_types:
          type: array
          items:
            $ref: '#/components/schemas/InfoMatchVarType'
  securitySchemes:
    apiKeyAuthHeader:
      type: apiKey
      in: header
      name: X-API-Key
      description: 'Unlock higher TPS - Create your own API key in the [Blockdaemon App](https://app.blockdaemon.com).

        '
      x-default: 2go1YqUcuAr4WZ2-3WgSD3c7qpatZqQuNWhTVBldKZnTSUtw
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Opaque
      description: '[Legacy Auth] Unlock higher TPS - Create your own API key in the [Blockdaemon App](https://app.blockdaemon.com).

        '
      x-default: 2go1YqUcuAr4WZ2-3WgSD3c7qpatZqQuNWhTVBldKZnTSUtw
