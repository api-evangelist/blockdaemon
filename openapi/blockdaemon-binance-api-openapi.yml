openapi: 3.2.0
info:
  version: 1.0.0
  title: Staking Binance API
  description: 'The Blockdaemon Staking API simplifies and streamlines institutional cryptocurrency staking. The API allows developers to interact with blockchain networks and perform various staking-related operations, such as delegating and undelegating tokens, in a single, unified interface.


    With the Staking API, you can quickly and easily build and deploy applications that automate staking activities and increase efficiency in your blockchain operations.'
  contact:
    name: Blockdaemon
    email: info@blockdaemon.com
    url: https://blockdaemon.com
  x-logo:
    url: https://assets-global.website-files.com/633c5e06513fa35f3391a5f9/645d33beb6fa65f6cfb95eb8_BD%20Logo%20Stack%20-%20Purple.svg
    backgroundColor: '#fafafa'
    altText: Blockdaemon logo
servers:
- url: https://svc.blockdaemon.com/boss
security:
- ApiKeyAuth: []
tags:
- name: Binance
  description: Binance endpoints
paths:
  /v1/binance/{network}/deactivatable-amount:
    parameters:
    - $ref: '#/components/parameters/BinanceNetwork'
    - $ref: '#/components/parameters/BinanceWallets'
    get:
      summary: Get Deactivatable Amount
      operationId: getBinanceDeactivatableAmount
      tags:
      - Binance
      description: 'Returns the total staked amount that can be deactivated across all wallets of the user.


        You can specify the optional `wallets` parameter to get the total deactivatable amount in specific wallets.'
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BinanceDeactivatableAmount'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - ApiKeyAuth: []
  /v1/binance/{network}/deactivation-intents:
    parameters:
    - $ref: '#/components/parameters/BinanceNetwork'
    post:
      summary: Post Deactivation Intent
      operationId: postBinanceDeactivationIntent
      tags:
      - Binance
      description: Create transaction to undelegate given amount of BNB from a validator.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewDeactivateIntentBinance'
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BinanceDeactivationIntentResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - ApiKeyAuth: []
    get:
      summary: Lists Deactivation Intents
      operationId: getBinanceDeactivationIntents
      tags:
      - Binance
      description: Retrieve a list of deactivation intents.
      responses:
        '200':
          description: Deactivation intents listed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeactivationIntents'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - ApiKeyAuth: []
  /v1/binance/{network}/restake-intents:
    parameters:
    - $ref: '#/components/parameters/BinanceNetwork'
    post:
      summary: Post restake Intent
      operationId: postBinanceRestakeIntent
      tags:
      - Binance
      description: Create transaction to move given amount of ATOMs from one validator to another.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewRestakeIntentBinance'
      responses:
        '201':
          $ref: '#/components/responses/RestakeIntent'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - ApiKeyAuth: []
    get:
      summary: Lists Restake Intents
      operationId: getBinanceRestakeIntents
      tags:
      - Binance
      description: List restake intents
      responses:
        '200':
          description: Restake intents listed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestakeIntents'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - ApiKeyAuth: []
  /v1/binance/{network}/stake-intents:
    parameters:
    - $ref: '#/components/parameters/BinanceNetwork'
    - $ref: '#/components/parameters/IdempotencyKey'
    post:
      summary: Post Stake Intent
      operationId: postBinanceStakeIntent
      tags:
      - Binance
      description: Blockdaemon reserves the right to free any allocated resources if the transaction is not confirmed in time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewStakeIntentBinance'
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BinanceStakeIntentResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/NoValidatorsError'
      security:
      - ApiKeyAuth: []
components:
  parameters:
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      description: the unique idempotency key for this request
      example: f1c971b4-7114-4c4b-8ad2-a6f9e33e2cd0
      schema:
        type: string
        format: uuid
      required: false
    BinanceWallets:
      name: wallets
      description: Array of Binance wallets
      in: query
      required: false
      schema:
        type: array
        items:
          $ref: '#/components/schemas/BinanceAccountAddress'
    BinanceNetwork:
      name: network
      in: path
      description: Binance network
      required: true
      schema:
        $ref: '#/components/schemas/BinanceNetwork'
  schemas:
    WalletAmount:
      type: object
      description: Amount per wallet
      required:
      - wallet
      - amount
      - validator
      properties:
        wallet:
          type: string
        amount:
          type: string
          pattern: ^[1-9]\d+$
        validator:
          type: string
    PlanId:
      type: string
      description: This feature enables you to stake to validators from the specified plan(s). When no plan id is specified, validators across all plans that match the API route will be available for staking. If it is a shared plan, you can to stake to validators on a shared node from the specified plan.
      example: plan_Wgx98Rbi8nQuL9ddn3mTk1
    BinanceNetwork:
      type: string
      description: Binance beacon chain network
      enum:
      - mainnet
      - testnet
    Network:
      type: string
      description: Protocol-specific network.
      enum:
      - mainnet
      - localnet
      - goerli
      - prater
      - hoodi
      - testnet
      - devnet
      - kusama
      - westend
      - preprod
      - fuji
      - local
    NewDeactivateIntentBinance:
      type: object
      description: Request object to create a new deactivation intent for Binance.
      required:
      - delegator_address
      - amount
      properties:
        delegator_address:
          $ref: '#/components/schemas/BinanceAccountAddress'
        amount:
          $ref: '#/components/schemas/BinanceJager'
        plan_id:
          $ref: '#/components/schemas/PlanId'
    UnsignedTransactionHash:
      type: string
      format: base64
      description: A generated transaction that is ready to sign.
      example: '120000007465737477616c6c65742e746573746e65740025150c44ecddfe779c2ca '
    SolanaNetwork:
      type: string
      description: Solana network
      enum:
      - mainnet
      - testnet
    NearAddress:
      type: string
      description: Base58 encoded public key or registered named account. [Accounts](https://docs.near.org/concepts/basics/accounts/account-id/).
      pattern: ^([a-km-zA-HJ-NP-Z1-9]{22,44})|((([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+)$
      example: alice.near
    DeactivateIntentNear:
      type: object
      description: NEAR Protocol Deactivate Intent
      required:
      - to
      - unsigned_transaction
      - unsigned_transaction_hash
      - amount
      - wallet_address
      - public_key
      - expiration_time
      properties:
        to:
          $ref: '#/components/schemas/NearAddress'
        unsigned_transaction:
          $ref: '#/components/schemas/UnsignedTransaction'
        unsigned_transaction_hash:
          $ref: '#/components/schemas/UnsignedTransactionHash'
        amount:
          $ref: '#/components/schemas/NearYocto'
        wallet_address:
          $ref: '#/components/schemas/NearAddress'
        public_key:
          $ref: '#/components/schemas/NearPublicKey'
        expiration_time:
          $ref: '#/components/schemas/ExpirationTime'
    DeactivateIntentBinance:
      type: object
      description: Binance Deactivate Intent
      required:
      - unsigned_transaction
      - delegator_address
      - validator_address
      - amount
      properties:
        unsigned_transaction:
          $ref: '#/components/schemas/UnsignedTransaction'
        delegator_address:
          $ref: '#/components/schemas/BinanceAccountAddress'
        validator_address:
          $ref: '#/components/schemas/BinanceValidatorAddress'
        amount:
          $ref: '#/components/schemas/BinanceJager'
    DeactivateIntentCosmos:
      type: object
      description: Cosmos Deactivate Intent
      required:
      - unsigned_transaction
      - delegator_address
      - validator_address
      - amount
      properties:
        unsigned_transaction:
          $ref: '#/components/schemas/UnsignedTransaction'
        delegator_address:
          $ref: '#/components/schemas/CosmosAccountAddress'
        validator_address:
          $ref: '#/components/schemas/CosmosAccountAddress'
        amount:
          $ref: '#/components/schemas/CosmosUatom'
        hex_transaction:
          $ref: '#/components/schemas/ProcessedComosTransaction'
    DeactivateIntentId:
      type: string
      format: uuid
      description: Unique idenifier for deactivate intent.
      example: 4ba06e89-8c29-483e-ac36-318de5aa7364
    EthereumAddress:
      type: string
      description: Hex-encoded Ethereum [account or smart contract address](https://ethereum.org/en/developers/docs/accounts/).
      format: hex
      pattern: ^0x[a-fA-F0-9]{40}$
      example: '0x00000000219ab540356cBB839Cbe05303d7705Fa'
    DeactivationIntents:
      type: object
      description: Deactivation intents
      required:
      - protocol
      - network
      - customer_id
      properties:
        protocol:
          $ref: '#/components/schemas/Protocol'
        network:
          $ref: '#/components/schemas/Network'
        polygon:
          $ref: '#/components/schemas/DeactivationIntentsPolygon'
        solana:
          $ref: '#/components/schemas/DeactivationIntentsSolana'
        near:
          $ref: '#/components/schemas/DeactivationIntentsNear'
        cardano:
          $ref: '#/components/schemas/DeactivationIntentsCardano'
        cosmos:
          $ref: '#/components/schemas/DeactivationIntentsCosmos'
        binance:
          $ref: '#/components/schemas/DeactivationIntentsBinance'
        customer_id:
          $ref: '#/components/schemas/CustomerId'
    Lamport:
      type: string
      description: Denomination of the cryptocurrency Solana.
      pattern: ^[1-9]\d+$
      example: '100'
    ExpirationTime:
      type: integer
      description: Transaction expiration time
      format: int64
      example: 1689939023
    NearPublicKey:
      type: string
      description: Base58 encoded public key prefixed by ed25519, associated with the private key that will be used to sign the transaction.
      example: ed25519:Cxg2wgFYrdLTEkMu6j5D6aEZqTb3kXbmJygS48ZKbo1S
      pattern: ^ed25519:[a-km-zA-HJ-NP-Z1-9]{22,44}$
    SplitStakeSolana:
      type: object
      description: Result of the split transaction request
      required:
      - unsigned_transaction
      - stake_account_authority
      - new_stake_account_address
      - new_stake_id
      - splitted_stake_account_address
      - splitted_stake_id
      - amount
      properties:
        unsigned_transaction:
          $ref: '#/components/schemas/UnsignedTransaction'
        stake_account_authority:
          $ref: '#/components/schemas/SolanaPublicKey'
        new_stake_account_address:
          $ref: '#/components/schemas/SolanaPublicKey'
        new_stake_id:
          $ref: '#/components/schemas/StakeId'
        splitted_stake_account_address:
          $ref: '#/components/schemas/SolanaPublicKey'
        splitted_stake_id:
          $ref: '#/components/schemas/StakeId'
        amount:
          $ref: '#/components/schemas/Lamport'
    RestakeIntentCosmos:
      type: object
      description: Cosmos Restake Intent
      required:
      - unsigned_transaction
      - delegator_address
      - old_validator_address
      - new_validator_address
      - amount
      properties:
        unsigned_transaction:
          $ref: '#/components/schemas/UnsignedTransaction'
        delegator_address:
          $ref: '#/components/schemas/CosmosAccountAddress'
        old_validator_address:
          $ref: '#/components/schemas/CosmosAccountAddress'
        new_validator_address:
          $ref: '#/components/schemas/CosmosAccountAddress'
        amount:
          $ref: '#/components/schemas/CosmosUatom'
        hex_transaction:
          $ref: '#/components/schemas/ProcessedComosTransaction'
    BinanceProtocol:
      type: string
      description: Binance beacon chain protocol
      enum:
      - binance
    NewRestakeIntentBinance:
      type: object
      description: Request object to create a new restake intent for Binance.
      required:
      - delegator_address
      - old_validator_address
      - amount
      properties:
        delegator_address:
          $ref: '#/components/schemas/BinanceAccountAddress'
        old_validator_address:
          $ref: '#/components/schemas/BinanceValidatorAddress'
        amount:
          $ref: '#/components/schemas/BinanceJager'
        plan_id:
          $ref: '#/components/schemas/PlanId'
    CosmosProtocol:
      type: string
      description: Cosmos protocol
      enum:
      - cosmos
    SolanaDeactivationIntentResponse:
      allOf:
      - $ref: '#/components/schemas/CommonDeactivationResponse'
      - type: object
        description: Response to a new deactivation intent request.
        required:
        - network
        - protocol
        - solana
        properties:
          protocol:
            $ref: '#/components/schemas/SolanaProtocol'
          network:
            $ref: '#/components/schemas/SolanaNetwork'
          solana:
            $ref: '#/components/schemas/DeactivateIntentSolana'
    NearNetwork:
      type: string
      description: NEAR network
      enum:
      - mainnet
      - testnet
      - localnet
    CosmosRestakeIntentResponse:
      allOf:
      - $ref: '#/components/schemas/CommonRestakeResponse'
      - type: object
        description: Response to a new restake intent request.
        required:
        - protocol
        - network
        - cosmos
        properties:
          protocol:
            $ref: '#/components/schemas/CosmosProtocol'
          network:
            $ref: '#/components/schemas/CosmosNetwork'
          cosmos:
            $ref: '#/components/schemas/RestakeIntentCosmos'
    RestakeIntentsBinance:
      type: array
      description: List of restake intents
      items:
        $ref: '#/components/schemas/BinanceRestakeIntentResponse'
    SolanaProtocol:
      type: string
      description: Solana protocol
      enum:
      - solana
    StakeIntentId:
      type: string
      format: base58
      description: Unique idenifier for a group of stakes.
      example: stake_intent_Wgx98Rbi8nQuL9ddn3mTk1
    RestakeIntents:
      type: object
      description: Restake intents
      required:
      - protocol
      - network
      - customer_id
      properties:
        protocol:
          $ref: '#/components/schemas/Protocol'
        network:
          $ref: '#/components/schemas/Network'
        cosmos:
          $ref: '#/components/schemas/RestakeIntentsCosmos'
        binance:
          $ref: '#/components/schemas/RestakeIntentsBinance'
        customer_id:
          $ref: '#/components/schemas/CustomerId'
    CommonDeactivationResponse:
      type: object
      required:
      - deactivate_intent_id
      - customer_id
      properties:
        deactivate_intent_id:
          $ref: '#/components/schemas/DeactivateIntentId'
        customer_id:
          $ref: '#/components/schemas/CustomerId'
    CustomerId:
      type: string
      description: Unique identifier for a customer
      example: SatoshiNakamoto-xUYJbPw9hw
      minimum: 1
    BinanceAccountAddress:
      type: string
      description: Binance beacon chain address.
      format: bech32
      pattern: ^bnb[0-9a-z]+$
      example: bnb13ym5szfmwh0wz9j8wr2lu2gaml94h895u9el2e
    DeactivationIntentsNear:
      type: array
      description: List of deactivation intents
      items:
        $ref: '#/components/schemas/NearDeactivationIntentResponse'
    BinanceDeactivatableAmount:
      type: object
      description: The deactivatable amount
      required:
      - protocol
      - network
      - amount
      - currency
      properties:
        protocol:
          $ref: '#/components/schemas/BinanceProtocol'
        network:
          $ref: '#/components/schemas/BinanceNetwork'
        currency:
          $ref: '#/components/schemas/BinanceJager'
        amount:
          type: string
          pattern: ^[1-9]\d+$
          example: '123456'
        wallets:
          type: array
          items:
            $ref: '#/components/schemas/WalletAmount'
    Protocol:
      type: string
      description: Blockchain protocol.
      enum:
      - ethereum
      - polkadot
      - solana
      - cosmos
      - polygon
      - near
      - cardano
      - avalanche
      - binance
    CommonStakeIntentResponse:
      type: object
      required:
      - stake_intent_id
      - customer_id
      properties:
        stake_intent_id:
          $ref: '#/components/schemas/StakeIntentId'
        customer_id:
          $ref: '#/components/schemas/CustomerId'
        plan_id:
          $ref: '#/components/schemas/PlanId'
    Unbond:
      type: object
      description: Unbond information
      required:
      - nonce
      - amount
      - withdraw_epoch
      properties:
        nonce:
          $ref: '#/components/schemas/Nonce'
        amount:
          $ref: '#/components/schemas/Wei'
        withdraw_epoch:
          type: integer
    ProcessedComosTransaction:
      type: object
      description: Returns back the transactionHash and unsignedTxHex for signing purposes
      required:
      - transactionHash
      - unsignedTxHex
      properties:
        transaction_hash:
          type: string
          description: The SHA-256 hash of the signable transaction in hexadecimal format.
          example: BD2B84693A0AE959C63A8D4D1F77125449312EED64E53C654D2D7F07E4592BAE
        unsigned_transaction_hex:
          type: string
          description: The original unsigned transaction encoded in hexadecimal format.
          example: APOENA93A0AE959C63A8D4D1F77125449312EED64E53C654D2D7F07E4592BAAF
    CommonRestakeResponse:
      type: object
      required:
      - restake_intent_id
      - customer_id
      properties:
        restake_intent_id:
          $ref: '#/components/schemas/RestakeIntentId'
        customer_id:
          $ref: '#/components/schemas/CustomerId'
    DeactivationIntentsCosmos:
      type: array
      description: List of deactivation intents
      items:
        $ref: '#/components/schemas/CosmosDeactivationIntentResponse'
    Error:
      type: object
      description: Error response envelope
      required:
      - code
      - message
      properties:
        code:
          type: integer
          format: int32
          description: Error code
          example: 500
        message:
          type: string
          description: Error Message
          example: A descriptive error message
    BinanceRestakeIntentResponse:
      allOf:
      - $ref: '#/components/schemas/CommonRestakeResponse'
      - type: object
        description: Response to a new restake intent request.
        required:
        - protocol
        - network
        - binance
        properties:
          protocol:
            $ref: '#/components/schemas/BinanceProtocol'
          network:
            $ref: '#/components/schemas/BinanceNetwork'
          binance:
            $ref: '#/components/schemas/RestakeIntentBinance'
    CosmosNetwork:
      type: string
      description: Cosmos network
      enum:
      - mainnet
      - testnet
    RestakeIntent:
      allOf:
      - $ref: '#/components/schemas/CommonRestakeResponse'
      - type: object
        description: Request object to create a new restake intent.
        required:
        - protocol
        - network
        properties:
          protocol:
            $ref: '#/components/schemas/Protocol'
          network:
            $ref: '#/components/schemas/Network'
          cosmos:
            $ref: '#/components/schemas/RestakeIntentCosmos'
          binance:
            $ref: '#/components/schemas/RestakeIntentBinance'
    DeactivationIntentsPolygon:
      type: object
      required:
      - items
      - wallet_address
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Unbond'
        wallet_address:
          $ref: '#/components/schemas/EthereumAddress'
    BinanceStakeIntentResponse:
      allOf:
      - $ref: '#/components/schemas/CommonStakeIntentResponse'
      - type: object
        required:
        - protocol
        - network
        - binance
        properties:
          protocol:
            $ref: '#/components/schemas/BinanceProtocol'
          network:
            $ref: '#/components/schemas/BinanceNetwork'
          binance:
            $ref: '#/components/schemas/StakeIntentBinance'
    DeactivateIntentSolana:
      type: object
      description: Result of the new Deactivate Intent request.
      required:
      - total_deactivated_amount
      - deactivates
      - splits
      properties:
        deactivates:
          type: array
          items:
            $ref: '#/components/schemas/DeactivateStakeSolana'
        splits:
          type: array
          items:
            $ref: '#/components/schemas/SplitStakeSolana'
        total_deactivated_amount:
          $ref: '#/components/schemas/Lamport'
    Wei:
      type: string
      description: Denomination of the cryptocurrency Polygon.
      pattern: ^[1-9]\d+$
      example: '100'
    NearProtocol:
      type: string
      description: Near protocol
      enum:
      - near
    RestakeIntentId:
      type: string
      format: uuid
      description: Unique idenifier for a restake intent.
      example: 4ba06e89-8c29-483e-ac36-318de5aa7364
    UnsignedTransaction:
      type: string
      format: base64
      description: Generated unsigned transaction smart contract call data.
      example: '

        '
    BinanceDeactivationIntentResponse:
      allOf:
      - $ref: '#/components/schemas/CommonDeactivationResponse'
      - type: object
        description: Response to a new deactivation intent request.
        required:
        - protocol
        - network
        - binance
        properties:
          protocol:
            $ref: '#/components/schemas/BinanceProtocol'
          network:
            $ref: '#/components/schemas/BinanceNetwork'
          binance:
            $ref: '#/components/schemas/DeactivateIntentBinance'
    CardanoBaseAddress:
      type: string
      description: bech32 encoded base address. [Accounts](https://cips.cardano.org/cips/cip19/).
      format: bech32
      example: addr1vpu5vlrf4xkxv2qpwngf6cjhtw542ayty80v8dyr49rf5eg0yu80w
    UnauthorizedError:
      type: object
      description: Error response envelope
      required:
      - code
      - message
      properties:
        code:
          type: integer
          format: int32
          description: Error code
          example: 401
        message:
          type: string
          description: Error Message
          example: A human-readable diagnostic message detailing any authorization failure
    CosmosDeactivationIntentResponse:
      allOf:
      - $ref: '#/components/schemas/CommonDeactivationResponse'
      - type: object
        description: Response to a new deactivation intent request.
        required:
        - protocol
        - network
        - cosmos
        properties:
          protocol:
            $ref: '#/components/schemas/CosmosProtocol'
          network:
            $ref: '#/components/schemas/CosmosNetwork'
          cosmos:
            $ref: '#/components/schemas/DeactivateIntentCosmos'
    DeactivationIntentsSolana:
      description: List of deactivation intents
      type: array
      items:
        $ref: '#/components/schemas/SolanaDeactivationIntentResponse'
    CosmosUatom:
      type: string
      description: Denomination of the cryptocurrency Cosmos.
      pattern: ^[1-9]\d+$
      example: '100'
    DeactivationIntentsCardano:
      type: array
      description: List of deactivation intents
      items:
        type: object
        description: Cardano Protocol Deactivate Intent
        required:
        - deactivate_intent_id
        - base_address
        - unsigned_transaction
        properties:
          deactivate_intent_id:
