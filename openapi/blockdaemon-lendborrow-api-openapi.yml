        > 💡

        **Compute Unit Value:** `115` (Fixed)'
      operationId: lendborrowAllow
      requestBody:
        required: true
        description: The request body for a /defi/v1/lendborrow/allow
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/_lendborrow_allow_Request'
            example:
              lendborrowId: '1300'
              manager: '0xc3d688B66703497DAA19211EEdff47f25384cdc3'
              isAllowed: false
              from: '0xdAe2F6EdDdA6fb4fb60cc02633DE27e2b431B402'
