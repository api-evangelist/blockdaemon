      summary: Bundle Actions
      description: 'Combine multiple lending and borrowing operations into one atomic blockchain transaction. This endpoint bundles several protocol actions—each defined by its specific call data—so that they all execute together (or not at all). The approach improves gas efficiency and minimizes the risk of partial execution, making it ideal for complex, multi-step transactions.


        > 💡

        **Compute Unit Value:** `45` (Fixed)'
      operationId: lendborrowBundleactions
      requestBody:
        required: true
        description: The request body for a /defi/v1/lendborrow/bundleactions
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/_lendborrow_bundleactions_Request'
            example:
              lendborrowId: '1300'
              actions: ACTION_SUPPLY_NATIVE_TOKEN
              data: '0x40e53eb7000000000000000000000000000000000000000000000000000000000016e360'
