      operationId: chainRegistercoin
      requestBody:
        required: true
        description: The request body for a /defi/v1/chain/registercoin
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/_chain_registercoin_Request'
            example:
              chainId: '1401'
              chainSymbol: ETH
              from: '0xdAe2F6EdDdA6fb4fb60cc02633DE27e2b431B402'
              tokenAddress: '0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48'
