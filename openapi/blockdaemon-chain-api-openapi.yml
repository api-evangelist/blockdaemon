        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: object
                example:
                  status: 200
                  msg: success
                  data:
                    chainId: '1400'
                    from: '0x1c3266eca38df87026255884192b5979eac24cf0dac7a33cfa7af0d27651fb4c'
                    to: '0x1c3266eca38df87026255884192b5979eac24cf0dac7a33cfa7af0d27651fb4c'
                    data: ''
