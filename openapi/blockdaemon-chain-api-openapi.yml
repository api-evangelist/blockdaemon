openapi: 3.2.0
info:
  contact:
    name: Blockdaemon
    email: info@blockdaemon.com
  description: The Blockdaemon DeFi API provides a single interface to a multitude of DeFi projects and blockchains
  title: Blockdaemon DeFi Chain API
  version: 1.0.0
  x-logo:
    altText: Blockdaemon logo
    backgroundColor: '#fafafa'
    url: https://storage.googleapis.com/blockdaemon-app-static-images/marketing/PNG/dark-logo.png
servers:
- url: https://svc.blockdaemon.com
security:
- ApiKeyAuth: []
tags:
- name: Chain
  description: API endpoints for fetching information about blockchains
paths:
  /defi/v1/chain/createaccount:
    post:
      tags:
      - Chain
      summary: Create Account
      description: 'Creates a new blockchain account by funding it with an initial transaction, using the recipient’s public key as the account identifier. The response includes details like chain ID, funding source, gas usage, and transaction data, enabling immediate activation and interaction on the network.


        > 💡

        **Compute Unit Value:** `40` (Fixed)'
      operationId: chainCreateaccount
      requestBody:
        required: true
        description: The request body for a /defi/v1/chain/createaccount
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/_chain_createaccount_Request'
            example:
              chainId: '1500'
              chainSymbol: ETH
              from: '0xdAe2F6EdDdA6fb4fb60cc02633DE27e2b431B402'
              to: '0xdAe2F6EdDdA6fb4fb60cc02633DE27e2b431B402'
              amount: '1000000000000000000'
              destinationTag: '10'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: object
                example:
                  status: 200
                  msg: success
                  data:
                    chainId: '1500'
                    from: GARNHXH36IUZE4F5MON5XBQX37OGVFGCOPOPN7CPQL3TP7VX2XI35QUJ
                    gas: '100'
                    data: AAAAAgAAAAAi09z78imScL1jm9uGF9/capTCc9z2/E+C9zf+t9XRvgAAAGQDC8UiAAAACAAAAAEAAAAAAAAAAAAAAABmfTp1AAAAAAAAAAEAAAAAAAAAAAAAAADQuA91G4JBImyPV1qVbcQQO5ZLoAbUUpgWDTv3XKqezQAAAAAATEtAAAAAAAAAAAA=
      x-bd-cu: '40'
      x-bd-cu-type: fixed
      x-internal: false
  /defi/v1/chain/createfeetransaction:
    post:
      tags:
      - Chain
      summary: Create Fee Transaction
      description: 'Initiates a fee-collection transaction on the blockchain, deducting a default or customizable basis-point fee from the sender. The response returns chain ID, addresses, gas limits, and nonce, ensuring proper verification of fee deductions and transfers.


        > 💡

        **Compute Unit Value:** `5` (Fixed)'
      operationId: chainCreatefeetransaction
      requestBody:
        required: true
        description: The request body for a /defi/v1/chain/createfeetransaction
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/_chain_createfeetransaction_Request'
            example:
              chainId: '1'
              chainSymbol: ETH
              from: '0xdAe2F6EdDdA6fb4fb60cc02633DE27e2b431B402'
              to: '0xdAe2F6EdDdA6fb4fb60cc02633DE27e2b431B402'
              gas: '100000'
              value: '10'
              data: '0x40e53eb7000000000000000000000000000000000000000000000000000000000016e360'
              gasPrice: '10000'
              referenceId: 8eec8150896e4fdaa26d4d1a1338d676
              simulate: false
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: number
                  msg:
                    type: string
                  data:
                    type: object
                    properties:
                      chainId:
                        type: string
                      from:
                        type: string
                      to:
                        type: string
                      value:
                        type: string
                      gas:
                        type: string
                      gasPrice:
                        type: string
                    required:
                    - chainId
                    - from
                    - to
                    - value
                    - gasPrice
                example:
                  status: 200
                  msg: success
                  data:
                    chainId: '1'
                    from: '0xDdE53141420C90550e87dF0349D79B3a6161f6F6'
                    to: '0x558D7be6092Ca91DA26521Ac25b982D883218E2d'
                    value: '15961584451717'
                    gas: '30000'
                    nonce: 87
      x-bd-cu: '5'
      x-bd-cu-type: fixed
      x-internal: false
  /defi/v1/chain/decodetransaction:
    post:
      tags:
      - Chain
      summary: Decode Transaction
      description: 'Decodes a raw, signed transaction into a human-readable format, revealing fields like nonce, gas price, recipient, value, and signature components. This helps developers and users audit or debug transactions by highlighting asset changes (sender, receiver, and transferred amount).


        > 💡

        **Compute Unit Value:** `45` (Fixed)'
      operationId: chainDecodetransaction
      requestBody:
        required: true
        description: The request body for a /defi/v1/chain/decodetransaction
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/_chain_decodetransaction_Request'
            example:
              chainId: '1'
              chainSymbol: ETH
              rawTransaction: '0xf86f048433918fbe830493e0949b79d6dfe4650d70f35dbb80f7d1ec0cf7f823fd87038d7ea4c6800084022794382da0c9bd6b5c7e18a258b04039d524a3e1382ec0f522d160dc027428933f520b6868a07332736f1df297842299230820626f1fc5b8d4cdd602ade55e3ba02c63e756ce'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: object
                example:
                  status: 200
                  msg: success
                  data:
                    parsedTx:
                      nonce: 0
                      gasPrice:
                        type: BigNumber
                        hex: '0x09c9919d87'
                      gasLimit:
                        type: BigNumber
                        hex: '0x0a4a11'
                      to: '0xa67E9B68c41b0f26184D64C26e0b2B81466E5994'
                      value:
                        type: BigNumber
                        hex: '0x01'
                      data: 0x
                      chainId: 1
                      v: 37
                      r: '0x7542477f2599acdda95c37ff0492bd0ac656687780033807e0434ccf69bd4015'
                      s: '0x05f33bf2cde8001f51b46e18db78049b4509b824f09dccb45b4dbb9087d17049'
                      from: '0xa2e73C17F437688946993F683930E3Fd42Dd4F8C'
                      hash: '0x5c3ef8d1720f481a6dbeb58f4d6cb404f9e2b6f31ba52ba5c8df48142b9e2ad3'
                      type: null
                    assetChanges:
                      from: '0xa2e73C17F437688946993F683930E3Fd42Dd4F8C'
                      to: '0xa67E9B68c41b0f26184D64C26e0b2B81466E5994'
                      value:
                        type: BigNumber
                        hex: '0x01'
      x-bd-cu: '45'
      x-bd-cu-type: fixed
      x-internal: false
  /defi/v1/chain/estimategas:
    post:
      tags:
      - Chain
      summary: Estimate Gas
      description: 'Estimates the gas required for a proposed transaction on EVM-compatible chains by simulating its execution. The response provides an approximate gas limit, helping developers set optimal fees and avoid underfunding errors.


        > 💡

        **Compute Unit Value:** `30` (Fixed)'
      operationId: chainEstimategas
      requestBody:
        required: true
        description: The request body for a /defi/v1/chain/estimategas
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/_chain_estimategas_Request'
            example:
              chainId: '1'
              chainSymbol: ETH
              data: '0x40e53eb7000000000000000000000000000000000000000000000000000000000016e360'
              from: '0xdAe2F6EdDdA6fb4fb60cc02633DE27e2b431B402'
              to: '0xdAe2F6EdDdA6fb4fb60cc02633DE27e2b431B402'
              value: '10'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: object
                example:
                  status: 200
                  msg: success
                  data:
                    estimatedGas: '153222'
      x-bd-cu: '30'
      x-bd-cu-type: fixed
      x-internal: false
  /defi/v1/chain/genericsmartcontractmethod:
    post:
      tags:
      - Chain
      summary: Generic Smart Contract Method
      description: 'Executes read-only (view) functions on verified smart contracts, enabling queries like token balances or exchange rates without gas costs. The result includes on-chain data returned by the invoked function, facilitating up-to-date insights for decentralized applications.


        > 💡

        **Compute Unit Value:** `40` (Fixed)'
      operationId: chainGenericsmartcontractmethod
      requestBody:
        required: true
        description: The request body for a /defi/v1/chain/genericsmartcontractmethod
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/_chain_genericsmartcontractmethod_Request'
            example:
              chainId: '1'
              chainSymbol: ETH
              contractAddress: '0xfad57d2039c21811c8f2b5d5b65308aa99d31559'
              parameters: '4515444785'
              abi: ''
              methodName: getAmountsIn
              blockNumber: '100000'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: object
                example:
                  status: 200
                  msg: success
                  data:
                    getAmountsIn:
                    - '2425265'
                    - '4515444785'
      x-bd-cu: '40'
      x-bd-cu-type: fixed
      x-internal: false
  /defi/v1/chain/getapprovaldata:
    get:
      tags:
      - Chain
      summary: Get Approval Data
      description: 'Retrieves token approval allowances granted by a specified address, listing spender addresses, token symbols, and allowed amounts. It also provides risk factors and value-at-risk metrics, aiding in auditing permissions and managing DeFi exposures.


        > 💡

        **Compute Unit Value:** `75` (Fixed)'
      operationId: chainGetapprovaldata
      parameters:
      - name: address
        in: query
        required: true
        schema:
          type: string
          description: The public address of the user to retrieve approval data for.
          example: '0xdAe2F6EdDdA6fb4fb60cc02633DE27e2b431B402'
        description: The public address of the user to retrieve approval data for.
      - name: chainId
        in: query
        required: false
        schema:
          type: string
          description: The unique ID to direct queries or transactions to the correct blockchain. Find more [here](https://docs.blockdaemon.com/docs/defi-api-supported-protocols#supported-chains).
          enum:
          - '1'
          - '137'
          - '56'
          - '43114'
          - '25'
          - '42161'
          - '10'
          - '8453'
          - '250'
          example: '1'
        description: The unique ID to direct queries or transactions to the correct blockchain. Find more [here](https://docs.blockdaemon.com/docs/defi-api-supported-protocols#supported-chains).
      - name: chainSymbol
        in: query
        required: false
        schema:
          type: string
          description: The abbreviated chain name for queries or transactions.
          example: ETH
        description: The abbreviated chain name for queries or transactions.
      - name: pageToken
        in: query
        required: false
        schema:
          type: string
          description: The cursor used to fetch the next page of results.
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..y7FANxpXgtdgk83CIqPHHk2jutj1NZrueTu4XR39jnk
        description: The cursor used to fetch the next page of results.
      - name: vsCurrencies
        in: query
        required: false
        schema:
          type: string
          description: A comma-separated list of currency symbols to convert the amount into, such as 'USD,EUR'. This parameter is optional and allows retrieving values in multiple fiat currencies.
          example: usd,eur,gbp
        description: A comma-separated list of currency symbols to convert the amount into, such as 'USD,EUR'. This parameter is optional and allows retrieving values in multiple fiat currencies.
