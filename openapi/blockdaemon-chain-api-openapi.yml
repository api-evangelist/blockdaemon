components:
  schemas:
    _chain_createaccount_Request:
      type: object
      properties:
        chainId:
          type: string
          description: The unique ID to direct queries or transactions to the correct blockchain. Find more [here](https://docs.blockdaemon.com/docs/defi-api-supported-protocols#supported-chains).
          enum:
          - '1500'
          - '1501'
          - '1600'
          - '1601'
          example: '1500'
        chainSymbol:
          type: string
          description: The abbreviated chain name for queries or transactions.
          example: ETH
        from:
          type: string
          description: Public blockchain address of the sender initiating the transaction. Format depends on the chain (e.g., 0xABCDEF... for EVM, G... for Stellar).
          example: '0xdAe2F6EdDdA6fb4fb60cc02633DE27e2b431B402'
        to:
          type: string
          description: Public blockchain address of the recipient. Format depends on the chain (e.g., 0xABCDEF... for EVM, G... for Stellar).
          example: '0xdAe2F6EdDdA6fb4fb60cc02633DE27e2b431B402'
        amount:
          type: string
          description: 'Amount of native asset in the chain''s smallest denomination (base units). Do not send human-readable decimal values. Examples: 1 ETH (wei) = "1000000000000000000"; 1 XLM (stroops) = "10000000".'
          example: '1000000000000000000'
        destinationTag:
          type: string
          description: Optional tag for identifying the recipient's account on the XRPLedger.
          example: '10'
      required:
      - from
      - to
      - amount
      description: The request body for a /defi/v1/chain/createaccount
      example:
        chainId: '1500'
        chainSymbol: ETH
        from: '0xdAe2F6EdDdA6fb4fb60cc02633DE27e2b431B402'
        to: '0xdAe2F6EdDdA6fb4fb60cc02633DE27e2b431B402'
        amount: '1000000000000000000'
        destinationTag: '10'
