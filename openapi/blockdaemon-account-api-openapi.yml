openapi: 3.2.0
info:
  contact:
    name: Blockdaemon
    email: info@blockdaemon.com
  description: The Blockdaemon DeFi API provides a single interface to a multitude of DeFi projects and blockchains
  title: Blockdaemon DeFi Account API
  version: 1.0.0
  x-logo:
    altText: Blockdaemon logo
    backgroundColor: '#fafafa'
    url: https://storage.googleapis.com/blockdaemon-app-static-images/marketing/PNG/dark-logo.png
servers:
- url: https://svc.blockdaemon.com
security:
- ApiKeyAuth: []
tags:
- name: Account
  description: API endpoints for fetching information about account
paths:
  /account/v1/allowance:
    get:
      tags:
      - Account
      summary: Get User Allowance
      description: '!Beta


        Retrieves the approved allowance for a specific ERC-20 token, indicating how many tokens a designated spender is authorized to withdraw from an owner’s wallet. It is especially useful for verifying spending limits before initiating transactions, ensuring that decentralized applications or swap interfaces can confirm the available allowance for token transfers.


        > 💡

        **Compute Unit Value:** `60` (Fixed)'
      operationId: accountV1Allowance
      parameters:
      - name: tokenAddress
        in: query
        required: true
        schema:
          type: string
          description: Address of the token whose allowance is being queried.
          example: '0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48'
        description: Address of the token whose allowance is being queried.
      - name: owner
        in: query
        required: true
        schema:
          type: string
          description: Public address of the owner of the tokens.
          example: '0xdAe2F6EdDdA6fb4fb60cc02633DE27e2b431B402'
        description: Public address of the owner of the tokens.
      - name: spender
        in: query
        required: true
        schema:
          type: string
          description: Public address of the spender authorized to withdraw tokens on the owner's behalf.
          example: '0x7a250d5630B4cF539739dF2C5dAcb4c659F2488D'
        description: Public address of the spender authorized to withdraw tokens on the owner's behalf.
      - name: chainId
        in: query
        required: false
        schema:
          type: string
          description: The unique ID to direct queries or transactions to the correct blockchain. Find more [here](https://docs.blockdaemon.com/docs/defi-api-supported-protocols#supported-chains).
          enum:
          - '1'
          - '56'
          - '43114'
          - '137'
          - '250'
          - '10'
          - '11155420'
          - '42161'
          - '421614'
          - '25'
          - '338'
          - '84532'
          - '8453'
          - '43113'
          - '97'
          - '80002'
          - '300'
          - '324'
          - '5000'
          - '5003'
          - '8217'
          - '1001'
          example: '1'
        description: The unique ID to direct queries or transactions to the correct blockchain. Find more [here](https://docs.blockdaemon.com/docs/defi-api-supported-protocols#supported-chains).
      - name: chainSymbol
        in: query
        required: false
        schema:
          type: string
          description: The abbreviated chain name for queries or transactions.
          example: ETH
        description: The abbreviated chain name for queries or transactions.
      - name: vsCurrencies
        in: query
        required: false
        schema:
          type: string
          description: A comma-separated list of currency symbols to convert the amount into, such as 'USD,EUR'. This parameter is optional and allows retrieving values in multiple fiat currencies.
          example: usd,eur,gbp
        description: A comma-separated list of currency symbols to convert the amount into, such as 'USD,EUR'. This parameter is optional and allows retrieving values in multiple fiat currencies.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: number
                    description: Numeric status code indicating success or failure of the API call
                    example: 200
                  msg:
                    type: string
                    description: Human-readable message describing the API result or error
                  data:
                    type: object
                    properties:
                      allowance:
                        type: string
                        description: Amount a spender is allowed to withdraw from an owner
                example:
                  status: 200
                  msg: success
                  data:
                    allowance: '999999999900000'
                    prices:
                      usd:
                      - TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t: '1.0004708182757556'
      x-bd-cu: '60'
      x-bd-cu-type: fixed
      x-internal: false
  /account/v1/portfolio:
    get:
      tags:
      - Account
      summary: Get User Portfolio
      description: '!Beta


        Provides a snapshot of a wallet’s asset portfolio across supported blockchains, including native tokens and detailed EVM token information. Each token entry includes metadata (name, symbol, decimals, contract address, balance, USD valuation) and optional filtering to hide zero balances, simplifying portfolio management.


        > 💡

        **Compute Unit Value:** `95` (Fixed)'
      operationId: accountV1Portfolio
      parameters:
      - name: chainId
        in: query
        required: false
        schema:
          type: string
          description: The unique ID to direct queries or transactions to the correct blockchain. Find more [here](https://docs.blockdaemon.com/docs/defi-api-supported-protocols#supported-chains).
          enum:
          - '1'
          - '8217'
          - '56'
          - '25'
          - '43114'
          - '900'
          - '901'
          - '1200'
          - '42161'
          - '10'
          - '1600'
          - '1601'
          - '1700'
          - '1701'
          - osmosis-1
          - osmo-test-5
          - '137'
          - '250'
          - '8453'
          - '1100'
          - '1500'
          - '1501'
          example: '1'
        description: The unique ID to direct queries or transactions to the correct blockchain. Find more [here](https://docs.blockdaemon.com/docs/defi-api-supported-protocols#supported-chains).
      - name: chainSymbol
        in: query
        required: false
        schema:
          type: string
          description: The abbreviated chain name for queries or transactions.
          example: ETH
        description: The abbreviated chain name for queries or transactions.
      - name: address
        in: query
        required: true
        schema:
          type: string
          description: Public address of the user.
          example: '0xdAe2F6EdDdA6fb4fb60cc02633DE27e2b431B402'
        description: Public address of the user.
      - name: tokens
        in: query
        required: false
        schema:
          type: string
          description: Comma-separated values of ERC-20 tokens to retrieve the value of. Maximum 10 at a time.
          example: '0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2'
        description: Comma-separated values of ERC-20 tokens to retrieve the value of. Maximum 10 at a time.
      - name: pageToken
        in: query
        required: false
        schema:
          type: string
          description: A cursor to fetch the next page of a lengthy response.
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..y7FANxpXgtdgk83CIqPHHk2jutj1NZrueTu4XR39jnk
        description: A cursor to fetch the next page of a lengthy response.
      - name: assetType
        in: query
        required: false
        schema:
          type: string
          description: 'Specifies the asset type: ''fungible'' or ''nonFungible''. Default: all.'
          enum:
          - fungible
          - nonFungible
          - all
          example: fungible
        description: 'Specifies the asset type: ''fungible'' or ''nonFungible''. Default: all.'
      - name: timestamp
        in: query
        required: false
        schema:
          type: string
          description: 'The timestamp up to which balances will be fetched. Note: Only applicable for assetType set to fungible.'
          example: '1741869257'
        description: 'The timestamp up to which balances will be fetched. Note: Only applicable for assetType set to fungible.'
      - name: blockNumber
        in: query
        required: false
        schema:
          type: string
          description: 'The block number up to which balances will be fetched. Note: Only applicable for assetType set to fungible.'
          example: '100000'
        description: 'The block number up to which balances will be fetched. Note: Only applicable for assetType set to fungible.'
      - name: include24hrChange
        in: query
        required: false
        schema:
          type: boolean
          description: 'If true, return the token data with 24-hour changes. Default: false.'
          example: false
        description: 'If true, return the token data with 24-hour changes. Default: false.'
      - name: vsCurrencies
        in: query
        required: false
        schema:
          type: string
          description: A comma-separated list of currency symbols to convert the amount into, such as 'USD,EUR'. This parameter is optional and allows retrieving values in multiple fiat currencies.
          example: usd,eur,gbp
        description: A comma-separated list of currency symbols to convert the amount into, such as 'USD,EUR'. This parameter is optional and allows retrieving values in multiple fiat currencies.
      - name: availableOnly
        in: query
        required: false
        schema:
          type: boolean
          description: 'If true, only tokens with balance > 0 will be listed. Default: true.'
          example: false
        description: 'If true, only tokens with balance > 0 will be listed. Default: true.'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: number
                    description: Numeric status code indicating success or failure of the API call
                    example: 200
                  msg:
                    type: string
                    description: Human-readable message describing the API result or error
                  data:
                    anyOf:
                    - type: array
                      items: {}
                    - type: object
                      properties:
                        native:
                          anyOf:
                          - type: string
                          - type: object
                            properties:
                              balance:
                                type: string
                                description: Account or token balance
                              USDPrice:
                                type: string
                                description: Price of the asset in USD (uppercase P variant)
                          description: Native token or coin information for a chain
                        nep141:
                          type: array
                          items:
                            type: object
                            properties:
                              name:
                                type: string
                                description: Name of a token or asset
                              symbol:
                                type: string
                                description: Symbol of a token (e.g., ETH, BTC)
                              address:
                                type: string
                                description: Blockchain contract or wallet address
                                example: '0xdAe2F6EdDdA6fb4fb60cc02633DE27e2b431B402'
                              balance:
                                type: string
                                description: Account or token balance
                              USDprice:
                                type: string
                                description: Price of the asset in USD (lowercase p variant)
                              decimals:
                                type: string
                                description: Number of decimal places the token supports
                              USDPrice:
                                type: string
                                description: Price of the asset in USD (uppercase P variant)
                          description: List of NEAR protocol NEP-141 standard tokens
                        evmTokens:
                          type: array
                          items:
                            type: object
                            properties:
                              name:
                                type: string
                                description: Name of a token or asset
                              symbol:
                                type: string
                                description: Symbol of a token (e.g., ETH, BTC)
                              decimals:
                                type: string
                                description: Number of decimal places the token supports
                              address:
