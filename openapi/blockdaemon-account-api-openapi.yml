                                description: URL for the asset's logo
                              tags:
                                type:
                                - array
                                - 'null'
                                items:
                                  type: string
                                description: List of category or classification tags
                          description: List of EVM-compatible tokens
                        assets:
                          type: array
                          items:
                            type: object
                            properties:
                              assetType:
                                type: string
                                description: Type of asset (native, token, NFT, etc.)
                                example: '[fungible,nonFungible,all]'
                              balance:
