                              assetCode:
                                type: string
                                description: Unique asset code (e.g., for Stellar or other chains)
                                example: VELO
                              issuer:
                                type: string
                                description: Entity or address issuing the token
                                example: GDM4RQUQQUVSKQA7S6EM7XBZP3FCGH4Q7CL6TABQ7B2BEJ5ERARM2M5M
                              USDPrice:
                                type: string
                                description: Price of the asset in USD (uppercase P variant)
                          description: List of general blockchain assets
                        stxTokens:
                          type: array
                          items:
                            type: object
                            properties:
                              address:
                                type: string
                                description: Blockchain contract or wallet address
                                example: '0xdAe2F6EdDdA6fb4fb60cc02633DE27e2b431B402'
                              symbol:
                                type: string
