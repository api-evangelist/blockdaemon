  /v2/solana/{network}/health:
    get:
      summary: Get the Protocol Rewards Processing Health
      description: "The status of reward processing, if optimal then all rewards data up to the indicated metadata fields are available the processing status is degraded if any of the following are true:\n\n  * `chainEpoch` - `lastProcessedInflationEpoch` > 1\n  * `chainEpoch` - `lastProcessedStatusesEpoch` > 1\n  * if the `lastProcessedSlot` is over 20 minutes behind the chainSlot - note we run 10 minutes behind by design to alleviate any reorgs so this is a 10 minuate buffer on top of that\n  * `chainEpoch` - `lastProcessedMevEpoch` > 1\n  * if the `lastProcessedMevTxTimestamp` is older than 3.2 days, this is mainly as a check to see if the jito mev bot has paid out expectedly or not, not that our system is degraded\n  \n**Please note** that mev rewards are allocated to the epoch they are paid out in *not* the epoch they are earned in.\n"
      tags:
      - Solana Staking Reporting
      operationId: getHealth1
      parameters:
      - in: path
        name: network
        required: true
        description: The network to look up against
        schema:
          type: string
          default: mainnet
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse1'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
