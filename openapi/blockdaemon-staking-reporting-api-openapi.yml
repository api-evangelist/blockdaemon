components:
  securitySchemes:
    apiKeyAuthHeader:
      type: apiKey
      in: header
      name: X-API-Key
      description: 'Unlock higher TPS - Create your own API key in the [Blockdaemon App](https://app.blockdaemon.com).

        '
      x-default: 2go1YqUcuAr4WZ2-3WgSD3c7qpatZqQuNWhTVBldKZnTSUtw
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Opaque
      description: '[Legacy Auth] Unlock higher TPS - Create your own API key in the [Blockdaemon App](https://app.blockdaemon.com).

        '
      x-default: 2go1YqUcuAr4WZ2-3WgSD3c7qpatZqQuNWhTVBldKZnTSUtw
  schemas:
    Reward:
      required:
      - address
      - currency
      - metadata
      - return
      - startingBalance
      - timeAggregation
      - timeEnd
      - timeStart
      type: object
      properties:
        address:
          type: string
          description: The user-defined address.
        currency:
          type: string
          description: The cryptocurrency protocol the request relates to.
          example: ADA
        metadata:
          $ref: '#/components/schemas/Metadata2'
        return:
          type: string
          description: The sum of the rewards for the previous UTC day.
          example: '500.000000'
        startingBalance:
          type: string
          description: The staked amount at the beginning of the previous UTC day (at the timeStart).
          example: '5004.058667'
        timeAggregation:
          type: string
          example: weekly
          description: The agregation period. Either one of `epoch`, `daily`, `weekly`, or `monthly`.
        timeEnd:
          type: string
          description: The timestamp, in UTC, that marks the end of the period covered.
          example: '2022-07-31T23:59:59.000Z'
        timeStart:
          type: string
          description: The timestamp, in UTC, that marks the start of the period covered.
          example: '2022-07-01T00:00:00.000Z'
    Metadata2:
      required:
      - epoch
      type: object
      description: The protocol specific data.
      properties:
        commission:
          type: number
          format: double
          description: The commission rate.
          example: 0.01
        epoch:
          type: integer
          format: int
          description: The epoch number the rewards were earned in.
          example: 348
    error1:
      type: object
      properties:
        code:
          type: integer
          description: The numeric error code.
          example: 16384
        title:
          type: string
          description: The error description.
          example: Invalid Address
    Rewards:
      type: object
      required:
      - rewards
      properties:
        rewards:
          type: array
          description: A list of rewards.
          items:
            $ref: '#/components/schemas/Reward'
    StakingPoolAddresses:
      required:
      - addresses
      type: object
      description: A list of staking pool addresses.
      properties:
        addresses:
          type: array
          default:
          - pool1tdsrw0n33gmy0mzh7cgtn9p0jy5xwjxaa2s26gn2ewf8kg4nrzx
          - pool16agnvfan65ypnswgg6rml52lqtcqe5guxltexkn82sqgj2crqtx
          items:
            type: string
            pattern: ^pool[a-z0-9]+$
    StakingDelegatorAddresses:
      required:
      - addresses
      type: object
      description: A list of delegator addresses.
      properties:
        addresses:
          type: array
          default:
          - stake1u8003gtvhcunzzmy85nfnk6kafd8lks2mykfzf0n4hq4qzg9f029u
          - stake1u80058a9nztq6d5sudzynepf63pedvpyr3kzhlxacrcefwqf3ez2y
          items:
            type: string
            pattern: ^stake[a-z0-9]+$
    SingleHistoricRewardsQuery:
      required:
      - fromTime
      - toTime
      - timeUnit
      type: object
      properties:
        fromTime:
          type: integer
          format: int64
          description: The Unix timestamp in seconds from which you wish to retrieve rewards.
          example: 1577836800
          default: 1577836800
        toTime:
          type: integer
          format: int64
          description: The Unix timestamp in seconds until which rewards are retrieved.
          example: 1685491200
          default: 1685491200
        timeUnit:
          $ref: '#/components/schemas/TimeUnit1'
    TimeUnit1:
      type: string
      description: Represents how the rewards are aggregated. Must be one of `epoch`, `daily`, `weekly`, or `monthly`.
      enum:
      - epoch
      - daily
      - weekly
      - monthly
    MultiPoolHistoricRewardsQuery:
      required:
      - fromTime
      - toTime
      - timeUnit
      - addresses
      type: object
      properties:
        fromTime:
          type: integer
          format: int64
          description: The Unix timestamp in seconds from which you wish to retrieve rewards.
          example: 1577836800
          default: 1577836800
        toTime:
          type: integer
          format: int64
          description: The Unix timestamp in seconds until which rewards are retrieved.
          example: 1685491200
          default: 1685491200
        timeUnit:
          $ref: '#/components/schemas/TimeUnit1'
        addresses:
          type: array
          description: List of addresses to retrieve rewards for.
          default:
          - pool10gllgflzl3ngg0fj2xas9hfww25zxn2fdwtc0gd44am92pdlr7p
          - pool1f4lvg6px40kelh4kala6jxn6fnugtyhrtw6hgzgr7ar7ymtr7jd
          items:
            type: string
            pattern: ^pool[a-z0-9]+$
    MultiDelegatorHistoricRewardsQuery:
      required:
      - fromTime
      - toTime
      - timeUnit
      - addresses
      type: object
      properties:
        fromTime:
          type: integer
          format: int64
          description: The Unix timestamp in seconds from which you wish to retrieve rewards.
          example: 1577836800
          default: 1577836800
        toTime:
          type: integer
          format: int64
          description: The Unix timestamp in seconds until which rewards are retrieved.
          example: 1685491200
          default: 1685491200
        timeUnit:
          $ref: '#/components/schemas/TimeUnit1'
        addresses:
          type: array
          description: List of addresses to retrieve rewards for.
          default:
          - stake1u8003gtvhcunzzmy85nfnk6kafd8lks2mykfzf0n4hq4qzg9f029u
          - stake1u80058a9nztq6d5sudzynepf63pedvpyr3kzhlxacrcefwqf3ez2y
          items:
            type: string
            pattern: ^stake[a-z0-9]+$
    ErrorResponseCosmos:
      properties:
        timestamp:
          description: the timestamp of the error in ISO-8601 format
          type: string
        path:
          description: the path called when the error occurred
          type: string
          example: /v2/cosmos/mainnet/delegator
        status:
          description: the http status code
          type: number
          example: 400
        error:
          description: a useful description of the error that occurred
          type: string
          example: '[endTime should be in unix epoch seconds]'
    HealthResponseCosmos:
      description: The reward response object
      type: object
      properties:
        status:
          description: the status
          type: string
          enum:
          - PROCESSING
          - OPTIMAL
          - DEGRADED
        timestamp:
          description: the timestamp when the status was last updated in epoch seconds
          type: number
          example: 1704067200
        metadata:
          $ref: '#/components/schemas/HealthMetadataCosmos'
    HealthMetadataCosmos:
      properties:
        lastProcessedDate:
          description: The last processed UTC date rewards are available for
          type: string
          format: number
          example: '2025-04-20'
        progress:
          description: If the status is PROCESSING then this indicates the number of validators processed out of the total
          type: string
          format: number
          example: 231/545
        minDelegation:
          description: The minimum delegation amount required for us to track a delegator
          type: string
          format: number
          example: 100 ATOM
    RewardRequestCosmos:
      required:
      - startTime
      - endTime
      - addresses
      type: object
      properties:
        startTime:
          description: Epoch-based start time for reward queries.
          type: number
          example: 1709251200
        endTime:
          description: Epoch-based end time for reward queries.
          type: number
          example: 1711929600
        addresses:
          description: List of addresses to retrieve rewards for.
          type: array
          items:
            type: string
          example:
          - cosmosvaloper10nzaaeh2kq28t3nqsh5m8kmyv90vx7ym5mpakx
        period:
          $ref: '#/components/schemas/TimePeriodCosmos'
        aggregate:
          description: Whether to aggregate across provided addresses or per address - true to aggregate across all addresses
          type: boolean
          default: false
    TimePeriodCosmos:
      description: How the data is aggregated, `raw` is checkpoint level data.
      type: string
      enum:
      - raw
      - daily
      - weekly
      - monthly
    TypeCosmos:
      description: Specifies the role associated with the request.
      type: string
      enum:
      - delegator
      - validator
    RewardsResponseCosmos:
      description: The reward response object
      type: object
      properties:
        address:
          description: The address the reward is for
          type: string
          example: cosmosvaloper10nzaaeh2kq28t3nqsh5m8kmyv90vx7ym5mpakx
        denomination:
          description: the denomination the reward is in
          type: string
          example: uatom
        return:
          description: The staking return of the address for the period
          type: string
          example: '283291849202'
          format: number
        startTime:
          description: Epoch-based start time for reward queries.
          type: number
          example: 1709251200
        endTime:
          description: Epoch-based end time for reward queries.
          type: number
          example: 1711929600
        period:
          $ref: '#/components/schemas/TimePeriodCosmos'
        startBalance:
          description: the balance or stake at the start of the period
          type: string
          example: '124222'
          format: number
        metadata:
          $ref: '#/components/schemas/RewardsMetadataCosmos'
    RewardsMetadataCosmos:
      properties:
        commission:
          description: Only present in validator rewards - the amount of rewards from commission
          type: string
          format: number
          example: '532626257312'
        withdrawals:
          description: The total amount withdrawn from rewards balance during the period
          type: string
          format: number
          example: '8869338515563405'
        validatorAddress:
          description: Only present in delegator rewards - the validator address of this delegation reward
          type: string
          example: cosmosvaloper10nzaaeh2kq28t3nqsh5m8kmyv90vx7ym5mpakx
        claimableCommission:
          description: Only present in validator rewards - the total commission rewards this validator had available to withdraw at the end of the period
          type: string
          format: number
          example: '251296884'
        startBlock:
          description: The block number at the start of this period
          type: string
          format: number
          example: '25274224'
        endBlock:
          description: The block number at the end of this period
          type: string
          format: number
          example: '25286409'
        stake:
          description: If a validator reward, it is the total stake against that validator, if a delegator then the total it has staked
          type: string
          format: number
          example: '532626257312'
        claimableRewards:
          description: Only present in delegator rewards - the total amount of rewards available to withdraw at the end of the period
          type: string
          format: number
          example: '532626257312'
    YieldResponseCosmos:
      description: The reward response object
      type: object
      properties:
        startTime:
          description: Epoch-based start time for reward queries.
          type: number
          example: 1709251200
        endTime:
          description: Epoch-based end time for reward queries.
          type: number
          example: 1711929600
        return:
          description: The staking return for all delegators or validators for the period
          type: string
          example: '283291849202'
          format: number
        apr:
          description: The APR for delegators or validators based on the return and total stake of the network
          type: string
          example: '0.0601'
          format: number
        aprPercentage:
          description: The same as above but in percentage form
          type: string
          example: 6.01%
          format: number
        apy:
          description: The APY based on the above and assuming re-staking of all rewards after each day
          type: string
          example: '0.06912'
          format: number
        apyPercentage:
          description: The same as above but in percentage form
          type: string
          example: 6.912%
          format: number
        denomination:
          description: the denomination the reward is in
          type: string
          example: uatom
        stake:
          description: the total stake across the full network
