          - '43114'
          - '137'
          - '250'
          - '10'
          - '11155420'
          - '42161'
          - '421614'
          - '25'
          - '338'
          - '84532'
          - '8453'
          - '43113'
          - '97'
          - '80002'
          - '300'
          - '324'
          example: '1'
        description: The unique ID to direct queries or transactions to the correct blockchain. Find more [here](https://docs.blockdaemon.com/docs/defi-api-supported-protocols#supported-chains).
      - name: chainSymbol
        in: query
        required: false
        schema:
          type: string
          description: The abbreviated chain name for queries or transactions.
          example: ETH
        description: The abbreviated chain name for queries or transactions.
      - name: sender
        in: query
        required: true
        schema:
          type: string
          description: On-chain wallet address.
          example: '0x03D3a52d79eeB5014dFe28258e8c0978Ecd8e65c'
        description: On-chain wallet address.
      - name: nonce
        in: query
        required: false
        schema:
          type: string
          description: Anti-replay parameter.
          example: '0'
        description: Anti-replay parameter.
      - name: initCode
        in: query
        required: false
        schema:
          type: string
          description: The initCode of the account. (needed if and only if the account is not yet on-chain and needs to be created)
          example: 0x
        description: The initCode of the account. (needed if and only if the account is not yet on-chain and needs to be created)
      - name: preVerificationGas
        in: query
        required: false
        schema:
          type: string
          description: Gas units to compensate the bundler for pre-verification overhead and calldata encoding, as an integer string (ERC-4337).
          example: '53576'
        description: Gas units to compensate the bundler for pre-verification overhead and calldata encoding, as an integer string (ERC-4337).
      - name: verificationGasLimit
        in: query
        required: false
        schema:
          type: string
          description: Maximum gas units for verifying the user operation (signature validation and paymaster logic), as an integer string (ERC-4337).
          example: '362451'
        description: Maximum gas units for verifying the user operation (signature validation and paymaster logic), as an integer string (ERC-4337).
      - name: gasLimit
        in: query
        required: false
        schema:
          type: string
          description: Maximum gas units for the overall user operation execution, as an integer string (ERC-4337).
          example: '10000'
        description: Maximum gas units for the overall user operation execution, as an integer string (ERC-4337).
      - name: callGasLimit
        in: query
        required: false
        schema:
          type: string
          description: Maximum gas units for the main execution call of the user operation, as an integer string (ERC-4337).
          example: '260611'
        description: Maximum gas units for the main execution call of the user operation, as an integer string (ERC-4337).
      - name: callData
        in: query
        required: false
        schema:
          type: string
          description: Encoded data for executing the primary function call or operation within the user's transaction.
          example: ''
        description: Encoded data for executing the primary function call or operation within the user's transaction.
      - name: maxPriorityFeePerGas
        in: query
        required: false
        schema:
          type: string
          description: 'Maximum priority fee (tip) per gas unit in wei to incentivize validators or bundlers, as an integer string (EIP-1559). Example: ''1000000000'' = 1 gwei.'
          example: '100000000'
        description: 'Maximum priority fee (tip) per gas unit in wei to incentivize validators or bundlers, as an integer string (EIP-1559). Example: ''1000000000'' = 1 gwei.'
      - name: maxFeePerGas
        in: query
        required: false
        schema:
          type: string
          description: 'Maximum total fee per gas unit in wei (base fee + priority fee), as an integer string (EIP-1559). Example: ''20000000000'' = 20 gwei.'
          example: '29964445250'
