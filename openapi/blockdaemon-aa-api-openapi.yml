  /defi/v1/aa/getuserops:
    get:
      tags:
      - aa
      summary: Get User Ops
      description: 'Retrieves a user operation object that can be signed and submitted to the bundler. Used in account abstraction flows to gather the required transaction data.


        > 💡

        **Compute Unit Value:** `5` (Fixed)'
      operationId: aaGetuserops
      parameters:
      - name: chainId
        in: query
        required: false
        schema:
          type: string
          description: The unique ID to direct queries or transactions to the correct blockchain. Find more [here](https://docs.blockdaemon.com/docs/defi-api-supported-protocols#supported-chains).
          enum:
          - '1'
          - '56'
          - '43114'
          - '137'
          - '250'
          - '10'
          - '11155420'
          - '42161'
          - '421614'
          - '25'
          - '338'
          - '84532'
          - '8453'
          - '43113'
          - '97'
          - '80002'
          - '300'
          - '324'
          example: '1'
        description: The unique ID to direct queries or transactions to the correct blockchain. Find more [here](https://docs.blockdaemon.com/docs/defi-api-supported-protocols#supported-chains).
      - name: chainSymbol
        in: query
        required: false
        schema:
          type: string
          description: The abbreviated chain name for queries or transactions.
          example: ETH
        description: The abbreviated chain name for queries or transactions.
      - name: sender
        in: query
        required: true
        schema:
          type: string
          description: Specifies the account or contract initiating the operation. If not on-chain yet, the account may need to be created.
          example: '0x03D3a52d79eeB5014dFe28258e8c0978Ecd8e65c'
        description: Specifies the account or contract initiating the operation. If not on-chain yet, the account may need to be created.
      - name: nonce
        in: query
        required: false
        schema:
          type: string
          description: Anti-replay parameter.
          example: '0'
        description: Anti-replay parameter.
      - name: initCode
        in: query
        required: false
        schema:
          type: string
          description: The initCode of the account. (needed if and only if the account is not yet on-chain and needs to be created)
          example: 0x
        description: The initCode of the account. (needed if and only if the account is not yet on-chain and needs to be created)
      - name: preVerificationGas
        in: query
        required: false
        schema:
          type: string
          description: Gas units to compensate the bundler for pre-verification overhead and calldata encoding, as an integer string (ERC-4337).
          example: '53576'
        description: Gas units to compensate the bundler for pre-verification overhead and calldata encoding, as an integer string (ERC-4337).
      - name: verificationGasLimit
        in: query
        required: false
        schema:
          type: string
          description: Maximum gas units for verifying the user operation (signature validation and paymaster logic), as an integer string (ERC-4337).
          example: '362451'
        description: Maximum gas units for verifying the user operation (signature validation and paymaster logic), as an integer string (ERC-4337).
      - name: gasLimit
        in: query
        required: false
        schema:
          type: string
          description: Maximum gas units for the overall user operation execution, as an integer string (ERC-4337).
          example: '10000'
        description: Maximum gas units for the overall user operation execution, as an integer string (ERC-4337).
      - name: callGasLimit
        in: query
        required: false
        schema:
          type: string
          description: Maximum gas units for the main execution call of the user operation, as an integer string (ERC-4337).
          example: '260611'
        description: Maximum gas units for the main execution call of the user operation, as an integer string (ERC-4337).
      - name: callData
        in: query
        required: false
        schema:
          type: string
          description: The encoded data for the transaction function call or operation to be executed in this user operation.
          example: ''
        description: The encoded data for the transaction function call or operation to be executed in this user operation.
      - name: maxPriorityFeePerGas
        in: query
        required: false
        schema:
          type: string
          description: 'Maximum priority fee (tip) per gas unit in wei to incentivize validators or bundlers, as an integer string (EIP-1559). Example: ''1000000000'' = 1 gwei.'
          example: '100000000'
        description: 'Maximum priority fee (tip) per gas unit in wei to incentivize validators or bundlers, as an integer string (EIP-1559). Example: ''1000000000'' = 1 gwei.'
      - name: maxFeePerGas
        in: query
        required: false
        schema:
          type: string
          description: 'Maximum total fee per gas unit in wei (base fee + priority fee), as an integer string (EIP-1559). Example: ''20000000000'' = 20 gwei.'
          example: '29964445250'
        description: 'Maximum total fee per gas unit in wei (base fee + priority fee), as an integer string (EIP-1559). Example: ''20000000000'' = 20 gwei.'
      - name: paymasterAndData
        in: query
        required: false
        schema:
          type: string
          description: Address of the paymaster sponsoring the transaction, plus any additional data sent to the paymaster. Leave empty for self-sponsored transactions.
          example: 0x
        description: Address of the paymaster sponsoring the transaction, plus any additional data sent to the paymaster. Leave empty for self-sponsored transactions.
      - name: userOps
        in: query
        required: true
        schema:
          type: string
          description: Array of user operation objects as per ERC-4337. Defines one or more operations to bundle.
          example:
          - sender: '0x03D3a52d79eeB5014dFe28258e8c0978Ecd8e65c'
            nonce: '0'
            initCode: 0x
            callData: ''
            callGasLimit: '260611'
            gasLimit: '362451'
            verificationGasLimit: '362451'
            preVerificationGas: '53576'
            maxFeePerGas: '29964445250'
            maxPriorityFeePerGas: '100000000'
            paymasterAndData: 0x
            signature: '0x06ba793e154877ba4beff535372f70be6d2ebb5503f374297658caa13a114b5b29b5a45cd4835176e637018823bba5990b6f043f93fe792a5bdb2a09958ecca61c'
        description: Array of user operation objects as per ERC-4337. Defines one or more operations to bundle.
      - name: bundler
        in: query
        required: true
        schema:
          type: string
          description: The address of the bundler or beneficiary responsible for executing the user operations.
          example: '0x6Fb447Ae94F5180254D436A693907a1f57696900'
        description: The address of the bundler or beneficiary responsible for executing the user operations.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: object
                example:
                  status: 200
                  msg: success
                  data:
                    sender: '0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48'
                    nonce: '0'
                    initCode: 0x
                    callData: ''
                    callGasLimit: '260611'
                    gasLimit: '362451'
                    verificationGasLimit: '362451'
                    preVerificationGas: '53576'
                    maxFeePerGas: '29964445250'
                    maxPriorityFeePerGas: '100000000'
                    paymasterAndData: 0x
                    signature: 0x
      x-bd-cu: '5'
      x-bd-cu-type: fixed
      x-internal: false
  /defi/v1/aa/senduserops:
    post:
      tags:
      - aa
      summary: Send User Ops
      description: 'This endpoint generates and returns the necessary paymaster parameters for account abstraction. It constructs a user operation payload including sender, recipient, gas, and call data details which can be submitted to execute transactions on the blockchain.


        > 💡

        **Compute Unit Value:** `15` (Fixed)'
      operationId: aaSenduserops
      requestBody:
        required: true
        description: The request body for a /defi/v1/aa/senduserops
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/_aa_senduserops_Request'
            example:
              chainId: '1'
              chainSymbol: ETH
              bundler: '0x6Fb447Ae94F5180254D436A693907a1f57696900'
              gas: '100000'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: object
                example:
                  status: 200
                  msg: success
                  data:
                    from: '0x6Fb447Ae94F5180254D436A693907a1f57696900'
                    to: '0x5FF137D4b0FDCD49DcA30c7CF57E578a026d2789'
                    gas: '516124'
                    data: ''
                    value: '0'
      x-bd-cu: '15'
      x-bd-cu-type: fixed
      x-internal: false
