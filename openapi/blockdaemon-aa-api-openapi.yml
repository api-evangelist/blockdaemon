openapi: 3.2.0
info:
  contact:
    name: Blockdaemon
    email: info@blockdaemon.com
  description: The Blockdaemon DeFi API provides a single interface to a multitude of DeFi projects and blockchains
  title: Blockdaemon DeFi Aa API
  version: 1.0.0
  x-logo:
    altText: Blockdaemon logo
    backgroundColor: '#fafafa'
    url: https://storage.googleapis.com/blockdaemon-app-static-images/marketing/PNG/dark-logo.png
servers:
- url: https://svc.blockdaemon.com
security:
- ApiKeyAuth: []
tags:
- name: aa
paths:
  /defi/v1/aa/getpaymasterdata:
    get:
      tags:
      - aa
      summary: Get Paymaster Data
      description: 'This endpoint retrieves the paymaster data necessary for account abstraction. It returns a payload containing the paymasterData, a verification hash, and validity timestamps (mockValidUntil and mockValidAfter) that should be incorporated into user operations.


        > 💡

        **Compute Unit Value:** `15` (Fixed)'
      operationId: aaGetpaymasterdata
      parameters:
      - name: chainId
        in: query
        required: false
        schema:
          type: string
          description: The unique ID to direct queries or transactions to the correct blockchain. Find more [here](https://docs.blockdaemon.com/docs/defi-api-supported-protocols#supported-chains).
          enum:
          - '1'
          - '56'
          - '43114'
          - '137'
          - '250'
          - '10'
          - '11155420'
          - '42161'
          - '421614'
          - '25'
          - '338'
          - '84532'
          - '8453'
          - '43113'
          - '97'
          - '80002'
          - '300'
          - '324'
          example: '1'
        description: The unique ID to direct queries or transactions to the correct blockchain. Find more [here](https://docs.blockdaemon.com/docs/defi-api-supported-protocols#supported-chains).
      - name: chainSymbol
        in: query
        required: false
        schema:
          type: string
          description: The abbreviated chain name for queries or transactions.
          example: ETH
        description: The abbreviated chain name for queries or transactions.
      - name: sender
        in: query
        required: true
        schema:
          type: string
          description: On-chain wallet address.
          example: '0x03D3a52d79eeB5014dFe28258e8c0978Ecd8e65c'
        description: On-chain wallet address.
      - name: nonce
        in: query
        required: false
        schema:
          type: string
          description: Anti-replay parameter.
          example: '0'
        description: Anti-replay parameter.
      - name: initCode
        in: query
        required: false
        schema:
          type: string
          description: The initCode of the account. (needed if and only if the account is not yet on-chain and needs to be created)
          example: 0x
        description: The initCode of the account. (needed if and only if the account is not yet on-chain and needs to be created)
      - name: preVerificationGas
        in: query
        required: false
        schema:
          type: string
          description: Gas units to compensate the bundler for pre-verification overhead and calldata encoding, as an integer string (ERC-4337).
          example: '53576'
        description: Gas units to compensate the bundler for pre-verification overhead and calldata encoding, as an integer string (ERC-4337).
      - name: verificationGasLimit
        in: query
        required: false
        schema:
          type: string
          description: Maximum gas units for verifying the user operation (signature validation and paymaster logic), as an integer string (ERC-4337).
          example: '362451'
        description: Maximum gas units for verifying the user operation (signature validation and paymaster logic), as an integer string (ERC-4337).
      - name: gasLimit
        in: query
        required: false
        schema:
          type: string
          description: Maximum gas units for the overall user operation execution, as an integer string (ERC-4337).
          example: '10000'
        description: Maximum gas units for the overall user operation execution, as an integer string (ERC-4337).
      - name: callGasLimit
        in: query
        required: false
        schema:
          type: string
          description: Maximum gas units for the main execution call of the user operation, as an integer string (ERC-4337).
          example: '260611'
        description: Maximum gas units for the main execution call of the user operation, as an integer string (ERC-4337).
      - name: callData
        in: query
        required: false
        schema:
          type: string
          description: Encoded data for executing the primary function call or operation within the user's transaction.
          example: ''
        description: Encoded data for executing the primary function call or operation within the user's transaction.
      - name: maxPriorityFeePerGas
        in: query
        required: false
        schema:
          type: string
          description: 'Maximum priority fee (tip) per gas unit in wei to incentivize validators or bundlers, as an integer string (EIP-1559). Example: ''1000000000'' = 1 gwei.'
          example: '100000000'
        description: 'Maximum priority fee (tip) per gas unit in wei to incentivize validators or bundlers, as an integer string (EIP-1559). Example: ''1000000000'' = 1 gwei.'
      - name: maxFeePerGas
        in: query
        required: false
        schema:
          type: string
          description: 'Maximum total fee per gas unit in wei (base fee + priority fee), as an integer string (EIP-1559). Example: ''20000000000'' = 20 gwei.'
          example: '29964445250'
        description: 'Maximum total fee per gas unit in wei (base fee + priority fee), as an integer string (EIP-1559). Example: ''20000000000'' = 20 gwei.'
      - name: paymasterAndData
        in: query
        required: false
        schema:
          type: string
          description: Address of paymaster sponsoring the transaction, followed by extra data to send to the paymaster. (empty for self-sponsored transaction)
          example: 0x
        description: Address of paymaster sponsoring the transaction, followed by extra data to send to the paymaster. (empty for self-sponsored transaction)
      - name: paymasterContractAddress
        in: query
        required: true
        schema:
          type: string
          description: Address of the contract from where, gas is to be paid.
          example: '0xba60b04029be2bfd16d76e70290acfad3a8b582c'
        description: Address of the contract from where, gas is to be paid.
      - name: mockValidAfter
        in: query
        required: true
        schema:
          type: string
          description: The UserOp is valid only after this time, to be sent in epoch time format.
          example: '0x0'
        description: The UserOp is valid only after this time, to be sent in epoch time format.
      - name: mockValidUntil
        in: query
        required: true
        schema:
          type: string
          description: The UserOp is valid only up to this time, to be sent in epoch time format.
          example: '0x00000000deadbeef'
        description: The UserOp is valid only up to this time, to be sent in epoch time format.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: object
                example:
                  status: 200
                  msg: success
                  data:
                    paymasterData: ''
                    hash: '0x2907ffb2f2320e35a041bd74235caed02f706e3ed4b2308f0a064a1f9e0aac67'
                    mockValidUntil: '0x00000000deadbeef'
                    mockValidAfter: '0x0'
      x-bd-cu: '15'
      x-bd-cu-type: fixed
      x-internal: false
  /defi/v1/aa/getsignaturemessage:
