info:
  contact:
    name: Blockdaemon
    email: info@blockdaemon.com
  description: The Blockdaemon DeFi API provides a single interface to a multitude of DeFi projects and blockchains
  title: Blockdaemon DeFi Oracle API
  version: 1.0.0
  x-logo:
    altText: Blockdaemon logo
    backgroundColor: '#fafafa'
    url: https://storage.googleapis.com/blockdaemon-app-static-images/marketing/PNG/dark-logo.png
servers:
- url: https://svc.blockdaemon.com
security:
- ApiKeyAuth: []
tags:
- name: oracle
paths:
  /defi/v1/oracle/getprice:
    get:
      tags:
      - oracle
      summary: Get Price
      description: 'Fetch the price of a specified token in USDT from supported oracle protocols on both EVM and non-EVM chains. This endpoint allows you to retrieve real-time or historical pricing data for a token by specifying an oracle or querying all available oracles.


        > 💡

        **Compute Unit Value:** `25` (Fixed)'
      operationId: oracleGetprice
      parameters:
      - name: asset
        in: query
        required: true
        schema:
          type: string
          description: The token name for which the price needs to be fetched (in USDT).
          example: '0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2'
        description: The token name for which the price needs to be fetched (in USDT).
      - name: oracleId
        in: query
        required: false
        schema:
          type: string
          description: The unique ID to specify the oracle protocol for queries or transactions.
          enum:
          - '1000'
          - '1001'
          - '1002'
          - '1003'
          - '1004'
          - '1100'
          - '1200'
          - '1300'
          - '1301'
          - '1302'
          - '1303'
          example: '1000'
        description: The unique ID to specify the oracle protocol for queries or transactions.
      - name: oracleName
        in: query
        required: false
        schema:
          type: string
          description: The name of the oracle protocol to use.
          example: ChainLink
        description: The name of the oracle protocol to use.
      - name: timestamp
        in: query
        required: false
        schema:
          type: string
          description: The specific point in time for which the price should be fetched, if required.
          example: '1741869257'
        description: The specific point in time for which the price should be fetched, if required.
      - name: hours
        in: query
        required: false
        schema:
          type: string
          description: The array of hours for which the price should be fetched, if required.
          example: '1'
        description: The array of hours for which the price should be fetched, if required.
      - name: days
        in: query
        required: false
        schema:
          type: string
          description: The array of days for which the price should be fetched, if required.
          example: '1'
        description: The array of days for which the price should be fetched, if required.
      - name: weeks
        in: query
        required: false
        schema:
          type: string
          description: The array of weeks for which the price should be fetched, if required.
          example: '1'
        description: The array of weeks for which the price should be fetched, if required.
      - name: vsCurrencies
        in: query
        required: false
        schema:
          type: string
          description: A comma-separated list of currency symbols to convert the amount into, such as 'USD,EUR'. This parameter is optional and allows retrieving values in multiple fiat currencies.
          example: usd,eur,gbp
        description: A comma-separated list of currency symbols to convert the amount into, such as 'USD,EUR'. This parameter is optional and allows retrieving values in multiple fiat currencies.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: object
                example:
                  status: 200
                  msg: success
                  data:
                    ChainLink:
                      priceFeedAddress: '0x8fFfFfd4AfB6115b954Bd326cbe7B4BA576818f6'
                      roundId: '36893488147419104863'
                      answer: '0.99994098'
                      startedAt: '1713945803'
                      updatedAt: '1713945803'
                      answeredInRound: '36893488147419104863'
                    Pyth:
                      priceFeedAddress: eaa020c61cc479712813461ce153894a96a6c00b21ed0cfc2798d1f9a9e9c94a
                      roundId: null
                      answer: '1.000125'
                      startedAt: null
                      updatedAt: null
                      answeredInRound: null
                    averagePrice: '1.00003'
      x-bd-cu: '25'
      x-bd-cu-type: fixed
      x-internal: false
  /defi/v1/oracle/getsupportedtokens:
    get:
      tags:
      - oracle
      summary: Get Supported Tokens
      description: 'This endpoint retrieves a comprehensive list of tokens available for price feeds and data verification. It returns a mapping of token symbols to their contract addresses, aggregating data from multiple oracle providers so you can easily integrate accurate, up-to-date pricing into your applications.


        > 💡

        **Compute Unit Value:** `5` (Fixed)'
      operationId: oracleGetsupportedtokens
      parameters:
      - name: oracleId
        in: query
        required: false
        schema:
          type: string
          description: The unique ID to specify the oracle protocol for queries or transactions.
          enum:
          - '1000'
          - '1001'
          - '1002'
          - '1003'
          - '1004'
          - '1100'
          - '1200'
          - '1300'
          - '1301'
          - '1302'
          - '1303'
          example: '1000'
        description: The unique ID to specify the oracle protocol for queries or transactions.
      - name: oracleName
        in: query
        required: false
        schema:
          type: string
          description: The name of the oracle protocol to use.
          example: ChainLink
        description: The name of the oracle protocol to use.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  msg:
                    type: string
                  data:
