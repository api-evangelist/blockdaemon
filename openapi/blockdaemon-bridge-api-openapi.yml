  /defi/v1/bridge/tokens:
    get:
      tags:
      - Bridge
      summary: Get User Bridge Tokens
      description: 'Returns a comprehensive list of tokens that the all the bridge currently supports. The response includes each token’s symbol and its corresponding blockchain address, enabling users to easily determine which assets can be transferred or managed through the bridge.


        > 💡

        **Compute Unit Value:** `60` (Fixed)'
      operationId: bridgeTokens
      parameters: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: number
                    description: Numeric status code indicating success or failure of the API call
                    example: 200
                  msg:
                    type: string
                    description: Human-readable message describing the API result or error
                  data:
                    type: object
                    properties:
                      tokens:
                        type: array
                        items:
                          type: object
                          properties:
                            tokenSymbol:
                              type: string
                              description: Symbol of a token
                              example: USDT
                            tokenLogo:
                              type:
                              - string
                              - 'null'
                              description: Logo URL of a token
                            chainName:
                              type: string
                              description: Human-readable blockchain network name
                            chainId:
                              type: string
                              description: Blockchain network identifier (EVM chain ID, Solana chain name, etc.)
                              example: '1'
                            chainLogo:
                              type:
                              - string
                              - 'null'
                              description: Logo URL of the chain
                            address:
                              type: string
                              description: Blockchain contract or wallet address
                              example: '0xdAe2F6EdDdA6fb4fb60cc02633DE27e2b431B402'
                            decimals:
                              type: string
                              description: Number of decimal places the token supports
                            Bridge:
                              type: array
                              items:
                                type: object
                                properties:
                                  name:
                                    type: string
                                    description: Name of a token or asset
                                  bridgeLogo:
                                    type: string
                                    description: Logo of the bridge service
                                required:
                                - name
                                - bridgeLogo
                              description: Array of bridge services available for a token
                          required:
                          - tokenSymbol
                          - tokenLogo
                          - chainName
                          - chainId
                          - chainLogo
                          - address
                          - decimals
                          - Bridge
                example:
                  status: 200
                  msg: success
