  /defi/v1/bridge/unlock:
    post:
      tags:
      - Bridge
      summary: Unlock Tokens for Bridge Swap
      description: 'Initiates the unlocking process for assets on the destination blockchain that were previously locked during a bridging operation. This endpoint triggers the release of tokens, making them available for use on the target network. The response provides critical transaction details—including the destination chain ID, sender and receiver addresses, gas usage, and a unique reference ID—allowing developers and users to verify that the unlocking process has been successfully initiated and to track the transaction''s progress.


        > 💡

        **Compute Unit Value:** `50` (Fixed)'
      operationId: bridgeUnlock
      requestBody:
        required: true
        description: The request body for a /defi/v1/bridge/unlock
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/_bridge_unlock_Request'
            example:
              bridgeId: '300'
              srcChainId: '1'
              dstChainId: '1'
              dstTokenSymbol: ETH
              dstTokenAddress: '0xdAe2F6EdDdA6fb4fb60cc02633DE27e2b431B402'
              amount: '1000000000000000000'
              gas: '100000'
              gasPriority: low
              receiver: '0xdAe2F6EdDdA6fb4fb60cc02633DE27e2b431B402'
