  /defi/v1/bridge/transactions:
    get:
      tags:
      - Bridge
      summary: Get Bridge Transaction Details
      description: 'Retrieves detailed information about a specific cross-chain bridge transaction using its transaction hash. It returns key data such as source and destination addresses, block details, transaction status, and timestamps, enabling users to track and verify the progress and outcome of the transaction.


        > 💡

        **Compute Unit Value:** `50` (Fixed)'
      operationId: bridgeTransactions
      parameters:
      - name: transactionHash
        in: query
        required: true
        schema:
          type: string
          description: The hash of the transaction to retrieve details for.
          example: '0x7a69b73a9617b13663c5db08b0e371866b7bbf2b49866e61c2fe8303e07f7094'
        description: The hash of the transaction to retrieve details for.
      - name: bridgeId
        in: query
        required: false
        schema:
          type: string
          description: The unique ID to specify the bridge protocol for routing cross-chain queries or transactions. Find more [here](https://docs.blockdaemon.com/docs/defi-api-supported-protocols#supported-bridges-protocols).
          enum:
          - '100'
          - '600'
          - '300'
          - '400'
          - '500'
          example: '100'
        description: The unique ID to specify the bridge protocol for routing cross-chain queries or transactions. Find more [here](https://docs.blockdaemon.com/docs/defi-api-supported-protocols#supported-bridges-protocols).
      - name: srcChainId
        in: query
        required: false
        schema:
          type: string
          description: Chain ID of the source chain. Find more [here](https://docs.blockdaemon.com/docs/defi-api-supported-protocols#supported-chains).
          example: '1'
        description: Chain ID of the source chain. Find more [here](https://docs.blockdaemon.com/docs/defi-api-supported-protocols#supported-chains).
      - name: srcChainSymbol
        in: query
        required: false
        schema:
          type: string
          description: Symbol of the source chain.
          example: ETH
        description: Symbol of the source chain.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: number
                    description: Numeric status code indicating success or failure of the API call
                    example: 200
                  msg:
                    type: string
                    description: Human-readable message describing the API result or error
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        description: Executed or Pending
                        example: Executed
                      srcTx:
                        type: object
                        properties:
                          chainId:
                            type: string
                            description: Blockchain network identifier (EVM chain ID, Solana chain name, etc.)
                            example: '1'
                          hash:
                            type: string
                            description: Transaction hash
                        required:
                        - chainId
                        - hash
                        description: Source transaction details
                      dstTx:
                        type: object
                        properties:
                          chainId:
                            type: string
                            description: Blockchain network identifier (EVM chain ID, Solana chain name, etc.)
                            example: '1'
                          hash:
                            type: string
                            description: Transaction hash
                        required:
                        - chainId
                        - hash
                        description: Destination transaction details
                    required:
                    - status
                    - srcTx
                    - dstTx
                example:
                  status: 200
                  msg: success
                  data:
                    status: EXECUTED
                    srcTx:
                      chainId: '56'
