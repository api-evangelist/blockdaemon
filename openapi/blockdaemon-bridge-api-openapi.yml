  /defi/v1/bridge/getsupportedtokens:
    get:
      tags:
      - Bridge
      summary: Get Supported Tokens
      description: 'Returns a comprehensive list of tokens that the bridge currently supports. The response includes each token’s symbol and its corresponding blockchain address, enabling users to easily determine which assets can be transferred or managed through the bridge.


        > 💡

        **Compute Unit Value:** `60` (Fixed)'
      operationId: bridgeGetsupportedtokens
      parameters:
      - name: bridgeId
        in: query
        required: false
        schema:
          type: string
          description: The unique ID to specify the bridge protocol for routing cross-chain queries or transactions. Find more [here](https://docs.blockdaemon.com/docs/defi-api-supported-protocols#supported-bridges-protocols).
          enum:
          - '600'
          - '300'
          - '400'
          - '500'
