components:
  schemas:
    _rwa_register_Request:
      type: object
      properties:
        chainId:
          type: string
          description: The unique ID to direct queries or transactions to the correct blockchain. Find more [here](https://docs.blockdaemon.com/docs/defi-api-supported-protocols#supported-chains).
          enum:
          - '1500'
          - '1501'
          example: '1500'
        from:
          type: string
          description: Public blockchain address of the sender initiating the transaction. Format depends on the chain (e.g., 0xABCDEF... for EVM, G... for Stellar).
          example: '0xdAe2F6EdDdA6fb4fb60cc02633DE27e2b431B402'
        contract:
          type: string
          description: The unique identifier of the smart contract managing the asset.
          example: '0xfad57d2039c21811c8f2b5d5b65308aa99d31559'
        assetCode:
          type: string
          description: The unique alphanumeric code identifying the asset.
          example: VELO
        amount:
          type: string
          description: 'Amount of the asset involved in the transaction, in the asset''s smallest denomination (base units). Do not send human-readable decimal values. Examples: EVM tokens (18 decimals) = "1000000000000000000"; Stellar (7 decimals) = "10000000".'
          example: '1000000000000000000'
      required:
      - from
      - contract
      - assetCode
      - amount
      description: The request body for a /defi/v1/rwa/register
      example:
        chainId: '1500'
        from: '0xdAe2F6EdDdA6fb4fb60cc02633DE27e2b431B402'
        contract: '0xfad57d2039c21811c8f2b5d5b65308aa99d31559'
        assetCode: VELO
        amount: '1000000000000000000'
    _rwa_unfreeze_Request:
      type: object
      properties:
        chainId:
          type: string
          description: The unique ID to direct queries or transactions to the correct blockchain. Find more [here](https://docs.blockdaemon.com/docs/defi-api-supported-protocols#supported-chains).
          enum:
          - '1500'
          - '1501'
          example: '1500'
        contract:
          type: string
          description: The unique identifier of the smart contract where the asset is registered
          example: '0xfad57d2039c21811c8f2b5d5b65308aa99d31559'
        from:
          type: string
          description: Public blockchain address of the sender initiating the transaction. Format depends on the chain (e.g., 0xABCDEF... for EVM, G... for Stellar).
          example: '0xdAe2F6EdDdA6fb4fb60cc02633DE27e2b431B402'
        assetCode:
          type: string
          description: The unique alphanumeric code identifying the asset.
          example: VELO
      required:
      - contract
      - from
      - assetCode
      description: The request body for a /defi/v1/rwa/unfreeze
      example:
        chainId: '1500'
        contract: '0xfad57d2039c21811c8f2b5d5b65308aa99d31559'
        from: '0xdAe2F6EdDdA6fb4fb60cc02633DE27e2b431B402'
        assetCode: VELO
    _rwa_issue_Request:
      type: object
      properties:
        chainId:
          type: string
          description: The unique ID to direct queries or transactions to the correct blockchain. Find more [here](https://docs.blockdaemon.com/docs/defi-api-supported-protocols#supported-chains).
          enum:
          - '1500'
          - '1501'
          - '1600'
          - '1601'
          example: '1500'
        chainSymbol:
          type: string
          description: The abbreviated chain name for queries or transactions.
          example: ETH
        issuer:
          type: string
          description: Public address of the issuer of the asset.
          example: GDM4RQUQQUVSKQA7S6EM7XBZP3FCGH4Q7CL6TABQ7B2BEJ5ERARM2M5M
        assetCode:
          type: string
          description: The code of the asset to be issued.
          example: VELO
