    post:
      tags:
      - rwa
      summary: Set Trustline
      description: 'Establishes a secure trustline relationship between an issuer and distributor with specified asset limits and authorization parameters on the Stellar network.


        > 💡

        **Compute Unit Value:** `30` (Fixed)'
      operationId: rwaSettrustline
      requestBody:
        required: true
        description: The request body for a /defi/v1/rwa/settrustline
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/_rwa_settrustline_Request'
            example:
              chainId: '1500'
              chainSymbol: ETH
              from: '0xdAe2F6EdDdA6fb4fb60cc02633DE27e2b431B402'
              amount: '1000000000000000000'
              issuer: GDM4RQUQQUVSKQA7S6EM7XBZP3FCGH4Q7CL6TABQ7B2BEJ5ERARM2M5M
