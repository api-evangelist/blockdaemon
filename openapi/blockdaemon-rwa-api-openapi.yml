openapi: 3.2.0
info:
  contact:
    name: Blockdaemon
    email: info@blockdaemon.com
  description: The Blockdaemon DeFi API provides a single interface to a multitude of DeFi projects and blockchains
  title: Blockdaemon DeFi Rwa API
  version: 1.0.0
  x-logo:
    altText: Blockdaemon logo
    backgroundColor: '#fafafa'
    url: https://storage.googleapis.com/blockdaemon-app-static-images/marketing/PNG/dark-logo.png
servers:
- url: https://svc.blockdaemon.com
security:
- ApiKeyAuth: []
tags:
- name: rwa
paths:
  /defi/v1/rwa/burn:
    post:
      tags:
      - rwa
      summary: Burn
      description: 'Executes a burn operation to permanently remove a specified quantity of custom assets from circulation. It supports multiple networks—including Stellar (and its testnet) as well as XRPLedger (and its testnet)—and requires key parameters such as the initiating wallet address, the amount to burn, the issuer''s address, and the asset code. This irreversible operation is typically used to manage token supply or implement deflationary measures for custom assets.


        > 💡

        **Compute Unit Value:** `50` (Fixed)'
      operationId: rwaBurn
      requestBody:
        required: true
        description: The request body for a /defi/v1/rwa/burn
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/_rwa_burn_Request'
            example:
              chainId: '1500'
              chainSymbol: ETH
              from: '0xdAe2F6EdDdA6fb4fb60cc02633DE27e2b431B402'
              amount: '1000000000000000000'
              issuer: GDM4RQUQQUVSKQA7S6EM7XBZP3FCGH4Q7CL6TABQ7B2BEJ5ERARM2M5M
              assetCode: VELO
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: object
                example:
                  status: 200
                  msg: success
                  data:
                    chainId: '1500'
                    from: GAJ4BSGJE6UQHZAZ5U5IUOABPDCYPKPS3RFS2NVNGFGFXGVQDLBQJW2P
                    gas: '100'
                    data: AAAAAgAAAAATwMjJJ6kD5BntOoo4AXjFh6ny3EstNq0xTFuasBrDBAAAAGQB5rJlAAH24AAAAAEAAAAAAAAAAAAAAABmD8C0AAAAAAAAAAEAAAAAAAAAAQAAAADZyMKQhSslQB+XiM/cOX7KIx+Q+JfpgDD4dBInpIgizQAAAAFWRUxPAAAAANnIwpCFKyVAH5eIz9w5fsojH5D4l+mAMPh0EiekiCLNAAAAADuaygAAAAAAAAAAAA==
      x-bd-cu: '50'
      x-bd-cu-type: fixed
      x-internal: false
  /defi/v1/rwa/freeze:
    post:
      tags:
      - rwa
      summary: Freeze
      description: 'Revokes authorization for an account''s trustline, effectively freezing their ability to transact with the specified asset.


        > 💡

        **Compute Unit Value:** `25` (Fixed)'
      operationId: rwaFreeze
      requestBody:
        required: true
        description: The request body for a /defi/v1/rwa/freeze
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/_rwa_freeze_Request'
            example:
              chainId: '1500'
              chainSymbol: ETH
              user: GAJ4BSGJE6UQHZAZ5U5IUOABPDCYPKPS3RFS2NVNGFGFXGVQDLBQJW2P
              issuer: GDM4RQUQQUVSKQA7S6EM7XBZP3FCGH4Q7CL6TABQ7B2BEJ5ERARM2M5M
              assetCode: VELO
              amount: '1000000000000000000'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: object
                example:
                  status: 200
                  msg: success
                  data:
                    chainId: '1500'
                    from: GDM4RQUQQUVSKQA7S6EM7XBZP3FCGH4Q7CL6TABQ7B2BEJ5ERARM2M5M
                    gas: '100'
                    data: AAAAAgAAAADZyMKQhSslQB+XiM/cOX7KIx+Q+JfpgDD4dBInpIgizQAAAMgB5a+YAAAAAwAAAAEAAAAAAAAAAAAAAABmD8EjAAAAAAAAAAIAAAAAAAAABQAAAAAAAAAAAAAAAQAAAAMAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABwAAAAATwMjJJ6kD5BntOoo4AXjFh6ny3EstNq0xTFuasBrDBAAAAAFWRUxPAAAAAAAAAAAAAAAA
