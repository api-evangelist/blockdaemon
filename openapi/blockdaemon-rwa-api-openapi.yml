  /defi/v1/rwa/issue:
    post:
      tags:
      - rwa
      summary: Issue
      description: 'Creates or mints new assets on the Stellar network by executing a payment operation from issuer to distributor with specified asset codes and amounts.


        > 💡

        **Compute Unit Value:** `35` (Fixed)'
      operationId: rwaIssue
      requestBody:
        required: true
        description: The request body for a /defi/v1/rwa/issue
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/_rwa_issue_Request'
            example:
              chainId: '1500'
