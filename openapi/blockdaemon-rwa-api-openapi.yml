  /defi/v1/rwa/getallassets:
    get:
      tags:
      - rwa
      summary: Get All Assets
      description: 'Retrieves a comprehensive list of all tokenized assets associated with a specific smart contract on the blockchain. It generates an XDR hash, which is processed through the Blockdaemon SDK to fetch and return details of all assets registered under the contract.


        > 💡

        **Compute Unit Value:** `55` (Fixed)'
      operationId: rwaGetallassets
      parameters:
      - name: chainId
        in: query
        required: false
        schema:
          type: string
          description: The unique ID to direct queries or transactions to the correct blockchain. Find more [here](https://docs.blockdaemon.com/docs/defi-api-supported-protocols#supported-chains).
          enum:
          - '1500'
          - '1501'
          example: '1500'
        description: The unique ID to direct queries or transactions to the correct blockchain. Find more [here](https://docs.blockdaemon.com/docs/defi-api-supported-protocols#supported-chains).
      - name: from
        in: query
        required: true
        schema:
          type: string
          description: Public blockchain address of the sender initiating the transaction. Format depends on the chain (e.g., 0xABCDEF... for EVM, G... for Stellar).
          example: '0xdAe2F6EdDdA6fb4fb60cc02633DE27e2b431B402'
        description: Public blockchain address of the sender initiating the transaction. Format depends on the chain (e.g., 0xABCDEF... for EVM, G... for Stellar).
      - name: contract
        in: query
        required: true
        schema:
          type: string
          description: The unique identifier of the smart contract managing the asset.
          example: '0xfad57d2039c21811c8f2b5d5b65308aa99d31559'
        description: The unique identifier of the smart contract managing the asset.
      - name: assetCode
        in: query
        required: true
        schema:
          type: string
          description: The unique alphanumeric code identifying the asset.
          example: VELO
        description: The unique alphanumeric code identifying the asset.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: object
                example:
                  status: 200
                  msg: success
                  data:
                    chainId: '1501'
                    from: GBAHSSSCKQMBRAIQMYYCCDQEI7FWYVGXUPFHDERK6DM47ZBIQ3CO2WYE
                    gas: '100'
                    data: 
      x-bd-cu: '55'
      x-bd-cu-type: fixed
      x-internal: false
