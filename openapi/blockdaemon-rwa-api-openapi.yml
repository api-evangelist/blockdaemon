      summary: Transfer
      description: 'Enables secure on-chain transfers of both native (XLM) and custom assets between Stellar accounts. It requires the sender’s and recipient’s public addresses, the asset code, and the transfer amount. The endpoint processes the transaction on the blockchain, ensuring authenticity and returning transaction details such as the chain ID and gas used.


        > 💡

        **Compute Unit Value:** `30` (Fixed)'
      operationId: rwaTransfer
      requestBody:
        required: true
        description: The request body for a /defi/v1/rwa/transfer
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/_rwa_transfer_Request'
            example:
