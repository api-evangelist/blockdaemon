  /defi/v1/rwa/unfreeze:
    post:
      tags:
      - rwa
      summary: Unfreeze
      description: 'Restores the functionality of a previously frozen asset within the RWA framework. It reactivates an asset—typically frozen for regulatory, security, or administrative reasons—so that it can resume normal blockchain operations. A successful request returns key details such as the chain ID, gas used, and a reference ID for tracking the unfreeze operation.


        > 💡

        **Compute Unit Value:** `55` (Fixed)'
      operationId: rwaUnfreeze
      requestBody:
