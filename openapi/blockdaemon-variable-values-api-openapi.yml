openapi: 3.2.0
info:
  version: 1.0.0
  title: Event Streaming Variable Values API
  description: Creates and manages config for event streams
  contact:
    name: Blockdaemon
    email: info@blockdaemon.com
    url: https://blockdaemon.com
  x-logo:
    url: https://storage.googleapis.com/blockdaemon-app-static-images/marketing/PNG/dark-logo.png
    altText: Blockdaemon logo
servers:
- url: https://svc.blockdaemon.com
security:
- bearerAuth: []
- apiKeyAuthHeader: []
tags:
- name: variable_values
paths:
  /streaming/v2/variables/{variable_id}/values:
    x-zuplo-path:
      pathMode: open-api
    get:
      tags:
      - variable_values
      summary: Get all Variable Values
      description: Returns all variables from the system that the user has access to
      operationId: findVariableValues
      parameters:
      - name: variable_id
        in: path
        description: ID of variable to fetch
        required: true
        schema:
          type: string
          format: uuid
          x-go-type: myuuid.UUID
          x-go-type-import:
            name: myuuid
            path: github.com/google/uuid
      responses:
        '200':
          description: Variable values returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VariableValue'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-zuplo-route:
        custom:
          product: ub_event_streaming
          fh: ubiquity
          target_service: stream-configurator
          billing_product: event-streaming
        corsPolicy: anything-goes
        handler:
          export: urlRewriteHandler
          module: $import(@zuplo/runtime)
          options:
            rewritePattern: service://bd-workloads-${context.custom.cluster}-k8s-cluster-aegis-stream-configurator-${env.UB_ENV}/variables/${params.variable_id}/values
        policies:
          inbound:
          - event-streaming-default-policy
          outbound: []
      x-operation-id-source: normalized
      x-operation-id-original: find variable values
    post:
      tags:
      - variable_values
      summary: Create a Variable Value
      description: Creates a new value for the specified variable. Duplicate values are not allowed.
      operationId: addVariableValue
      parameters:
      - name: variable_id
        in: path
        description: ID of the variable
        required: true
        schema:
          type: string
          format: uuid
          x-go-type: myuuid.UUID
          x-go-type-import:
            name: myuuid
            path: github.com/google/uuid
      requestBody:
        description: The variable value to add
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewVariableValue'
      responses:
        '201':
          description: Variable value created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VariableValue'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-zuplo-route:
        custom:
          product: ub_event_streaming
          fh: ubiquity
          target_service: stream-configurator
          billing_product: event-streaming
        corsPolicy: anything-goes
        handler:
          export: urlRewriteHandler
          module: $import(@zuplo/runtime)
          options:
            rewritePattern: service://bd-workloads-${context.custom.cluster}-k8s-cluster-aegis-stream-configurator-${env.UB_ENV}/variables/${params.variable_id}/values
        policies:
          inbound:
          - event-streaming-default-policy
          outbound: []
      x-operation-id-source: normalized
      x-operation-id-original: add variable value
    delete:
      tags:
      - variable_values
      summary: Delete Variable Value by Value
      description: Deletes a specific variable value by matching the variable's ID and a provided value. Use this endpoint when you know the exact value you want to delete.
      operationId: deleteVariableValueByValue
      parameters:
      - name: variable_id
        in: path
        description: ID of variable to delete
        required: true
        schema:
          type: string
          format: uuid
          x-go-type: myuuid.UUID
          x-go-type-import:
            name: myuuid
            path: github.com/google/uuid
      - name: value
        in: query
        description: The specific value to delete from the variable
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Variable value deleted
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-zuplo-route:
        custom:
          product: ub_event_streaming
          fh: ubiquity
          target_service: stream-configurator
          billing_product: event-streaming
        corsPolicy: anything-goes
        handler:
          export: urlRewriteHandler
          module: $import(@zuplo/runtime)
          options:
            rewritePattern: service://bd-workloads-${context.custom.cluster}-k8s-cluster-aegis-stream-configurator-${env.UB_ENV}/variables/${params.variable_id}/values
        policies:
          inbound:
          - event-streaming-default-policy
          outbound: []
      x-operation-id-source: normalized
      x-operation-id-original: delete variable value by value
  /streaming/v2/variables/{variable_id}/values/{id}:
    x-zuplo-path:
      pathMode: open-api
    delete:
      tags:
      - variable_values
      summary: Delete Variable Value by ID
      description: Deletes a specific variable value using its ID.
      operationId: deleteVariableValue
      parameters:
      - name: variable_id
        in: path
        description: ID of variable to delete
        required: true
        schema:
          type: string
          format: uuid
          x-go-type: myuuid.UUID
          x-go-type-import:
            name: myuuid
            path: github.com/google/uuid
      - name: id
        in: path
        description: ID of the specific variable value to delete
        required: true
        schema:
          type: string
          format: uuid
          x-go-type: myuuid.UUID
          x-go-type-import:
            name: myuuid
            path: github.com/google/uuid
      responses:
        '204':
          description: Variable value deleted
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-zuplo-route:
        custom:
          product: ub_event_streaming
          fh: ubiquity
          target_service: stream-configurator
          billing_product: event-streaming
        corsPolicy: anything-goes
        handler:
          export: urlRewriteHandler
          module: $import(@zuplo/runtime)
          options:
            rewritePattern: service://bd-workloads-${context.custom.cluster}-k8s-cluster-aegis-stream-configurator-${env.UB_ENV}/variables/${params.variable_id}/values/${params.id}
        policies:
          inbound:
          - event-streaming-default-policy
          outbound: []
      x-operation-id-source: normalized
      x-operation-id-original: delete variable value
components:
  schemas:
    NewVariableValue:
      type: object
      required:
      - value
      properties:
        value:
          description: The value to assign to the variable. Can be a string, number, or boolean.
          anyOf:
          - $ref: '#/components/schemas/Number'
          - $ref: '#/components/schemas/String'
          - $ref: '#/components/schemas/Bool'
    Number:
      type: number
    VariableValue:
      type: object
      required:
      - id
      - value
      properties:
        id:
          type: string
          format: uuid
          x-go-type: myuuid.UUID
          x-go-type-import:
            name: myuuid
            path: github.com/google/uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        value:
          anyOf:
          - $ref: '#/components/schemas/Number'
          - $ref: '#/components/schemas/String'
          - $ref: '#/components/schemas/Bool'
    Error:
      type: object
      x-go-type: ApiError
      x-go-name: ApiError
      required:
      - message
      - type
      - code
      - status
      - timestamp
      properties:
        type:
          type: string
          description: HTTP error type
          example: bad-request
        code:
          type: integer
          description: Numeric error code
          example: 16384
        status:
          type: integer
          description: HTTP status of the error
          example: 500
        message:
          type: string
          description: Long error description
          example: Oops theres been an internal error handling
        timestamp:
          type: string
          description: Long error description
          example: Oops theres been an internal error handling
    Bool:
      type: boolean
    String:
      type: string
  securitySchemes:
    apiKeyAuthHeader:
      type: apiKey
      in: header
      name: X-API-Key
      description: 'Unlock higher TPS - Create your own API key in the [Blockdaemon App](https://app.blockdaemon.com).

        '
      x-default: 2go1YqUcuAr4WZ2-3WgSD3c7qpatZqQuNWhTVBldKZnTSUtw
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Opaque
      description: '[Legacy Auth] Unlock higher TPS - Create your own API key in the [Blockdaemon App](https://app.blockdaemon.com).

        '
      x-default: 2go1YqUcuAr4WZ2-3WgSD3c7qpatZqQuNWhTVBldKZnTSUtw
