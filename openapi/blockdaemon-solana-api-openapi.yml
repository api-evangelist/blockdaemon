          example: mainnet
          readOnly: true
          type: string
        stake_accounts:
          description: List of stake account addresses to look up
          items:
            pattern: ^[1-9A-HJ-NP-Za-km-z]{43,44}$
            type: string
          minItems: 1
          type: array
      required:
      - stake_accounts
      type: object
    solanaGetStakesResponse:
      properties:
        network:
          example: mainnet
