        amount:
          $ref: '#/components/schemas/Lamport'
        stake_account_address:
          $ref: '#/components/schemas/SolanaPublicKey'
        stake_account_authority:
          $ref: '#/components/schemas/SolanaPublicKey'
        withdrawal_authority:
          $ref: '#/components/schemas/SolanaPublicKey'
        delegator_address:
          $ref: '#/components/schemas/SolanaPublicKey'
        vote_account:
