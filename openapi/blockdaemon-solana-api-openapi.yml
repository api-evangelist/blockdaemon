        withdrawer_pubkey:
          description: SDK-enriched fields
          pattern: ^[1-9A-HJ-NP-Za-km-z]{43,44}$
          type: string
      type: object
    solanaDeactivateTransactionRequest:
      description: Request to build a deactivate transaction
      properties:
        delegator_address:
          description: Wallet that will pay the transaction fee.
          example: 75q6kcecNQhawj1dCmPWhfootfQBnZh7iWnNjoXTJv79
          pattern: ^[1-9A-HJ-NP-Za-km-z]{43,44}$
          type: string
        network:
          description: The target Solana network (allowed 'mainnet' or 'testnet').
          example: mainnet
          readOnly: true
          type: string
        stake_account_pubkey:
          description: Stake account to deactivate.
          example: 75q6kcecNQhawj1dCmPWhfootfQBnZh7iWnNjoXTJv79
          pattern: ^[1-9A-HJ-NP-Za-km-z]{43,44}$
          type: string
      required:
