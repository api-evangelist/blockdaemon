        deactivation_epoch:
          description: Epoch when deactivation will take effect
          example: 621
          format: int64
          type: integer
        was_active:
          description: Whether the stake account was active at build time
          example: true
          type: boolean
      type: object
    solanaStakeTransactionResponse:
      properties:
        estimated_fee:
          description: The estimated fee for the transaction.
          example: 1000000000
          format: int64
          type: integer
        instruction_count:
          description: The number of instructions in the transaction.
          example: 1
          format: int32
          minimum: 1
          type: integer
        metadata:
          $ref: '#/components/schemas/solanaStakeMetadata'
        network:
          description: The target Solana network (allowed 'mainnet' or 'testnet').
          example: mainnet
          readOnly: true
          type: string
        stake_account_pubkey:
          description: The address of the stake account.
          example: 75q6kcecNQhawj1dCmPWhfootfQBnZh7iWnNjoXTJv79
          pattern: ^[1-9A-HJ-NP-Za-km-z]{43,44}$
