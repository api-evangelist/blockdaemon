    ApiTxVerifyRequestSolana:
      title: Api Tx Verify Request Solana
      type: object
      properties:
        tx:
          anyOf:
          - $ref: '#/components/schemas/ApiTxCreateRequestSolana'
          - $ref: '#/components/schemas/ApiTxCreateTokenRequestSolana'
        raw_encoded_tx:
          type: string
          description: The base64 encoded transaction
          example: 
