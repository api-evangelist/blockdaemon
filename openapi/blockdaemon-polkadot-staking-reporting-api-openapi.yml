openapi: 3.2.0
info:
  version: 1.0.0
  title: Polkadot Staking Reporting API
  description: '### Protocols

    The following protocols are currently supported:

    * Cardano

    * Cosmos

    * Ethereum

    * NEAR

    * Polkadot

    * Polygon

    * Solana'
  contact:
    name: Blockdaemon
    email: support@blockdaemon.com
    url: https://blockdaemon.com
  x-logo:
    url: logo.png
servers:
- url: https://svc.blockdaemon.com/reporting/staking
  description: Production server
security:
- apiKeyAuthHeader: []
- bearerAuth: []
tags:
- name: Polkadot Staking Reporting
paths:
  /v1/polkadot/mainnet/nominator/active:
    post:
      tags:
      - Polkadot Staking Reporting
      summary: Verify the Staking Activity of Multiple Nominators
      description: Returns true if a given nominator address is active, false otherwise (for each address from a list).
      operationId: VerifyStakingActivityNominators
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StakingAddresses2'
        required: true
      responses:
        '200':
          description: Staking Activity of Multiple Nominators
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List_StakingAddressActive'
              example:
              - 11VR4pF6c7kfBhfmuwwjWY3FodeYBKWx7ix2rsRCU2q6hqJ: true
              - 148AkdkKUfwUZfyubZQKPNqbGjGvRiFZ3bv25aPdXVANt7Bi: true
        '400':
          description: 'Invalid value for: body'
          content:
            text/plain:
              schema:
                type: string
              example: 'Invalid value for: body (expected value to pass validation: Must be a valid public address, but was: StakingAddresses(List(11VR4pF6c7k)))'
        '401':
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '404':
          description: Not Found
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/NotFound'
        '405':
          description: Method Not Allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MethodNotAllowed'
        '429':
          description: Rate Limit Exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequests'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerError'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceUnavailable'
  /v1/polkadot/mainnet/nominator/active/{address}:
    get:
      tags:
      - Polkadot Staking Reporting
      summary: Verify the Staking Activity of a Nominator
      description: Returns true if a given nominator address is active, false otherwise.
      operationId: VerifyStakingActivityNominator
      parameters:
      - $ref: '#/components/parameters/StakingAddress'
      responses:
        '200':
          description: Staking Activity of a Nominator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StakingAddressActive'
              example:
                1FmuvFXSkL988k8NQHeq4HDR43sHo3eEm2BbDhfuSeBs3qi: false
        '400':
          description: 'Invalid value for: path parameter address'
          content:
            text/plain:
              schema:
                type: string
              example: 'Invalid value for: path parameter address (expected value to match: ^1[a-zA-Z0-9]{40,50}$, but was: k8NQHeq4HDR43sHo3eEm2BbDhfuSeBs3qi)'
        '401':
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '404':
          description: Not Found
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/NotFound'
        '405':
          description: Method Not Allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MethodNotAllowed'
        '429':
          description: Rate Limit Exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequests'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerError'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceUnavailable'
  /v1/polkadot/mainnet/nominator/history:
    post:
      tags:
      - Polkadot Staking Reporting
      summary: Get a List of Historical Stake & Rewards for Multiple Nominators
      description: Returns the historical stake & rewards allocated to multiple given nominator addresses.
      operationId: GetHistoricalStakeAndRewardsNominators
      parameters:
      - $ref: '#/components/parameters/aggregate'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StakingQuery2'
        required: true
      responses:
        '200':
          description: List of Historical Stake & Rewards for Multiple Nominators
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List_RewardsFormat'
              example:
              - address: several
                currency: DOT
                return: 1359.8256990532
                timeStart: '2023-03-06T00:00:00Z'
                timeEnd: '2023-03-12T23:59:59Z'
                timeAggregation: weekly
                startingBalance: 1226000.10603583
                metadata:
                  delegationAddress: several
              - address: 148AkdkKUfwUZfyubZQKPNqbGjGvRiFZ3bv25aPdXVANt7Bi
                currency: DOT
                return: 223.974322146254
                timeStart: '2023-03-13T00:00:00Z'
                timeEnd: '2023-03-19T23:59:59Z'
                timeAggregation: weekly
                startingBalance: 407000
                metadata:
                  delegationAddress: 14j9pbn4BjDd3fRuVWW5Ev6QYdUbLC1JbLZCnUdA6VpfLiic
        '400':
          description: Invalid value for query parameter or body, or both.
          content:
            text/plain:
              schema:
                type: string
              example: 'Invalid value for: body (Long at ''fromTime'', Attempt to decode value on failed cursor at ''toTime'')'
        '401':
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '404':
          description: Not Found
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/NotFound'
        '405':
          description: Method Not Allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MethodNotAllowed'
        '429':
          description: Rate Limit Exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequests'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerError'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceUnavailable'
