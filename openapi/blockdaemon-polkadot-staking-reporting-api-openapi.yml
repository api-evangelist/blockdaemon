components:
  schemas:
    ServiceUnavailable:
      description: Service Unavailable
      allOf:
      - $ref: '#/components/schemas/error'
      example:
        status: 503
        code: '503'
        title: Unavailable
        detail: https://blockdaemon.com/documentation/
    TooManyRequests:
      description: Rate limit exceeded.
      allOf:
      - $ref: '#/components/schemas/error'
      example:
        status: 429
        code: '429'
        title: Too Many Requests
        detail: Request rate limits have been exceeded. Try again after a few seconds.
    ServerError:
      description: An internal server error happened.
      allOf:
      - $ref: '#/components/schemas/error'
      example:
        status: 500
        code: '500'
        title: Internal Server Error
        detail: https://blockdaemon.com/documentation/
    ValidatorRewardsFormat1:
      required:
      - address
      - currency
      - return
      - timeStart
      - timeEnd
      - timeAggregation
      - startingBalance
      - metadata
      type: object
      properties:
        address:
          type: string
          description: The public address.
        currency:
          type: string
          description: The cryptocurrency protocol the request relates to.
        return:
          type: number
          format: float
          description: The sum of the rewards for the previous UTC day. Rewards are recorded per session (four hours on Polkadot), and calculated per era (twenty-four hours on Polkadot). Thus, rewards will be calculated once per day on Polkadot.
        timeStart:
          type: string
          description: The timestamp, in UTC, that marks the start of the period covered.
        timeEnd:
          type: string
          description: The timestamp, in UTC, that marks the end of the period covered.
        timeAggregation:
          description: The agregation period, one of `era`, `day`, `week`, or `month`.
          type: string
        startingBalance:
          type: number
          description: The staked amount at the beginning of the previous UTC day (at the timeStart).
          format: float
        metadata:
          $ref: '#/components/schemas/MetadataPolkadot'
    List_StakingStatus1:
      type: array
      items:
        $ref: '#/components/schemas/StakingStatus2'
    StakingAddressActive:
      required:
      - address
      - active
      type: object
      properties:
        address:
          type: string
          description: The address you are checking the staking activity of.
        active:
          type: boolean
          example: Staking activity status.
          description: '`true` if the address is active, `false` otherwise.'
    error:
      type: object
      properties:
        status:
          type: integer
          description: The HTTP status of the error.
          example: 400
        code:
          type: integer
          description: The numeric error code.
          example: 16384
        title:
          type: string
          description: The short error description.
          example: Invalid Address
        detail:
          type: string
          description: The long error description.
          example: The requested address is invalid on this protocol
    SingleStakingQuery2:
      required:
      - fromTime
      - toTime
      - timeUnit
      type: object
      properties:
        fromTime:
          type: integer
          format: int64
          description: The millisecond timestamp from which you wish to retrieve the historical stake and rewards.
          default: 1678174507000
          example: 1678174507000
        toTime:
          type: integer
          format: int64
          description: The millisecond timestamp until which you wish to retrieve the historical stake and rewards.
          default: 1678779307000
          example: 1678779307000
        timeUnit:
          $ref: '#/components/schemas/TimeUnit2'
    List_RewardsFormat:
      type: array
      items:
        $ref: '#/components/schemas/RewardsFormat1'
    StakingStatus2:
      required:
      - address
      - status
      - commission
      - activationDate
      type: object
      properties:
        address:
          type: string
          description: The user-defined address.
        status:
          type: string
          description: The staking status of the user-defined address.
        commission:
          type: integer
          format: int64
          description: The validator commission rate. It refers to the percentage of staking rewards that validators are allowed to charge for their services, it varies across validators. Validators have the freedom to choose their commission rate based on various factors, such as their operational costs, infrastructure requirements, and the value they provide to the network.
        activationDate:
          type: string
          format: date
          description: The activation date.
    RewardsFormat1:
      required:
      - address
      - currency
      - return
      - timeStart
      - timeEnd
      - timeAggregation
      - startingBalance
      - metadata
      type: object
      properties:
        address:
          type: string
          description: The public address.
        currency:
          type: string
          description: The cryptocurrency protocol the request relates to.
        return:
          type: number
          format: float
          description: The sum of the rewards for the previous UTC day. Rewards are recorded per session (four hours on Polkadot), and calculated per era (twenty-four hours on Polkadot). Thus, rewards will be calculated once per day on Polkadot.
        timeStart:
          type: string
          description: The timestamp, in UTC, that marks the start of the period covered.
        timeEnd:
          type: string
          description: The timestamp, in UTC, that marks the end of the period covered.
        timeAggregation:
          description: The agregation period, one of `era`, `day`, `week`, or `month`.
          type: string
        startingBalance:
          type: number
          description: The staked amount at the beginning of the previous UTC day (at the timeStart).
          format: float
        metadata:
          $ref: '#/components/schemas/Metadata1'
    List_ValidatorRewardsFormat:
      type: array
      items:
        $ref: '#/components/schemas/ValidatorRewardsFormat1'
    StakingAddresses2:
      type: object
      properties:
        addresses:
          type: array
          description: A list of addresses.
          default:
          - 11VR4pF6c7kfBhfmuwwjWY3FodeYBKWx7ix2rsRCU2q6hqJ
          items:
            type: string
    MetadataPolkadot:
      required:
      - commission
      - validatorRewards
      - commissionRewards
      type: object
      description: The protocol specific data.
      properties:
        commission:
          type: number
          format: float
          description: The validator commission rate. It refers to the percentage of staking rewards that validators are allowed to charge for their services, it varies across validators. It’s the fee that nominators are charged by the validator. Validators have the freedom to choose their commission rate based on various factors, such as their operational costs, infrastructure requirements, and the value they provide to the network.
        validatorRewards:
          type: number
          format: float
          description: The rewards the validator has earned from staking activity on the network.
        commissionRewards:
          type: number
          format: float
          description: The fee a validator earned from its nominators.
        era:
          type: integer
          format: int32
          description: A unit of time. An era’s duration is exactly 1 day (24 hours). The start and end times are always 15:36:18.003 UTC. Each era consists of 6 epochs, each of which consists of 2400 slots for Polkadot.
    Metadata1:
      required:
      - delegationAddress
      - era
      type: object
      description: The protocol specifc data.
      properties:
        delegationAddress:
          type: string
          description: The delegation address.
        era:
          type: integer
          format: int32
          description: A unit of time. An era’s duration is exactly 1 day (24 hours). The start and end times are always 15:36:18.003 UTC. Each era consists of 6 epochs, each of which consists of 2400 slots for Polkadot.
    List_StakingAddressActive:
      type: array
      items:
        $ref: '#/components/schemas/StakingAddressActive'
    NotFound:
      description: Not Found
      items:
        type: string
      example: Not Found
    UnauthorizedError:
      description: Invalid or expired token.
      allOf:
      - $ref: '#/components/schemas/error'
      example:
        status: 401
        code: '401'
        title: Unauthorized
        detail: https://blockdaemon.com/documentation/
    MethodNotAllowed:
      description: Method Not Allowed
      allOf:
      - $ref: '#/components/schemas/error'
      example:
        status: 405
        code: 405
        title: method not allowed
        detail: https://blockdaemon.com/documentation/
    StakingQuery2:
      required:
      - fromTime
      - toTime
      - timeUnit
      type: object
      properties:
        fromTime:
          type: integer
          format: int64
          description: The millisecond timestamp from which you wish to retrieve the historical stake and rewards.
          default: 1678174507000
          example: 1678174507000
        toTime:
          type: integer
          format: int64
          description: The millisecond timestamp until which you wish to retrieve the historical stake and rewards.
          default: 1678779307000
          example: 1678779307000
        timeUnit:
          $ref: '#/components/schemas/TimeUnit2'
        addresses:
          type: array
          description: A list of addresses.
          default:
          - 11VR4pF6c7kfBhfmuwwjWY3FodeYBKWx7ix2rsRCU2q6hqJ
          items:
            type: string
    TimeUnit2:
      type: string
      default: week
      description: This parameter is used to aggregate rewards. It must be one of `era`, `day`, `week`, or `month`.
      enum:
      - era
      - day
      - week
      - month
  parameters:
    StakingAddress:
      in: path
      name: address
      description: A single public address to check.
      required: true
      schema:
        type: string
        default: 11VR4pF6c7kfBhfmuwwjWY3FodeYBKWx7ix2rsRCU2q6hqJ
        pattern: ^1[a-zA-Z0-9]{40,50}$
      example: 11VR4pF6c7kfBhfmuwwjWY3FodeYBKWx7ix2rsRCU2q6hqJ
    ValidatorAddress:
      in: path
      name: address
      description: A single public address to check.
      required: true
      schema:
        type: string
